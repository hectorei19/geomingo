<style>
/* Silhouette: one big shape in a square frame, the answer box under it; the daily nine as a 3 x 3 board of small frames */
.silbox{position:relative;width:100%;max-width:340px;align-self:center;aspect-ratio:1;background:var(--sheet);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:14px;
  background-image:linear-gradient(var(--sea-soft) 1px,transparent 1px),linear-gradient(90deg,var(--sea-soft) 1px,transparent 1px);background-size:25% 25%;background-position:-1px -1px}
.silbox .sil{width:100%;height:100%;display:block;color:var(--ink)}
.silbox.right{border-color:var(--good)}.silbox.right .sil{color:var(--good)}
.silbox.wrong{border-color:var(--bad)}.silbox.wrong .sil{color:var(--bad)}
.silbox .turn{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:.7rem;color:var(--ink-2)}
.play{display:flex;flex-direction:column;gap:10px;width:100%}
.ans{display:flex;flex-direction:column;gap:6px}
.ans input{width:100%;border:1.5px solid var(--ink);border-radius:5px;padding:12px;font-size:1.1rem;background:var(--paper)}
.ans .sugg{max-height:none}
.tries{display:flex;align-items:center;gap:8px;font-size:.95rem;color:var(--ink-2)}
.tries i{width:12px;height:12px;border-radius:50%;background:var(--flamingo)}
.tries i.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule)}
.tries .cnt{margin-left:auto;font-family:var(--mono);font-size:.8rem}
.missed{margin:0;font-size:.92rem;color:var(--ink-2)}
.reveal{display:flex;align-items:center;gap:12px;background:var(--sheet);border:2px solid var(--good);border-radius:16px;padding:10px 12px}
.reveal.wrong{border-color:var(--bad)}
.reveal .flag{width:48px;height:36px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px var(--rule);flex:none;background:var(--rule)}
.reveal .rn{display:flex;flex-direction:column;min-width:0}
.reveal .rn b{font-family:var(--display);font-weight:700;font-size:1.4rem;line-height:1.1}
.reveal .rn small{color:var(--ink-2);font-size:.9rem}
.reveal .rpts{margin-left:auto;font-family:var(--mono);font-size:.85rem;white-space:nowrap}
.streak{display:flex;gap:16px;font-size:.95rem;color:var(--ink-2)}
.streak b{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--ink);margin-right:4px}
.board9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:340px;align-self:center}
.board9 button{aspect-ratio:1;background:var(--sheet);border:2px dashed var(--line);border-radius:14px;padding:6px;position:relative}
.board9 button .sil{width:100%;height:100%;display:block;color:var(--ink)}
.board9 button.sel{border:2px solid var(--flamingo);box-shadow:0 0 0 3px color-mix(in srgb,var(--flamingo) 30%,transparent)}
.board9 button.right{border-style:solid;border-color:var(--good);background:var(--p4-soft)}.board9 button.right .sil{color:var(--good)}
.board9 button.wrong{border-style:solid;border-color:var(--bad);background:var(--p0-soft)}.board9 button.wrong .sil{color:var(--bad)}
.board9 .n{position:absolute;top:3px;left:5px;font-family:var(--mono);font-size:.62rem;color:var(--ink-2)}
.board9 .nm{position:absolute;left:3px;right:3px;bottom:3px;font-size:.66rem;font-weight:700;line-height:1.05;text-align:center;background:var(--sheet);border-radius:3px;padding:1px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsq{grid-template-columns:repeat(3,1fr);width:60px}
.dsq i.mid{background:var(--p2)}
.dsq i.bad{background:var(--bad)}
.modes{max-width:320px;width:100%;align-self:center}
.difftag{font-family:var(--mono);font-size:.75rem;color:var(--sea);letter-spacing:.04em;text-transform:uppercase}
.osel{width:100%;border:1.5px solid var(--ink);border-radius:5px;padding:10px;font-size:1rem;background:var(--paper)}
.rank td:first-child,.rank th:first-child{width:28px}
.rank td:nth-child(2),.rank th:nth-child(2){text-align:left;font-family:var(--ui);font-weight:600}
.rank tr.me td{background:var(--sea-soft)}
.ready{display:flex}
@media (prefers-reduced-motion:no-preference){.silbox.pop{animation:pop .35s cubic-bezier(.3,1.6,.6,1)}}

<body>
<div class="wrap" id="app"></div>

<script src="countries.js?v=202610230100"></script>

<script src="../shared/minigames.js?v=202610260000"></script>
<!-- online rooms (With friends): Firebase, loaded after the page so today's board shows at once -->
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script defer src="firebase-config.js?v=202610230100"></script>
<!-- flags appear once a shape is answered; loaded after the page so the game shows at once -->
<script defer src="flags.js?v=202610230100"></script>
<script>
/* ---- one silhouette to name: the same piece in Solo, Daily and With friends ----
   A question is {c: country code, rot: turn in degrees (Hard), tries: wrong answers so far, st: 'play' | 'right' | 'wrong'}. */
const TRIES=3,DIFF_NAME={easy:'Easy',normal:'Normal',hard:'Hard'};
const DIFF_HINT={easy:'Well-known countries, north up',normal:'All 196 countries, north up',hard:'All 196, each shape turned'};
const newQ=(c,rot)=>({c,rot:rot||0,tries:[],st:'play'});
const flagSrc=c=>typeof FLAGS!=='undefined'&&FLAGS[c]?'data:image/svg+xml;utf8,'+encodeURIComponent(FLAGS[c]):'';
const contName={EU:'Europe',AS:'Asia',AF:'Africa',NA:'North and Central America',SA:'South America',OC:'Oceania'};
let query='',typing=false;
// apply an answer to a question; returns 'right', 'wrong' (a miss with tries left) or 'out' (last try used)
function answer(q,code){
  if(code===q.c){q.st='right';return 'right'}
  q.tries.push(code);if(q.tries.length>=TRIES){q.st='wrong';return 'out'}
  return 'wrong'}
function triesHTML(q,tkt){const left=TRIES-q.tries.length;
  return (tkt?(q.rot?`<span class="hint">Turned shape</span>`:''):`<div class="tries" aria-label="${left} ${left===1?'life':'lives'} left">Lives ${Array.from({length:TRIES},(_,i)=>`<i class="${i<left?'':'off'}"></i>`).join('')}${q.rot?`<span class="cnt">Turned shape</span>`:''}</div>`)+
    (q.tries.length?`<p class="missed">Not ${q.tries.map(c=>esc(byCode[c].n)).join(', not ')}.</p>`:'')}
function suggHTML(q){if(!query)return '';const res=searchCountries(query,null,6);
  if(!res.length)return `<li class="hint" style="padding:8px 2px">No country matches “${esc(query)}”.</li>`;
  return res.map(c=>{const t=q.tries.includes(c.c);return `<li><button data-g="${c.c}" ${t?'disabled':''}>${esc(c.n)}${t?'<span class="tag">not it</span>':''}</button></li>`}).join('')}
function answerBoxHTML(q,extra){
  return `<div class="ans"><input id="q" placeholder="Type a country…" autocomplete="off" autocapitalize="words" spellcheck="false" value="${esc(query)}" aria-label="Type a country"><ul class="sugg" id="sugg">${suggHTML(q)}</ul></div>${extra||''}`}
function revealHTML(q,note){const c=byCode[q.c],ok=q.st==='right';
  return `<div class="reveal ${ok?'':'wrong'}"><img class="flag" src="${flagSrc(q.c)}" alt=""><span class="rn"><b>${esc(c.n)}</b><small>${ok?(q.tries.length?'Right, at try '+(q.tries.length+1):'Right, first try'):'The answer'} · ${contName[c.r]||''}</small></span>${note?`<span class="rpts">${note}</span>`:''}</div>`}
function silBoxHTML(q,big){const cls=q.st==='right'?'right':q.st==='wrong'?'wrong':'';
  return `<div class="silbox ${cls}${big?' pop':''}">${silSVG(q.c,q.rot)}</div>`}
// the answer box: typing filters the list; a tap or Enter (first match) answers
function bindAnswer(q,onPick){const box=$('q');if(!box)return;
  const draw=()=>{const u=$('sugg');if(u){u.innerHTML=suggHTML(q);u.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>onPick(b.dataset.g))}};
  box.oninput=e=>{query=e.target.value;draw()};
  box.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const m=searchCountries(query,null,6).filter(c=>!q.tries.includes(c.c));if(m[0])onPick(m[0].c)}};
  draw();
  // the box gets the focus only once you have started, so phones do not open the keyboard on arrival
  if(query||typing)setTimeout(()=>{box.focus();box.setSelectionRange(box.value.length,box.value.length)},0)}
// Mingo reacts to each answer in his bubble above the shape
const tk=Geomingo.tk;
const triesTxt=q=>{const n=TRIES-q.tries.length;return n+' '+(n===1?'life':'lives')+' left.'};
function feedback(q,res,code,key){
  if(res==='right'){Geomingo.stamp('silhouette',byCode[q.c].n);say(key,'happy','Stamped: '+byCode[q.c].n+'.',q.tries.length?'Got it on try '+(q.tries.length+1)+'.':'First try.')}
  else if(res==='wrong')say(key,'sad','Denied entry.',`It's not ${byCode[code].n}. ${triesTxt(q)}`);
  else say(key,'sad','It was '+byCode[q.c].n+'.',`Not ${byCode[code].n}. No lives left for this one.`)}
const silKey=()=>view==='train'&&T?'train:'+T.diff:D?'sil:'+D.date:'';

/* ---- Solo: unlimited shapes, one after another, at the level you choose ----
   Each level deals from its own shuffled deck, so no country comes back until the deck is used up. */
let T=null;
const trainStats=()=>load('sil-train',{});
function trainNext(){const pool=poolOf(T.diff).map(c=>c.c);
  if(!T.deck||!T.deck.length)T.deck=shuffled(pool,Math.random).filter(c=>c!==(T.q&&T.q.c));
  const c=T.deck.pop();T.q=newQ(c,T.diff==='hard'?hardTurn(Math.random):0);query='';typing=false}
function openTrain(){const st=trainStats();
  T={diff:load('sil-diff','normal'),streak:0,deck:null,q:null,best:st};trainNext();view='train';render();window.scrollTo(0,0)}
// Solo's start screen, as in every game: the level, then Start game
function openSolo(){view='solo';query='';typing=false;render();window.scrollTo(0,0)}
function soloHTML(){const diff=load('sil-diff','normal');
  return header('Silhou<span>ette</span>','Solo')+`<section class="panel">
    <div class="backline"><button class="linkbtn" id="home">← Back</button><span class="ht">Solo</span></div>
    <p class="hint">Practice on unlimited shapes, at your pace. No country comes back until you have seen them all.</p>
    <div class="field"><span class="label">Difficulty</span>${seg('diff',[['easy','Easy'],['normal','Normal'],['hard','Hard']],diff)}<p class="hint">${DIFF_HINT[diff]}.</p></div>
    <button class="primary" id="start">Start game</button></section>${quickRules(' Full rules in <b>How to play</b>.')}`}
function trainPick(code){const q=T.q;if(q.st!=='play')return;
  const res=answer(q,code);query='';typing=res==='wrong';
  const st=trainStats(),s=st[T.diff]||{n:0,ok:0,best:0};
  if(res!=='wrong'){s.n++;if(res==='right'){s.ok++;T.streak++;s.best=Math.max(s.best,T.streak)}else T.streak=0;st[T.diff]=s;store('sil-train',st)}
  feedback(q,res,code,silKey());render()}
function trainSkip(){const q=T.q;if(q.st!=='play')return;q.st='wrong';T.streak=0;
  const st=trainStats(),s=st[T.diff]||{n:0,ok:0,best:0};s.n++;st[T.diff]=s;store('sil-train',st);render()}
function trainHTML(){const q=T.q,s=trainStats()[T.diff]||{best:0},done=q.st!=='play';
  let h=header('Silhou<span>ette</span>','Solo');
  h+=`<div class="backline"><button class="linkbtn" id="soloback">← Back</button><span class="ht">Solo</span></div>`;
  // the ticket, as in every game: Mingo on top, then who is travelling, the level, the run and the tries left
  h+=Geomingo.ticket(moodHTML(silKey(),'pass','Whose shape is this?','Type its name. Your best run at '+DIFF_NAME[T.diff]+': '+(s.best||0)+'.'),
    tk('Traveller',esc(Geomingo.traveller()),'tk-name')+tk('Class',DIFF_NAME[T.diff])+tk('In a row',T.streak,'tk-pts')+tk('Lives',livesHTML(TRIES-q.tries.length,TRIES),'tk-gs'));
  h+=`<section class="panel play">${silBoxHTML(q,done)}`;
  if(done)h+=revealHTML(q)+`<button class="primary" id="tnext">Next shape</button>`;
  else h+=triesHTML(q,true)+answerBoxHTML(q,giveUpHTML());
  return h+`</section>`+(done?'':quickRules(' Full rules in <b>How to play</b>.'))}

/* ---- Daily: nine shapes on a 3 x 3 board, the same for everyone, one board a day at Normal level ----
   The level shuffles its countries once per cycle (same order for everyone, from the cycle number) and deals
   nine a day, so no country comes back until the cycle is over. The day's save keeps one entry per level
   (only Normal since there is one daily board; Easy and Hard live on in Solo and With friends). */
const DAILY_FIRST='2026-10-22',DAILY_N=9,DAILY_LV='normal';
function dailyBoard(key,diff){
  const codes=poolOf(diff).map(c=>c.c).sort(),days=Math.floor(codes.length/DAILY_N),n=dayNum(key,DAILY_FIRST)-1;
  const cycle=Math.floor(n/days),i=((n%days)+days)%days;
  const deck=shuffled(codes,rng(seedOf(`silhouette-${diff}-cycle-${cycle}`))).slice(i*DAILY_N,(i+1)*DAILY_N);
  const turn=rng(seedOf(`silhouette-hard-${key}`));
  return deck.map(c=>newQ(c,diff==='hard'?hardTurn(turn):0))}
let D=null;
const dailyAll=()=>{const d=load('sil-daily',null);return d&&d.date===todayKey()?d:{date:todayKey(),over:false}};
function dailyGame(){const d=dailyAll(),diff=DAILY_LV;
  return d[diff]||{diff,date:todayKey(),num:dayNum(todayKey(),DAILY_FIRST),qs:dailyBoard(todayKey(),diff),sel:0,over:false}}
function dailySave(){if(!D)return;
  if(D.arch){const a=load('sil-arch',{});a[D.date]=D;store('sil-arch',a);return}
  const d=dailyAll();d[D.diff]=D;d.over=d.over||D.over;store('sil-daily',d);
  if(D.over){const h=load('sil-hist',{}),day=h[D.date]||{};if(day[D.diff]==null){day[D.diff]=D.qs.filter(q=>q.st==='right').length;h[D.date]=day;store('sil-hist',h);if(!TESTDAY)Geomingo.account.done('sil-'+D.diff)}}}
function dailyPick(code){const q=D.qs[D.sel];if(!q||q.st!=='play')return;
  const res=answer(q,code);query='';typing=res==='wrong';
  if(res!=='wrong'){const next=D.qs.findIndex((x,i)=>i>D.sel&&x.st==='play'),any=D.qs.findIndex(x=>x.st==='play');
    D.justDone=D.sel;if(any<0)D.over=true;else D.sel=next>=0?next:any}
  feedback(q,res,code,silKey());dailySave();
  if(D.over&&view==='home')view='daily';
  render();if(D.over)window.scrollTo(0,0)}
const rightOf=G=>G.qs.filter(q=>q.st==='right').length;
const sq=q=>q.st==='right'?(q.tries.length?'🟨':'🟩'):'🟥';
function dailyShareText(G){return `${Geomingo.share('Silhouette')} #${G.num}${G.arch?' (archive)':''} — ${rightOf(G)}/9\n${[0,3,6].map(i=>G.qs.slice(i,i+3).map(sq).join('')).join('\n')}`}
const dailyShare=G=>dailyShareText(G)+"\n\nPlay today's Silhouette: "+pageLink();
// the archive: past daily boards, one try each on this device
const archDay=k=>{const e=load('sil-hist',{})[k];if(!e)return null;const n=Math.max(0,...Object.values(e).filter(x=>typeof x==='number'));return n+'/9'};
function openArchive(){view='archive';query='';typing=false;render();window.scrollTo(0,0)}
function playArchive(k){if(archDay(k)){toast('You played this board on its day.');return}
  const a=load('sil-arch',{});D=a[k]||{diff:DAILY_LV,date:k,num:dayNum(k,DAILY_FIRST),qs:dailyBoard(k,DAILY_LV),sel:0,over:false,arch:true};
  query='';typing=false;view='daily';dailySave();render();window.scrollTo(0,0)}
const archSq=G=>`<span class="dsq" aria-hidden="true">${G.qs.map(q=>`<i class="${q.st==='right'?(q.tries.length?'mid':'on'):q.st==='wrong'?'bad':''}"></i>`).join('')}</span>`;
const archiveView=()=>header('Silhou<span>ette</span>','Archive')+archiveHTML({first:DAILY_FIRST,label:'Board',num:k=>dayNum(k,DAILY_FIRST),
  played:archDay,saved:k=>load('sil-arch',{})[k]||null,done:g=>[rightOf(g)+'/9',archSq(g)]});
function boardHTML(G){const sel=G.over?-1:G.sel;
  return `<div class="board9" role="group" aria-label="Today's nine shapes">${G.qs.map((q,i)=>{const cls=[i===sel?'sel':'',q.st==='right'?'right':q.st==='wrong'?'wrong':''].join(' ');
    return `<button data-tile="${i}" class="${cls}" aria-label="Shape ${i+1}${q.st==='play'?'':': '+esc(byCode[q.c].n)}">${silSVG(q.c,q.rot)}<span class="n">${i+1}</span>${q.st!=='play'?`<span class="nm">${esc(byCode[q.c].n)}</span>`:''}</button>`}).join('')}</div>`}
function dailyPlayHTML(G,tkt){const q=G.qs[G.sel],last=G.justDone!=null?G.qs[G.justDone]:null;G.justDone=null;
  let h=boardHTML(G);
  if(last&&last.st!=='play')h+=revealHTML(last);
  // the selected square is the shape being answered: no big copy of it, so the answer box sits right under the board
  if(!G.over&&q){h+=(tkt?'':`<span class="label">Shape ${G.sel+1} of 9 · ${rightOf(G)} right so far</span>`)+triesHTML(q,tkt)+answerBoxHTML(q)+giveUpHTML()}
  return `<div class="play">${h}</div>`}
function verdict(G){const r=rightOf(G),first=G.qs.filter(q=>q.st==='right'&&!q.tries.length).length;
  return r===9?(first===9?{pose:'happy',t:'Full page. Nine of nine, all first try.',s:'Nine new stamps.'}:{pose:'happy',t:'Visited. Nine of nine.',s:first+' on the first try.'})
    :r>=6?{pose:'happy',t:'Visited. '+r+' of 9.',s:'Tap a shape to see its name.'}:r>=3?{pose:'think',t:'A few gaps in the pages. '+r+' of 9.',s:'Tap a shape to see its name.'}
    :{pose:'sad',t:'Rough crossing, this one.',s:r+' of 9. Solo helps.'}}
function dailyResultHTML(G){const r=rightOf(G),v=verdict(G);
  if(G.arch)return `<section class="panel">${Geomingo.hello(v.pose,v.t,v.s,{key:'res'})}<span class="label">Archive · Silhouette #${G.num}</span><p class="big">${r} of 9</p>
    <p class="hint">${r===9?'Every shape named.':'Tap a shape to see its name.'} Archive games don't count for the ranking or your streak.</p>
    <pre class="sharebox" id="share">${esc(dailyShareText(G))}</pre>
    <div class="row-btns"><button class="ghost" id="copy" style="flex:1">Share</button><button class="primary" id="archback" style="flex:1">Back to archive</button></div></section>`;
  return `<section class="panel">${Geomingo.hello(v.pose,v.t,v.s,{key:'res'})}<span class="label">Silhouette #${G.num}</span><p class="big">${r} of 9</p>
    <p class="hint">${r===9?'Every shape named.':'Tap a shape to see its name.'} Next board in ${nextIn()}.</p>
    <pre class="sharebox" id="share">${esc(dailyShareText(G))}</pre>
    <div class="row-btns"><button class="ghost" id="copy">Share</button>${nextGameBtn('silhouette')}</div>
    <button class="ghost" id="playsolo">Play Solo</button>
    ${allPlayedHTML('silhouette')}
    <span class="label">Your daily boards</span>${statsHTML(true)}</section>${rankingHTML()}`}
// today's ranking (signed-in players, first try of the day): shapes named, then fewer wrong tries, then who finished first
const rankingHTML=()=>Geomingo.account.rankingHTML('sil-'+DAILY_LV,{what:'board',score:r=>[r.s+'/9',r.m+' wrong '+(r.m===1?'try':'tries')]});
// signed in or out, today's boards arrived from another device, the ranking moved: show it (not while typing)
Geomingo.account.onChange((why,typing)=>{if(why==='adopt'&&D&&!D.arch&&D.date===todayKey()){D=dailyGame();liveKey=''}
  if(!typing&&!roomCode&&(view==='home'||view==='daily'&&D&&D.over))render()});
function openDaily(){D=dailyGame();query='';view='daily';render();window.scrollTo(0,0)}

/* ---- With friends: online rooms on Countries' Firebase Realtime Database ----

function dealShapes(cfg){const pick=(pool,n,not)=>shuffled(pool.map(c=>c.c).filter(c=>!not.includes(c)),Math.random).slice(0,n);
  if(cfg.fmt==='ramp'){const a=pick(poolOf('easy'),3,[]),b=pick(poolOf('normal').filter(c=>!c.e),4,a),h=pick(poolOf('normal'),3,[...a,...b]);
    return [...a.map(c=>({c,rot:0,d:'easy'})),...b.map(c=>({c,rot:0,d:'normal'})),...h.map(c=>({c,rot:hardTurn(Math.random),d:'hard'}))]}
  let codes=pick(poolOf(cfg.diff,cfg.cont),ROUNDS,[]);
  if(codes.length<ROUNDS)codes=[...codes,...pick(poolOf('normal',cfg.cont),ROUNDS-codes.length,codes)];

      players:{[ME]:{name:setup.fname,t:TS(),on:true}}});

    const res=await db.ref('rooms/'+code).transaction(r=>{
      if(!r)return r;

      r.players=r.players||{};
      if(r.players[ME]){r.players[ME].name=setup.fname;r.players[ME].on=true;return r}
      if(r.status!=='lobby'){why='started';return}
      if(Object.keys(r.players).length>=MAXP){why='full';return}
      r.players[ME]={name:setup.fname,t:now(),on:true};return r});
    const val=res.snapshot.val();
    if(!val){toast('No room called '+code+'. Check the code.','bad');return}

      toast(why==='other'?code+' is a room of another game. Open that game to join it.':why==='version'?'You and the host have different versions of the game. Both of you reload the page, then try again.':why==='full'?'Room '+code+' already has '+MAXP+' players.':why==='started'?'That game has already started. Ask the host for a rematch.':'Could not join '+code+'.','bad');return}
    listenRoom(code)}catch(e){console.error(e);toast('Could not join. Check the connection and try again.','bad')}

      const left=lobbyOrder(r);if(!left.length)return null;if(r.host===ME)r.host=left[0];return r})}catch(e){}}

// everyone in the game who is still online has named the shape or used their tries
const doneOf=a=>!!a&&(a.ok||(a.tries||[]).length>=TRIES);

function syncRoom(){const r=room;const prev=O;

    for(let k=0;k<r.qs.length;k++){const a=(ans[k]||{})[pid];if(a&&a.ok&&(k<r.round||r.status!=='round'||k!==r.round))total+=a.pts||0}

    return {pid,i,name:p.name||'Gone',on:p.on!==false,total,cur}});

// a right answer: 500 points, plus up to 500 for speed (all of it when instant, none at the last second)
const pointsFor=ms=>500+Math.round(500*Math.max(0,1-ms/(SECS*1000)));
async function onlinePick(code){if(!O||O.status!=='round'||O.q.st!=='play')return;
  const t=now();if(t<O.start)return;
  if(t>O.end){toast("Time's up.",'bad');return}
  const right=code===O.q.c,ms=t-O.start,pts=pointsFor(ms),round=O.round;let res='wrong';
  try{const r=await roomRef.child('ans/'+round+'/'+ME).transaction(a=>{a=a||{tries:[]};a.tries=a.tries||[];
      if(a.ok||a.tries.length>=TRIES)return;
      if(right){a.ok=true;a.ms=ms;a.pts=pts}else a.tries.push(code);return a});
    if(!r.committed)return;
    const a=r.snapshot.val();res=right?'right':(a.tries||[]).length>=TRIES?'out':'wrong';
    query='';typing=res==='wrong';

  return `<table class="sttab rank"><tr><th>#</th><th>Player</th>${roundPts?'<th>Shape</th>':''}<th>Total</th></tr>${ranked().map((p,k)=>`<tr class="${p.pid===me?'me':''}"><td>${k+1}</td><td><span class="pin" style="${pinStyle(p.i)}"></span> ${esc(p.name)}${p.on?'':' <span class="tag">offline</span>'}</td>${roundPts?`<td>${p.cur.ok?'+'+p.cur.pts:p.cur.tries&&p.cur.tries.length?'✗':'–'}</td>`:''}<td>${p.total}</td></tr>`).join('')}</table>`}
// a chip per player: total so far, a tick once they are done with this shape
const chipsHTML=()=>O.players.map(p=>`<div class="tk-c pl ${doneOf(p.cur)?'on':''} ${p.on?'':'off'}"><i><span class="pin" style="${pinStyle(p.i)}"></span>${esc(p.name)}</i><b>${p.total}${doneOf(p.cur)?' ✓':''}</b></div>`).join('');
function onlineHTML(){const q=O.q,t=now(),ready=O.status==='round'&&t<O.start;
  let h=header('Silhou<span>ette</span>','room '+roomCode);
  if(O.status==='over'){const rk=ranked(),best=rk[0],tie=rk.length>1&&rk[1].total===best.total;
    h+=`<section class="panel"><span class="label">Room ${roomCode} · final ranking</span><p class="big">${tie?"It's a tie":esc(best.name)+' wins'}</p>${boardRowsHTML(false)}
      ${O.host?`<div class="row-btns"><button class="primary" id="orematch" style="flex:1">Rematch</button><button class="ghost" id="olobby" style="flex:1">Back to room</button></div>`:'<p class="hint">Waiting for the host to start a rematch.</p>'}</section>
      <div class="row-btns"><button class="ghost" id="leave" style="flex:1">Leave room</button></div>`;return h}
  const say=Geomingo.hello('pass','Shape '+(O.round+1)+' of '+O.n+'.',(DIFF_NAME[q.d]||'')+' level. '+TRIES+' tries; the sooner, the more points.');
  h+=Geomingo.ticket(say,`<div id="ochips" style="display:contents">${chipsHTML()}</div>`+tk('Time',`<span id="tleft">${ready?'Get ready…':O.status==='reveal'?'':Math.max(0,Math.ceil((O.end-t)/1000))+' s'}</span>`,'tk-name'),{timer:O.status==='round'&&!ready});
  h+=`<section class="panel play">`;
  if(ready)h+=`<div class="silbox ready"><p class="big" style="margin:auto;text-align:center;align-self:center">Get ready</p></div>`;
  else if(O.status==='reveal'){h+=silBoxHTML({...q,st:q.st==='right'?'right':'wrong'})+revealHTML({...q,st:q.st==='right'?'right':'wrong'},q.st==='right'?'+'+O.mine.pts:'')+`<span class="label">After shape ${O.round+1}</span>`+boardRowsHTML(true)}
  else{h+=silBoxHTML(q);
    if(q.st==='play')h+=triesHTML(q)+answerBoxHTML(q);
    else h+=`<p class="hint">${q.st==='right'?`Right: <b>+${O.mine.pts}</b>.`:'No tries left.'} Waiting for the others…</p>`}
  h+=`</section><div class="row-btns">${O.host?'<button class="ghost" id="oend" style="flex:1">End game</button>':''}<button class="ghost" id="leave" style="flex:1">Leave room</button></div>`;
  return h}
function bindOnline(){
  if($('fname'))$('fname').onchange=saveSetup;
  if($('jcode'))$('jcode').oninput=e=>{setup.join=e.target.value};
  if($('create'))$('create').onclick=createRoom;
  if($('join'))$('join').onclick=()=>joinRoom($('jcode').value);
  if($('jcode'))$('jcode').onkeydown=e=>{if(e.key==='Enter')joinRoom(e.target.value)};
  if($('copylink'))$('copylink').onclick=()=>{const t=pageLink('?room='+roomCode);
    if(navigator.share&&TOUCH){navigator.share({text:'Play Silhouette with me: '+t}).catch(()=>{});return}
    try{navigator.clipboard.writeText(t).then(()=>toast('Link copied.','good'),()=>toast('Copy the link above.'))}catch(e){toast('Copy the link above.')}};
  app.querySelectorAll('[data-seg="fmt"]').forEach(b=>b.onclick=()=>{setup.fmt=b.dataset.v;saveSetup();onlineAct('cfg')});
  app.querySelectorAll('[data-seg="odiff"]').forEach(b=>b.onclick=()=>{setup.diff=b.dataset.v;saveSetup();onlineAct('cfg')});
  if($('ocont'))$('ocont').onchange=e=>{setup.cont=e.target.value;saveSetup();onlineAct('cfg')};
  if($('leave'))$('leave').onclick=()=>{if(O&&O.status!=='over'&&!confirm('Leave the room? The game goes on without you.'))return;leaveRoom()};
  if($('ostart'))$('ostart').onclick=()=>onlineAct('start');
  if($('orematch'))$('orematch').onclick=()=>onlineAct('rematch');
  if($('olobby'))$('olobby').onclick=()=>onlineAct('lobby');
  if($('oend'))$('oend').onclick=()=>{if(confirm('End the game for everyone?'))onlineAct('end')};
  if(O&&O.status==='round'&&O.q.st==='play'&&now()>=O.start)bindAnswer(O.q,onlinePick)}

/* ---- home: today's board open and playable on top, then Solo and With friends, as in the other games ---- */
let view='home';
const seg=(name,opts,val)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-seg="${name}" data-v="${v}" aria-pressed="${String(v)===String(val)}">${l}</button>`).join('')}</div>`;
const dateLabel=k=>new Date(k+'T12:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
function homeHTML(){const key=todayKey();
  if(!D||D.arch||D.date!==key)D=dailyGame();
  let daily;
  if(D.over){const h=load('sil-hist',{});
    daily=`<button class="hcard" id="daily"><span class="hm">Today's shapes #${D.num} · done</span><span class="dsum"><span class="dsq" aria-hidden="true">${D.qs.map(q=>`<i class="${q.st==='right'?(q.tries.length?'mid':'on'):'bad'}"></i>`).join('')}</span><span class="dtxt"><span class="ht">${rightOf(D)} of 9</span><span class="hs">shapes named</span></span>${dstatsHTML(streakOf(h),Object.keys(h).length,silAverage(h))}</span><span class="hs">Tap to see the board and share your result.</span><span class="hm">Next board in ${nextIn()}</span></button>`}
  // not played yet: today's nine shapes; tapping one opens the board on its own screen with that shape picked
  else daily=`<div class="hcard ac"><span class="hm">#${D.num} · ${dateLabel(key)}</span><span class="ht">Today's shapes</span><span class="hs">${D.qs.some(q=>q.st!=='play')?'You started it: tap a shape to continue.':'Nine countries, the same for everyone, one try. Tap a shape to start.'}</span>${boardHTML(D).replace(/data-tile=/g,'data-dtile=')}</div>`;
  const st=Geomingo.streak(),r=D.over?rightOf(D):0;
  const hello=D.over?Geomingo.hello(r?'happy':'sad',r?'Stamped for today.'+(st>1?' '+st+'-day streak.':''):'Rough crossing today.',"Today's shapes are done. Next ones in "+nextIn()+'.')
    :D.qs.some(q=>q.st!=='play')?Geomingo.hello('think','Your board is waiting.','Tap a shape to carry on. One try.')
    :Geomingo.hello('pass','GeoPass ready.','Tap a shape to start. Every one you name is a stamp. One try, the same nine for everyone.');
  return header('Silhou<span>ette</span>','',true)+`<section class="home">${hello}${Geomingo.account.userHTML()}${daily}${D.over?rankingHTML():''}
    <div class="hrow"><button class="hcard" data-go="train"><span class="ht">Solo</span><span class="hs">Practice on unlimited shapes, at your pace.</span></button>
    <button class="hcard" data-go="friends"><span class="ht">With friends</span><span class="hs">Play online, 2 to ${MAXP} players.</span></button></div></section>
    ${quickRules(' Full rules in <b>How to play</b>.')}`}
function goHome(){if(roomCode){if(!confirm('Leave the room and go to the home screen?'))return;leaveRoom().then(()=>{view='home';render()});return}
  view='home';toastMsg=null;drawToast();query='';typing=false;render();window.scrollTo(0,0)}
function render(){
  // when the daily board you were playing ends: straight to its summary (on the home screen too)
  if(D&&!roomCode)watchResult('sil:'+D.date+':'+D.diff,D.over);
  if(roomCode&&room)app.innerHTML=O?onlineHTML():lobbyHTML();
  else if(view==='friends')app.innerHTML=friendsHTML();
  else if(view==='train')app.innerHTML=trainHTML();
  else if(view==='solo')app.innerHTML=soloHTML();
  else if(view==='archive')app.innerHTML=archiveView();
  else if(view==='daily')app.innerHTML=dailyHTML();
  else app.innerHTML=homeHTML();
  bind()}
function bind(){
  // give up: in Solo the shape on screen shows its name; on a daily board the shapes not named yet count as missed
  if(view==='train')bindGiveUp(trainSkip);
  else bindGiveUp(()=>{if(!D||D.over)return;D.qs.forEach(q=>{if(q.st==='play')q.st='wrong'});D.over=true;query='';typing=false;
    dailySave();render();window.scrollTo(0,0)});
  if($('home'))$('home').onclick=goHome;
  app.querySelectorAll('[data-go="train"]').forEach(b=>b.onclick=openSolo);
  if($('playsolo'))$('playsolo').onclick=openSolo;
  if($('soloback'))$('soloback').onclick=openSolo;
  if($('archback'))$('archback').onclick=openArchive;
  if($('start'))$('start').onclick=openTrain;
  app.querySelectorAll('[data-arch]').forEach(b=>b.onclick=()=>playArchive(b.dataset.arch));
  app.querySelectorAll('[data-dtile]').forEach(b=>b.onclick=()=>{D=dailyGame();const i=+b.dataset.dtile;if(D.qs[i].st==='play')D.sel=i;query='';typing=false;view='daily';render();window.scrollTo(0,0)});
  app.querySelectorAll('[data-go="friends"]').forEach(b=>b.onclick=()=>{view='friends';render();window.scrollTo(0,0)});
  if(roomCode||view==='friends'){bindOnline();return}
  if($('daily'))$('daily').onclick=()=>openDaily();
  if($('copy'))$('copy').onclick=()=>share(dailyShare(D));
  app.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{const i=+b.dataset.tile;
    if(D.over||D.qs[i].st!=='play'){toast(byCode[D.qs[i].c].n);return}
    D.sel=i;query='';typing=true;dailySave();render()});
  if(view==='solo'){app.querySelectorAll('[data-seg="diff"]').forEach(b=>b.onclick=()=>{store('sil-diff',b.dataset.v);render()});return}
  if(view==='archive')return;
  if(view==='train'){
    if($('tnext'))$('tnext').onclick=()=>{trainNext();typing=true;render()};
    bindAnswer(T.q,trainPick);
    if($('tnext')&&!TOUCH)$('tnext').focus()}
  else if(view==='daily'&&D&&!D.over)bindAnswer(D.qs[D.sel],dailyPick)}
// Enter on a revealed Solo shape goes to the next one
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&view==='train'&&T&&T.q.st!=='play'&&!$('dok')&&e.target.id!=='q'&&document.activeElement!==$('tnext')){e.preventDefault();trainNext();typing=true;render()}});
// once the flags have loaded, show the one of a revealed shape
window.addEventListener('load',()=>{if(document.querySelector('.reveal .flag'))render()},{once:true});
/* ---- start: today's board on the home screen; ?room=ABCD opens a friend's room, ?friends opens With friends ---- */
(()=>{const rm=(TESTQ.get('room')||'').toUpperCase();if(/^[A-Z]{4}$/.test(rm)){view='friends';setup.join=rm}
  else if(TESTQ.has('friends')){view='friends';try{history.replaceState(null,'',location.pathname)}catch(e){}}
  render()})();
// back in a room after a reload (the online scripts load after the page)
window.addEventListener('DOMContentLoaded',()=>{let code='';try{code=localStorage.getItem('sil-room')||''}catch(e){}
  if(view==='friends')render(); // the Create and Join buttons were drawn before Firebase loaded
  if(!code||!initFB())return;
  db.ref('rooms/'+code).once('value').then(s=>{const r=s.val();
    if(r&&r.game==='silhouette'&&r.players&&r.players[ME]&&!roomCode)listenRoom(code);else try{localStorage.removeItem('sil-room')}catch(e){}}).catch(()=>{})});
// a new day while the page was in the background: today's new board
document.addEventListener('visibilitychange',()=>{if(document.hidden||roomCode)return;if(view==='home'||view==='daily'&&D&&!D.arch&&D.date!==todayKey()){D=null;if(view==='daily')openDaily();else render()}});
</script>
</body>
