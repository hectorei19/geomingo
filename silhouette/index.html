<style>
/* Silhouette: one big shape in a square frame, the answer box under it; the daily nine as a 3 x 3 board of small frames */
.silbox{position:relative;width:100%;max-width:340px;align-self:center;aspect-ratio:1;background:var(--sheet);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:14px;
  background-image:linear-gradient(var(--sea-soft) 1px,transparent 1px),linear-gradient(90deg,var(--sea-soft) 1px,transparent 1px);background-size:25% 25%;background-position:-1px -1px}
.silbox .sil{width:100%;height:100%;display:block;color:var(--ink)}
.silbox.right{border-color:var(--good)}.silbox.right .sil{color:var(--good)}
.silbox.wrong{border-color:var(--bad)}.silbox.wrong .sil{color:var(--bad)}
.silbox .ncomp{position:absolute;top:10px;right:10px;width:38px;height:38px}.ncomp circle{fill:var(--sheet);stroke:var(--coral);stroke-width:1.5}.ncomp .nn{fill:var(--coral)}.ncomp .ns{fill:var(--line)}.ncomp text{font:700 8px var(--mono,monospace);fill:var(--coral)}  /* same look turned or not (Héctor 2026-11-22) */
.silbox .turn{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:.7rem;color:var(--ink-2)}
.play{display:flex;flex-direction:column;gap:10px;width:100%}
.ans{display:flex;flex-direction:column;gap:6px}
.ans input{width:100%;border:1.5px solid var(--ink);border-radius:5px;padding:12px;font-size:1.1rem;background:var(--paper)}
.ans .sugg{max-height:none}
/* phones: the answer sheet shows the shape small next to the question, so you still see it with the keyboard open */
.sheet .q .ssil{width:64px;height:64px;flex:none;color:var(--ink)}
.sheet .q .ssil .sil{width:100%;height:100%;display:block}
.recap{display:flex;flex-direction:column;gap:6px;margin-top:8px}.recap div{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line,#2a3447);border-radius:12px}.recap svg{width:40px;height:40px;flex:none}.recap .rn{flex:1;min-width:0}.recap .rn small{display:block;opacity:.6;font-size:.75rem}.recap .rw{display:flex;align-items:center;gap:6px;font-size:.9rem;text-align:right}.recap .rw .pin{width:8px;height:8px;border-radius:50%}.recap .no{opacity:.55}.recap .rp{font-family:var(--mono);color:var(--gold,#e9c46a);margin-left:4px}
.said{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}.said span{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;border:1px solid var(--line,#2a3447);font-size:.85rem}.said s{text-decoration-thickness:1.5px;opacity:.85}.said .pin{width:8px;height:8px;border-radius:50%;display:inline-block}
.tries{display:flex;align-items:center;gap:8px;font-size:.95rem;color:var(--ink-2)}
.tries i{width:12px;height:12px;border-radius:50%;background:var(--flamingo)}
.tries i.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule)}
.tries .cnt{margin-left:auto;font-family:var(--mono);font-size:.8rem}
.missed{margin:0;font-size:.92rem;color:var(--ink-2)}
.reveal{display:flex;align-items:center;gap:12px;background:var(--sheet);border:2px solid var(--good);border-radius:16px;padding:10px 12px}
.reveal.wrong{border-color:var(--bad)}
.reveal .flag{width:48px;height:auto;border-radius:3px;box-shadow:0 0 0 1px var(--rule);flex:none}
.reveal .rn{display:flex;flex-direction:column;min-width:0}
.reveal .rn b{font-family:var(--display);font-weight:700;font-size:1.4rem;line-height:1.1}
.reveal .rn small{color:var(--ink-2);font-size:.9rem}
.reveal .rpts{margin-left:auto;font-family:var(--mono);font-size:.85rem;white-space:nowrap}
.streak{display:flex;gap:16px;font-size:.95rem;color:var(--ink-2)}
.streak b{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--ink);margin-right:4px}
.board9{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:340px;align-self:center}
.board9 button{display:block;width:100%;min-width:0;height:auto;background:var(--sheet);border:2px dashed var(--line);border-radius:14px;padding:0;position:relative;overflow:hidden}
/* square tiles without aspect-ratio and the shape out of the flow: iPhone Safari made the tiles bigger than their columns and rows */
.board9 button::before{content:"";display:block;padding-top:100%}
.board9 button .sil{position:absolute;top:6px;left:6px;width:calc(100% - 12px);height:calc(100% - 12px);display:block;color:var(--ink)}
.board9 button.sel{border:2px solid var(--flamingo);box-shadow:0 0 0 3px color-mix(in srgb,var(--flamingo) 30%,transparent)}
.board9 button.right{border-style:solid;border-color:var(--good);background:var(--p4-soft)}.board9 button.right .sil{color:var(--good)}
.board9 button.wrong{border-style:solid;border-color:var(--bad);background:var(--p0-soft)}.board9 button.wrong .sil{color:var(--bad)}

.dsq{grid-template-columns:repeat(3,1fr);width:60px}

.dsq i.bad{background:var(--bad)}
.modes{max-width:320px;width:100%;align-self:center}
.difftag{font-family:var(--mono);font-size:.75rem;color:var(--sea);letter-spacing:.04em;text-transform:uppercase}
.osel{width:100%;border:1.5px solid var(--ink);border-radius:5px;padding:10px;font-size:1rem;background:var(--paper)}
.rank td:first-child,.rank th:first-child{width:28px}
.rank td:nth-child(2),.rank th:nth-child(2){text-align:left;font-family:var(--ui);font-weight:600}
.rank tr.me td{background:var(--sea-soft)}
.ready{display:flex}
@media (prefers-reduced-motion:no-preference){.silbox.pop{animation:pop .35s cubic-bezier(.3,1.6,.6,1)}}

<script>
/* ---- one silhouette to name: the same piece in Solo, Daily and With friends ----
   A question is {c: country code, rot: turn in degrees (Hard), tries: wrong answers so far, st: 'play' | 'right' | 'wrong'}.
   The lives are for the whole game, not per shape: every wrong answer on any shape costs one, and at none the game is over. */
const LIVES=5,DIFF_NAME={easy:'Easy',normal:'Easy',hard:'Hard'};
/* two levels to choose (15 Nov 2026): Easy = all 197 countries north up (the old Easy and Normal together), and Hard.
   'easy' (the 54 best-known) stays only inside "Getting harder" rooms and in old saves. */
const newQ=(c,rot)=>({c,rot:rot||0,tries:[],st:'play'});
const flagSrc=c=>'../flagpie/flags/'+c+'.svg';
const contName={EU:'Europe',AS:'Asia',AF:'Africa',NA:'North and Central America',SA:'South America',OC:'Oceania'};
let query='',typing=false;
// lives left in a game: five, minus every wrong answer on any of its shapes
const livesLeft=qs=>Math.max(0,LIVES-qs.reduce((n,q)=>n+q.tries.length,0));
const livesWord=n=>n+' '+(n===1?'life':'lives');
// apply an answer to a question; returns 'right', 'wrong' (a miss with lives left) or 'out' (the game's last life used).
// left: the game's lives before this answer
function answer(q,code,left){
  if(code===q.c){q.st='right';return 'right'}
  q.tries.push(code);if(left-1<=0){q.st='wrong';return 'out'}
  return 'wrong'}
function triesHTML(q,tkt,left){
  // with friends (left null) there are no lives: just the turned-shape note
  return (tkt||left==null?(q.rot?`<span class="hint">Turned shape</span>`:''):`<div class="tries" aria-label="${livesWord(left)} left">Lives ${Array.from({length:LIVES},(_,i)=>`<i class="${i<left?'':'off'}"></i>`).join('')}${q.rot?`<span class="cnt">Turned shape</span>`:''}</div>`)+
    (q.tries.length?`<p class="missed">Not ${q.tries.map(c=>esc(byCode[c].n)).join(', not ')}.</p>`:'')}
function suggHTML(q){if(!query)return SHEETS?'<li class="hint" style="padding:8px 2px">Start typing, then tap the country.</li>':'';const res=searchCountries(query,null,6);
  if(!res.length)return `<li class="hint" style="padding:8px 2px">No country matches “${esc(query)}”.</li>`;
  return res.map(c=>{const t=q.tries.includes(c.c);return `<li><button data-g="${c.c}" ${t?'disabled':''}>${esc(c.n)}${t?'<span class="tag">not it</span>':''}</button></li>`}).join('')}
function answerBoxHTML(q,extra){
  if(SHEETS)return askBtnHTML()+(extra||'');
  return `<div class="ans"><input id="q" placeholder="Type a country…" autocomplete="off" autocapitalize="words" spellcheck="false" value="${esc(query)}" aria-label="Type a country"><ul class="sugg" id="sugg">${suggHTML(q)}</ul></div>${extra||''}`}
function revealHTML(q,note){const c=byCode[q.c],ok=q.st==='right';
  return `<div class="reveal ${ok?'':'wrong'}"><img class="flag" src="${flagSrc(q.c)}" alt=""><span class="rn"><b>${esc(c.n)}</b><small>${ok?(q.tries.length?'Right, at try '+(q.tries.length+1):'Right, first try'):'The answer'} · ${contName[c.r]||''}</small></span>${note?`<span class="rpts">${note}</span>`:''}</div>`}
// a small compass in the corner: its N points where north is on the shape, so a turned shape shows at a glance (Héctor 2026-11-22)
const compassHTML=rot=>`<svg class="ncomp${rot?' on':''}" viewBox="-20 -20 40 40" aria-label="${rot?'Turned shape: north is where the N points':'North is up'}" role="img"><circle r="19"/><g transform="rotate(${rot||0})"><path d="M0-9 4 0H-4Z" class="nn"/><path d="M0 9 4 0H-4Z" class="ns"/><text y="-11" text-anchor="middle">N</text></g></svg>`;
function silBoxHTML(q,big){const cls=q.st==='right'?'right':q.st==='wrong'?'wrong':'';
  return `<div class="silbox ${cls}${big?' pop':''}">${silSVG(q.c,q.rot)}${compassHTML(q.rot)}</div>`}
// the answer box: typing filters the list; a tap or Enter (first match) answers
function bindAnswer(q,onPick){
  // phones: the button opens the answer sheet, as in Countries; answering closes it with the keyboard
  if(SHEETS){bindAsk($('askbtn')?{key:q.c+':'+(q.rot||0)+':'+view,back:'Back to shape',fit:true,
    head:`<span class="ssil">${silSVG(q.c,q.rot)}</span><span>Whose shape is this?</span>`,
    sugg:t=>{query=t;return suggHTML(q)},first:t=>{const m=searchCountries(t,null,6).filter(c=>!q.tries.includes(c.c));return m[0]&&m[0].c},
    pick:onPick}:null);return}
  const box=$('q');if(!box)return;
  const draw=()=>{const u=$('sugg');if(u){u.innerHTML=suggHTML(q);u.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>onPick(b.dataset.g))}};
  box.oninput=e=>{query=e.target.value;draw()};
  box.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const m=searchCountries(query,null,6).filter(c=>!q.tries.includes(c.c));if(m[0])onPick(m[0].c)}};
  draw();
  // the box gets the focus only once you have started, so phones do not open the keyboard on arrival
  if(query||typing)setTimeout(()=>{box.focus();box.setSelectionRange(box.value.length,box.value.length)},0)}
// Mingo reacts to each answer in his bubble above the shape
const tk=Geomingo.tk;
function feedback(q,res,code,key,left){
  if(res==='right'){Geomingo.stamp('silhouette',byCode[q.c].n,'',q.c);say(key,'happy','Stamped: '+byCode[q.c].n+'.',q.tries.length?'Got it on try '+(q.tries.length+1)+'.':'First try.')}
  else if(res==='wrong')say(key,'sad','Denied entry.',`It's not ${byCode[code].n}.`+(left==null?' Try again.':` ${livesWord(left)} left.`));
  else say(key,'sad','It was '+byCode[q.c].n+'.',`Not ${byCode[code].n}. No lives left: the game is over.`)}
const silKey=()=>view==='train'&&T?'train:'+T.diff:D?'sil:'+D.date:'';

/* ---- Practice: a board of nine random shapes, like the daily one (Héctor 2026-11-15: "grid de 9 como en daily") ----
   Daily level (Easy, north up), never one of today's shapes; 5 lives for the board, or Unlimited (chosen on the home
   page's Practice screen: no game over, mistakes are only counted). sil-train keeps the numbers: n shapes played, ok named,
   best named on one board (5 lives only). */
let T=null;
const trainStats=()=>load('sil-train',{});
function openTrain(){const today=new Set(dailyBoard(todayKey(),DAILY_LV).map(q=>q.c));
  const codes=shuffled(poolOf(DAILY_LV).map(c=>c.c).filter(c=>!today.has(c)),Math.random).slice(0,DAILY_N);
  T={diff:DAILY_LV,nolives:Geomingo.lives()?0:1,qs:codes.map(c=>newQ(c,0)),sel:0,over:false};
  view='train';query='';typing=false;render();window.scrollTo(0,0)}
function openSolo(){openTrain()}
const trainMiss=()=>T.qs.reduce((n,q)=>n+q.tries.length,0);
const trainLeft=()=>T.nolives?Infinity:livesLeft(T.qs);
// the board is over: the shapes not named yet count as missed; the numbers go into sil-train once
function trainEnd(){if(T.logged)return;T.qs.forEach(q=>{if(q.st==='play')q.st='wrong'});T.over=true;T.logged=1;
  const st=trainStats(),s=st[T.diff]||{n:0,ok:0,best:0},r=rightOf(T);s.n+=T.qs.length;s.ok+=r;if(!T.nolives)s.best=Math.max(s.best||0,r);
  st[T.diff]=s;store('sil-train',st);Geomingo.stat('fin','solo')}
function trainPick(code){const q=T.qs[T.sel];if(!q||q.st!=='play'||T.over)return;
  const res=answer(q,code,trainLeft());query='';typing=res==='wrong';
  if(res==='out')trainEnd();
  else if(res==='right'){const next=T.qs.findIndex((x,i)=>i>T.sel&&x.st==='play'),any=T.qs.findIndex(x=>x.st==='play');
    T.justDone=T.sel;if(any<0)trainEnd();else T.sel=next>=0?next:any}
  feedback(q,res,code,silKey(),T.nolives?null:livesLeft(T.qs));render();if(T.over)window.scrollTo(0,0)}
function trainHTML(){const r=rightOf(T),m=trainMiss(),s=trainStats()[T.diff]||{best:0};
  let h=header('Silhou<span>ette</span>','',0,true);  // Practice is said once, on the coral ticket (Héctor 2026-11-15)
  // the board is over: the coral ticket with the board inside, then New game and Share
  if(T.over)return h+Geomingo.soloTicket({id:'silhouette',what:T.nolives?'Unlimited':LIVES+' lives',score:r+' of 9',best:'Best: '+Math.max(s.best||0,T.nolives?0:r)+' of 9',
    detail:m+' mistake'+(m===1?'':'s'),body:`<section class="panel play">${boardHTML(T)}</section>`})+`<div class="gm-done-btns gm-solo-btns"><button class="primary" id="tagain" style="flex:1">New game</button>${SHARE_BTN.replace('Share result','Share')}</div>`;
  const started=T.qs.some(q=>q.st!=='play');
  h+=Geomingo.ticket(moodHTML(silKey(),started?'think':'pass',started?'Keep going: '+r+' of 9 so far.':'Nine shapes to name.',started?'Tap any shape to jump to it.':(T.nolives?'Unlimited: no game over, take your time.':LIVES+' lives for the whole board.')),
    tk('Traveller',esc(Geomingo.traveller()),'tk-name')+tk('Named',r+'/'+T.qs.length)+tk('Points',Geomingo.KM.sil(r,m),'tk-pts')+(T.nolives?tk('Mistakes',m,'tk-gs'):tk('Lives',livesHTML(livesLeft(T.qs),LIVES),'tk-gs')),{mode:'practice'});
  return h+`<section class="panel">${dailyPlayHTML(T,true)}</section>`+quickRules(' Full rules in <button type="button" class="qhelp">How to play</button>.')}

/* ---- Daily: nine shapes on a 3 x 3 board, the same for everyone, one board a day at Normal level ----
   The level shuffles its countries once per cycle (same order for everyone, from the cycle number) and deals
   nine a day, so no country comes back until the cycle is over. The day's save keeps one entry per level
   (only Normal since there is one daily board; Easy and Hard live on in Solo and With friends). */
const DAILY_FIRST='2026-10-22',DAILY_N=9,DAILY_LV='normal',NEW_FROM_CYCLE=1,NEW_CODES=new Set(['VAT']);
/* Easier two months (Héctor 2026-11-16, players found the daily too hard, as in Compass): from MIX_FROM to MIX_TO
   each board is 4 easy shapes (the 54 Easy ones) + 3 normal (MIX_NORMAL, shapes many people know) + 2 hard (the rest),
   in a random order, from Europe, Asia, Africa and the Americas every day (no part of the world more than 3 times
   when it can). Each list is dealt from its own deck, shuffled once per round. Other days keep the usual cycle. */
const MIX_FROM='2026-11-17',MIX_TO='2027-01-16';
const MIX_NORMAL=['NLD','BEL','CHE','AUT','CZE','HUN','ROU','BGR','DNK','HRV','SRB','BLR','GEO','AFG','IRQ','SYR','ISR','JOR','YEM','OMN','ARE','MYS','MMR','NPL','PRK','TWN','LKA','KHM','LAO','UZB','TUN','SDN','TZA','AGO','NAM','BWA','ZWE','MOZ','GHA','CMR','MLI','NER','TCD','ECU','PRY','PAN','CRI','JAM','PNG','DOM','HTI'];
const isMix=key=>key>=MIX_FROM&&key<=MIX_TO;
const MIXK={};
function mixBoard(key){if(MIXK[key])return MIXK[key];
  const by=Object.fromEntries(COUNTRIES.map(c=>[c.c,c])),part=c=>{const r=by[c].r;return r==='NA'||r==='SA'?'AM':r==='OC'?'AS':r};
  const tiers={e:COUNTRIES.filter(c=>c.e).map(c=>c.c),n:MIX_NORMAL.filter(c=>by[c]&&!by[c].e)};
  tiers.h=COUNTRIES.map(c=>c.c).filter(c=>!by[c].e&&!tiers.n.includes(c));
  const deck={e:[],n:[],h:[]},round={e:0,n:0,h:0};
  const take=(t,cnt,day)=>{if(deck[t].length<12)deck[t]=deck[t].concat(shuffled(tiers[t].slice().sort(),rng(seedOf('silhouette-mix-'+t+'-'+round[t]++))));
    const ok=[c=>!day.includes(c)&&!cnt[part(c)],c=>!day.includes(c)&&(cnt[part(c)]||0)<3&&Object.keys(cnt).length>=4,c=>!day.includes(c)];
    for(const f of ok){const j=deck[t].findIndex(f);if(j>=0)return deck[t].splice(j,1)[0]}};
  for(let k=MIX_FROM;k<=key;k=new Date(Date.parse(k+'T12:00Z')+864e5).toISOString().slice(0,10)){const cnt={},day=[];
    for(const t of ['e','e','e','e','n','n','n','h','h']){const c=take(t,cnt,day);day.push(c);cnt[part(c)]=(cnt[part(c)]||0)+1}
    MIXK[k]=shuffled(day,rng(seedOf('silhouette-mix-'+k)))}
  return MIXK[key]}
function dailyBoard(key,diff){if(diff==='normal'&&isMix(key))return mixBoard(key).map(c=>newQ(c,0));
  // Vatican City joined on 2026-11-07 (the same 197 countries as every Geomingo game): cycles before NEW_FROM_CYCLE keep their order without it
  const all=poolOf(diff).map(c=>c.c).sort(),base=all.filter(c=>!NEW_CODES.has(c)),days=Math.floor(base.length/DAILY_N),n=dayNum(key,DAILY_FIRST)-1;
  const cycle=Math.floor(n/days),i=((n%days)+days)%days,codes=cycle>=NEW_FROM_CYCLE?all:base;
  const deck=shuffled(codes,rng(seedOf(`silhouette-${diff}-cycle-${cycle}`))).slice(i*DAILY_N,(i+1)*DAILY_N);
  const turn=rng(seedOf(`silhouette-hard-${key}`));
  return deck.map(c=>newQ(c,diff==='hard'?hardTurn(turn):0))}
let D=null;

/* ---- With friends: online rooms on Countries' Firebase Realtime Database ----
   A room lives at rooms/ABCD like Countries', marked game:'silhouette' so games never open each other's rooms.
   Everyone sees the same shape at the same time (the host deals all of them at the start, in qs); each round lasts
   SECS seconds and ends early once everyone has named it or used their tries. A right answer scores 10 (a level total
   goes to the faster one). Each phone writes only its own answer (ans/<round>/<player>); whoever is online moves the room on. */
const FB_OK=()=>typeof firebase!=='undefined'&&typeof firebase.database==='function'&&!!(window.FIREBASE_CONFIG&&/^https:\/\//.test(FIREBASE_CONFIG.databaseURL||''));
const ROOM_V='sil-202611020600',MAXP=6,ROUNDS=10,SECS=20,READY_MS=3000,REVEAL_MS=3000;
/* Turns (Héctor 2026-11-21: every game with friends in turns). A room with turns:1 plays one shape at a time for the
   whole room: a random player starts, then each player in order, TURN_S seconds a turn. Right: 10 points and the shape
   is shown. Wrong or time up: the next player tries the same shape. When everyone here has tried once and missed,
   the shape is shown for nobody. The next shape starts with the next player. */
const TURN_S=30;
const tHere=r=>(r.order||[]).filter(pid=>(r.players[pid]||{}).on!==false);
const tNext=(r,from)=>{const o=r.order||[];for(let k=1;k<=o.length;k++){const j=(from+k)%o.length,p=r.players[o[j]];if(p&&p.on!==false)return j}return (from+1)%Math.max(1,o.length)};
// one try on the room's shape: code (null: time up) for the player whose turn it is
function turnTry(r,pid,code,t){const k=r.round,a=(((r.ans||{})[k]||{})[pid])||{};a.tries=a.tries||[];
  const right=!!code&&code===r.qs[k].c;
  if(right){a.ok=true;a.ms=Math.max(0,t-r.start);a.pts=10}else a.tries.push(code||'-');
  r.ans=r.ans||{};r.ans[k]=r.ans[k]||{};r.ans[k][pid]=a;r.ev={p:pid,c:code||'-',ok:right?1:0,k};
  r.tc=(r.tc||0)+1;r.mc=(r.mc||0)+1;
  if(right||r.tc>=2*tHere(r).length){r.status='reveal';r.revealEnd=t+REVEAL_MS}
  else{r.turn=tNext(r,r.turn||0);r.tEnd=t+TURN_S*1000;r.end=r.tEnd}
  return r}

const doneOf=a=>!!(a&&a.ok);

  const order=r.order||lobbyOrder(r),ans=r.ans||{};

    if(TG.over||TG.qs[i].st!=='play'){toast(byCode[TG.qs[i].c].n);return}
    TG.sel=i;query='';typing=true;if(TG===D)dailySave();render()});
  if(view==='archive')return;
  if(view==='train'){
    if($('tagain'))$('tagain').onclick=openTrain;
    if(!T.over)bindAnswer(T.qs[T.sel],trainPick)}
  else if(view==='daily'&&D&&!D.over)bindAnswer(D.qs[D.sel],dailyPick)}
// once the flags have loaded, show the one of a revealed shape
window.addEventListener('load',()=>{if(document.querySelector('.reveal .flag'))render()},{once:true});
/* ---- start: today's board on the home screen. Old ?room= and ?friends links go home (../brand/party.js) ---- */
(()=>{const ak=Geomingo.askedDay(DAILY_FIRST);if(ak){openDay(ak);return}
  render()})();
// back in a room after a reload, inside the one room for all nine games (the online scripts load after the page)
window.addEventListener('DOMContentLoaded',()=>{const code=Geomingo.room.saved('sil-room'); // an old or finished room is not reopened
  if(!code||!(Geomingo.party&&Geomingo.party.on())||!initFB())return;
  db.ref('rooms/'+code).once('value').then(s=>{const r=s.val();
    if(r&&r.game==='silhouette'&&r.players&&r.players[ME]&&!roomCode&&Geomingo.room.resume('sil-room',r.status==='over'))listenRoom(code);else if(!roomCode)Geomingo.room.forget('sil-room')}).catch(()=>{})});
// a new day while the page was in the background: today's new board
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&roomCode&&room&&Geomingo.room.stale(room.status==='over')){leaveRoom().then(()=>{view='home';render()});return}
  if(document.hidden||roomCode)return;if(view==='home'||view==='daily'&&D&&!D.arch&&D.date!==todayKey()){D=null;if(view==='daily')openDaily();else render()}});
</script>
