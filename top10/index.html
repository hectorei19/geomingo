<style>
/* Top 10: a ranked list with ten empty rows that fill in as you name the countries */
.t10q{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:1.9rem;line-height:1;letter-spacing:.02em;margin:0;text-wrap:balance}
.t10list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.t10list li{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px;border-top:1px dashed var(--rule)}
.t10list li:first-child{border-top:0}
.t10list .rk{font-family:var(--display);font-weight:900;font-size:1.35rem;width:30px;color:var(--sea)}
.t10list .nm{flex:1;font-weight:700;font-size:1.05rem;min-width:0;display:flex;align-items:center;gap:8px}
.t10list .val{font-family:var(--mono);font-size:.78rem;color:var(--ink-2);white-space:nowrap}
.t10list li.on{background:var(--p4-soft)}
.t10list li.on.new{animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
.t10list li.miss .nm{color:var(--ink-2);font-weight:500}
.t10list .mini{width:24px;height:24px}
.t10in{display:flex;flex-direction:column;gap:6px}
.t10in input{width:100%;border:1.5px solid var(--ink);border-radius:5px;padding:12px;font-size:1.1rem;background:var(--paper)}
.t10in .sugg{max-height:none}
.lives{display:flex;align-items:center;gap:8px;font-size:.95rem;color:var(--ink-2)}
.lives i{width:12px;height:12px;border-radius:50%;background:var(--bad)}
.lives i.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule)}
.lives .cnt{margin-left:auto;font-family:var(--mono);font-size:.8rem}
.wrongs{margin:0;font-size:.92rem;color:var(--ink-2)}
.modes{max-width:320px;width:100%;align-self:center}
/* Geomingo look for the list */
.t10q{font-family:var(--display);font-weight:600;text-transform:none;letter-spacing:0;font-size:1.6rem;line-height:1.1}
.t10list{border:2px solid var(--line);border-radius:18px;box-shadow:none}
.t10list li{border-top:2px dashed var(--line)}
.t10list .rk{font-family:var(--display);font-weight:700;color:var(--flamingo-text)}
.t10list li.on{background:var(--lagoon-soft)}
.t10list .val{font-family:var(--body);font-weight:700}
.lives i{background:var(--flamingo)}
.lives .cnt{font-family:var(--body);font-weight:800}
/* today's list on the home screen: the question and its ten empty places (a preview; tapping opens the list) */
.hcard .t10q{display:block;margin:6px 0 2px}
.t10meta{display:block;margin-top:10px;font-family:var(--type);font-size:13px;letter-spacing:.04em;color:var(--muted)}
/* in the game: the question and its ten places in one card */
.t10card{background:var(--sheet);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.t10cq{padding:16px;display:flex;flex-direction:column;gap:8px}
.t10card .t10list{border:0;border-top:2px dashed var(--line);border-radius:0;box-shadow:none}
.t10list li[data-ask]{cursor:pointer}
/* phones: the ten places in two columns (1-5 and 6-10), each with its flag, name and figure, so they fit above the keyboard */
body.kbon .t10list{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(var(--rows,5),auto);grid-auto-flow:column}
body.kbon .t10list li{display:grid;grid-template-columns:26px 1fr;grid-template-rows:auto auto;align-content:center;column-gap:6px;min-height:46px;padding:4px 8px 4px 10px;min-width:0}
body.kbon .t10list li.c2top{border-top:0}
body.kbon .t10list li.c2{border-left:2px dashed var(--line)}
body.kbon .t10list .rk{grid-row:1/3;width:auto;font-size:1.15rem;align-self:center}
body.kbon .t10list .nm{font-size:.86rem;line-height:1.15;gap:6px;min-width:0;overflow-wrap:anywhere}
body.kbon .t10list .nm>img{flex:none}
body.kbon .t10list .val{grid-column:2;font-size:.72rem;line-height:1.1}
body.kbon .t10list .mini{width:18px;height:18px}
body.kbon .kbgu{display:flex;flex-direction:column;align-items:center;gap:14px}
body.kbon .kbgu #src{align-self:center!important}

<script>
/* ---- the rankings ----
   Numbers Countries already uses (DATA and the country data), plus a few figures only Top 10 uses (XDATA,
   in extra-data.js), each with its source named in the list and in Credits. Independent countries only. A list is used only when the 10th and 11th places are not tied. */
const T10_FIRST='2026-10-19',LIVES=5;
const SOVC=C.filter(c=>!c.t);
const n0=v=>EU(Math.round(v));
const ppl=v=>(v>=1e9?EU(v/1e9,2)+' billion':v>=1e6?EU(v/1e6,1)+' million':n0(v))+' inhabitants';
const d1=v=>EU(+v,1);
const num=v=>typeof v==='number'&&isFinite(v)?v:undefined;
const D=k=>c=>{const v=num(DATA[k][c.c]);return v!==undefined?v:num((XFILL[k]||{})[c.c])};
// a country the source leaves out because it has none (no medals, no reactors, never at a World Cup...) counts as 0
// a count with its word, singular for 1 ("1 medal", "3 medals")
const PL=w=>v=>n0(v)+' '+w+(+v===1?'':'s');
const Z=get=>c=>{const v=get(c);return v===undefined?0:v};
const AREANOTE='Total area (land and inland water), from the country data used in Countries (mledoze/countries). Vatican City, missing there, is 0,44 km² (Wikipedia, "Vatican City").';
// area in km²: the country data has none for Vatican City, so its official 0.44 km² is added here
const AREA=c=>c.c==='VAT'?0.44:c.a>0?c.a:undefined;
const big=v=>v>=1e12?EU(v/1e12,2)+' trillion':v>=1e9?EU(v/1e9,1)+' billion':EU(v/1e6,0)+' million';
const GDPNOTE=NOTE('World Bank figures, 2025 column','List of countries by GDP (nominal) per capita');
const CO2NOTE=NOTE('figures for 2023','List of countries by carbon dioxide emissions per capita');
const FORESTNOTE=NOTE('forest share of land area','List of countries by forest area');
const L=(id,title,get,dir,fmt,src)=>({id,title,get,dir,fmt,src});
// figures only Top 10 uses (top10/extra-data.js)
const X=k=>c=>num(XDATA[k][c.c]);
// Credits: the countries' data, plus the sources of the figures only Top 10 uses
function creditsHTML(){return DATA_CREDITS.replace('</ul>',`<li>Top 10's other figures, downloaded in November 2026 and each checked against a second source: McDonald's restaurants (McDonald's, with Wikipedia), coffee (FAO via Our World in Data), and Wikipedia lists (CC BY-SA 4.0) for World Cups (FIFA), temperature (World Bank) and Nobel Prizes; nuclear reactors: World Nuclear Association; Olympic golds: Wikipedia and Olympedia. Gaps in Countries' figures used only here: life expectancy (UN World Population Prospects 2024, checked with the World Bank) and CO₂ per person (Global Carbon Project via Our World in Data).</li></ul>`)}
const BEERNOTE='Litres of beer per person in 2022. Source: Kirin Holdings, "Global Beer Consumption by Country in 2022", which gives the top 35 countries and a few others; the rest have no figure.';
const MCDNOTE='Restaurants open on 31 December 2025. Source: McDonald\'s, "Restaurants by Market 2025" (the same numbers as Wikipedia, "List of countries with McDonald\'s restaurants"). Small markets it does not list separately come from Wikipedia, "List of countries with McDonald\'s restaurants" (Andorra 5, Fiji 5, Monaco 1, Liechtenstein 1, Samoa 1). Countries with no McDonald\'s count as 0 (the one in Cuba is on the US base at Guantánamo, so Cuba counts as 0).';
const TEMPNOTE=NOTE('World Bank Climate Change Knowledge Portal, average for 1991–2020','List of countries by average yearly temperature');
// the world lists; each one also comes in a version for Europe, Asia, Africa and the Americas (see REGIONS below)
const WORLD_LISTS=[
  L('pop-hi','The 10 most populous countries',D('pop'),-1,ppl,POPNOTE),
  L('pop-lo','The 10 least populous countries',D('pop'),1,v=>n0(v)+' inhabitants',POPNOTE),
  L('area-hi','The 10 largest countries by area',AREA,-1,v=>n0(v)+' km²',AREANOTE),
  L('area-lo','The 10 smallest countries by area',AREA,1,v=>v<1?EU(v)+' km²':n0(v)+' km²',AREANOTE),
  L('dens-hi','The 10 most densely populated countries',c=>D('pop')(c)&&AREA(c)?D('pop')(c)/AREA(c):undefined,-1,v=>n0(v)+' inhabitants per km²','Population divided by total area. '+POPNOTE+' '+AREANOTE),
  L('dens-lo','The 10 most sparsely populated countries',c=>D('pop')(c)&&AREA(c)?D('pop')(c)/AREA(c):undefined,1,v=>d1(v)+' inhabitants per km²','Population divided by total area. '+POPNOTE+' '+AREANOTE),
  L('gdptot-hi','The 10 countries with the biggest economy (total GDP)',c=>D('pop')(c)&&D('gdp')(c)?D('pop')(c)*D('gdp')(c):undefined,-1,v=>'$'+big(v),'GDP per person times population. '+GDPNOTE+' '+POPNOTE),
  L('gdp-hi','The 10 countries with the highest GDP per person',D('gdp'),-1,v=>'$'+n0(v),GDPNOTE),
  L('gdp-lo','The 10 countries with the lowest GDP per person',D('gdp'),1,v=>'$'+n0(v),GDPNOTE),
  L('hdi-hi','The 10 countries with the highest Human Development Index',D('hdi'),-1,v=>EU(+v,3),NOTE('UNDP figures for 2023','List of countries by Human Development Index')),
  L('hdi-lo','The 10 countries with the lowest Human Development Index',D('hdi'),1,v=>EU(+v,3),NOTE('UNDP figures for 2023','List of countries by Human Development Index')),
  L('life-hi','The 10 countries with the longest life expectancy',D('life'),-1,v=>d1(v)+' years',NOTE('UN figures for 2023','List of countries by life expectancy')),
  L('life-lo','The 10 countries with the shortest life expectancy',D('life'),1,v=>d1(v)+' years',NOTE('UN figures for 2023','List of countries by life expectancy')),
  L('age-hi','The 10 countries with the oldest population (median age)',D('age'),-1,v=>d1(v)+' years',NOTE('CIA World Factbook, 2024 estimates','List of countries by median age')),
  L('age-lo','The 10 countries with the youngest population (median age)',D('age'),1,v=>d1(v)+' years',NOTE('CIA World Factbook, 2024 estimates','List of countries by median age')),
  L('cpi-hi','The 10 least corrupt countries (Corruption Perceptions Index)',D('cpi'),-1,v=>n0(v)+' / 100',NOTE('Transparency International, 2025 index','Corruption Perceptions Index')),
  L('cpi-lo','The 10 most corrupt countries (Corruption Perceptions Index)',D('cpi'),1,v=>n0(v)+' / 100',NOTE('Transparency International, 2025 index','Corruption Perceptions Index')),
  L('co2-hi','The 10 countries with the most CO₂ emissions per person',D('co2'),-1,v=>d1(v)+' tonnes',CO2NOTE),
  L('co2tot-hi','The 10 countries with the most CO₂ emissions in total',c=>D('pop')(c)&&D('co2')(c)?D('pop')(c)*D('co2')(c):undefined,-1,v=>(v>=1e9?EU(v/1e9,2)+' billion':EU(v/1e6,1)+' million')+' tonnes','Emissions per person times population. '+CO2NOTE+' '+POPNOTE),
  L('urban-lo','The 10 countries with the smallest share of urban population',D('urban'),1,v=>d1(v)+'%',NOTE('UN figures for 2023','Urbanization by sovereign state')),
  L('capshare-hi','The 10 countries where the most people live in the capital (share of population)',c=>{if(DATA.cap_skip.includes(c.c)||!D('pop')(c)||!num(DATA.cappop[c.c]))return;const v=DATA.cappop[c.c]/D('pop')(c)*100;return v<95?v:undefined},-1,v=>d1(v)+'%','Population of the capital within its city limits, divided by the population of the country. City-states (Vatican City, Singapore, Monaco), where the capital is the whole country, are left out. '+CAPNOTE+' '+POPNOTE),
  L('coast-hi','The 10 countries with the longest coastline',D('coast'),-1,v=>n0(v)+' km',NOTE('CIA World Factbook figures','List of countries by length of coastline')),
  L('elev-hi','The 10 countries with the highest top point',D('elev'),-1,v=>n0(v)+' m',NOTE('highest points','List of elevation extremes by country')),
  L('elev-lo','The 10 flattest countries (lowest top point)',D('elev'),1,v=>n0(v)+' m',NOTE('highest points','List of elevation extremes by country')),
  L('landb-hi','The 10 countries with the longest land borders',D('landb'),-1,v=>n0(v)+' km',NOTE('total land border length','List of countries and territories by land borders')),
  L('forest-hi','The 10 most forested countries (share of land)',D('forest'),-1,v=>d1(v)+'%',FORESTNOTE),
  L('forestkm-hi','The 10 countries with the most forest (area)',c=>D('forest')(c)!==undefined&&AREA(c)?D('forest')(c)*AREA(c)/100:undefined,-1,v=>n0(v)+' km²','Forest share of land times total area, so a rough figure. '+FORESTNOTE+' '+AREANOTE),
  L('olymp-hi','The 10 countries with the most Olympic medals',Z(D('olymp')),-1,PL('medal'),'All Summer and Winter Olympics together, up to the 2026 Winter Games. Medals won as part of a former team (Soviet Union, East Germany...) are not added. Source: Wikipedia, "All-time Olympic Games medal table".'),
  L('cap-hi','The 10 countries with the most populous capital city',c=>DATA.cap_skip.includes(c.c)?undefined:num(DATA.cappop[c.c]),-1,ppl,'Population of the capital within its city limits. '+CAPNOTE),
  L('cap-lo','The 10 countries with the least populous capital city',c=>DATA.cap_skip.includes(c.c)||!(DATA.cappop[c.c]>0)?undefined:DATA.cappop[c.c],1,v=>n0(v)+' inhabitants','Population of the capital within its city limits. '+CAPNOTE),
  L('gdptot-lo','The 10 countries with the smallest economy (total GDP)',c=>D('pop')(c)&&D('gdp')(c)?D('pop')(c)*D('gdp')(c):undefined,1,v=>'$'+big(v),'GDP per person times population. '+GDPNOTE+' '+POPNOTE),
  L('co2-lo','The 10 countries with the least CO₂ emissions per person',D('co2'),1,v=>EU(+v,2)+' tonnes',CO2NOTE),
  L('urban-hi','The 10 most urban countries (share of urban population)',D('urban'),-1,v=>d1(v)+'%',NOTE('UN figures for 2023','Urbanization by sovereign state')),
  L('forest-lo','The 10 least forested countries (share of land)',D('forest'),1,v=>d1(v)+'%',FORESTNOTE),
  L('coast-lo','The 10 countries with the shortest coastline (landlocked ones left out)',c=>D('coast')(c)>0?D('coast')(c):undefined,1,v=>EU(+(+v).toFixed(1))+' km',NOTE('CIA World Factbook figures','List of countries by length of coastline')),
  L('landb-lo','The 10 countries with the shortest land borders (islands left out)',c=>D('landb')(c)>0?D('landb')(c):undefined,1,v=>EU(+(+v).toFixed(1))+' km',NOTE('total land border length','List of countries and territories by land borders')),
  L('nb-hi','The 10 countries with the most neighbouring countries',c=>landNeighbours(c).length,-1,v=>v+' neighbours','Independent countries that share a land border with it, from the country data used in Countries (mledoze/countries). Territories are not counted.'),
  L('lat-hi','The 10 northernmost countries',c=>c.lat,-1,v=>EU(Math.abs(v))+'°'+(v<0?'S':'N'),'Latitude of the centre of the country, from the country data used in Countries (mledoze/countries).'),
  L('lat-lo','The 10 southernmost countries',c=>c.lat,1,v=>EU(Math.abs(v))+'°'+(v<0?'S':'N'),'Latitude of the centre of the country, from the country data used in Countries (mledoze/countries).'),
  L('name-hi','The 10 countries with the longest names',c=>c.letters.length,-1,v=>v+' letters','Letters in the country\'s name as Geomingo writes it (spaces and hyphens not counted).'),
  L('name-lo','The 10 countries with the shortest names',c=>c.letters.length,1,v=>v+' letters','Letters in the country\'s name as Geomingo writes it (spaces and hyphens not counted).'),
  L('olympc-hi','The 10 countries with the most Olympic medals per person',c=>D('pop')(c)?Z(D('olymp'))(c)/D('pop')(c)*1e6:undefined,-1,v=>d1(v)+' per million people','All-time Olympic medals divided by population. Medals: Wikipedia, "All-time Olympic Games medal table" (Summer and Winter, up to the 2026 Winter Games). '+POPNOTE),
  // extra lists with their own figures (top10/extra-data.js)
  L('beer-hi','The 10 countries that drink the most beer (per person)',X('beer'),-1,v=>d1(v)+' litres',BEERNOTE),
  L('tour-hi','The 10 most visited countries (tourists from abroad)',X('tour'),-1,v=>d1(v)+' million','International tourist arrivals in 2024. The top 10: UN Tourism, as listed in Wikipedia, "World Tourism rankings". The other places: HelloSafe\'s 2026 table of UN Tourism figures (national figures where UN Tourism has none), which gives the same top 10. Countries outside its top 40 have no figure.'),
  L('wc-hi','The 10 countries that have played the most FIFA World Cups',Z(X('wc')),-1,PL('World Cup'),'Men\'s World Cups played, up to and including 2026, as counted by FIFA (Wikipedia, "National team appearances in the FIFA World Cup"): West Germany counts for Germany, the Soviet Union for Russia, Yugoslavia for Serbia and Czechoslovakia for Czechia. England counts for the United Kingdom; Scotland, Wales and Northern Ireland play separately and are not added.'),
  L('mcd-hi','The 10 countries with the most McDonald\'s restaurants',Z(X('mcd')),-1,PL('outlet'),MCDNOTE),
  L('mcdpc-hi','The 10 countries with the most McDonald\'s per person',c=>X('mcd')(c)&&D('pop')(c)?X('mcd')(c)/D('pop')(c)*1e6:undefined,-1,v=>d1(v)+' per M','Restaurants per million (M) people: restaurants divided by population. '+MCDNOTE+' '+POPNOTE),
  L('temp-lo','The 10 coldest countries (average yearly temperature)',X('temp'),1,v=>d1(v)+' °C',TEMPNOTE),
  L('nobel-hi','The 10 countries with the most Nobel Prize winners',Z(X('nobel')),-1,PL('winner'),'Nobel Prize winners up to October 2026. Source: Wikipedia, "List of Nobel laureates by country" (the top 15 updated with the 2026 prizes, as in Business Today, 19 October 2026). A winner linked to two countries counts for both; the Soviet Union counts for Russia.'),
  L('gold-hi','The 10 countries with the biggest gold reserves',X('gold'),-1,v=>n0(v)+' tonnes',NOTE('World Gold Council (IMF figures), August 2026, top 50 countries','Gold reserve')+' The World Gold Council\'s May 2026 table gives the same top 10.'),
  L('wine-hi','The 10 countries that make the most wine',X('wine'),-1,v=>v>=10?EU(v/10,2)+' bn litres':n0(v*100)+' M litres','Wine made in 2023. Source: International Organisation of Vine and Wine (OIV), "2024 World Wine Production Outlook", which lists 29 countries; the others have no figure.'),
  L('coffee-hi','The 10 countries that grow the most coffee',Z(X('coffee')),-1,v=>v>=1e6?EU(v/1e6,2)+' M t':n0(v)+' t','Green coffee grown in 2023. Source: FAO (FAOSTAT), as published by Our World in Data, "Coffee bean production"; Wikipedia, "List of countries by coffee production", gives the same top 10.'),
  // more lists: each top 10 checked against a second source
  L('rice-hi','The 10 countries that grow the most rice',X('rice'),-1,v=>v>=1e6?d1(v/1e6)+' M t':n0(v)+' t','Rice (paddy) grown in 2023. Source: FAO (FAOSTAT), as published by Our World in Data, "Rice production", which lists the top 40 here; Wikipedia, "List of countries by rice production" (FAO, 2022), gives the same top 10.'),
  L('oil-hi','The 10 countries that produce the most oil',X('oil'),-1,v=>n0(v)+' TWh','Oil produced in 2024, as energy (terawatt-hours). Source: Energy Institute, Statistical Review of World Energy, as published by Our World in Data, "Oil production"; the US EIA\'s 2023 ranking gives the same top 10.'),

      .sort((a,b)=>b.score-a.score||a.miss-b.miss||a.pl-b.pl||a.first-b.first),best=rk[0],nx=rk[1];
    const why=!nx||nx.score!==best.score?'':nx.miss!==best.miss?`Level on ${best.score}, so fewer wrong answers wins: ${best.miss} against ${nx.miss}.`
      :nx.pl!==best.pl?`Level on ${best.score} found and ${best.miss} wrong, so the higher places win: ${esc(best.name)}'s countries add up to ${best.pl} (places ${mineOf(best.i).map(c=>'#'+placeOf(l,c)).join(', ')}), ${esc(nx.name)}'s to ${nx.pl}.`
      :nx.first!==best.first?`Level on everything else, so the first to find a country wins.`:'',tie=!!nx&&nx.score===best.score&&!why;
    const mine=S.players[S.me];if(mine)logFriends('t10-friends',roomCode+':'+S.list+':'+(room&&room.created||''),1+rk.findIndex(p=>p.i===S.me),mine.score);
    h+=`<section class="panel"><span class="label">Room ${roomCode}</span><p class="big">${tie?"It's a tie":esc(best.name)+' wins'}</p>
      <p class="hint">${S.won?'All ten found.':`${S.found.length} of 10 found. The full list is below.`} ${rk.map(p=>`${esc(p.name)} ${p.score}`).join(' · ')}</p>${why?`<p class="hint" style="margin-top:0">${why}</p>`:''}
      ${S.host?`<div class="row-btns"><button class="primary" id="orematch" style="flex:1">Rematch</button><button class="ghost" id="olobby" style="flex:1">Back to room</button></div>`:'<p class="hint">Waiting for the host to start a rematch.</p>'}</section>`}
  if(!S.over&&!cur.on&&S.turn!==S.me)h+=`<button class="ghost" id="oskip">${esc(cur.name)} is offline: skip their turn</button>`;
  h+=`<section class="t10card"><div class="t10cq">${askHTML()}</div>${listHTML()}</section>${controlsHTML()}${wrongsHTML()}${srcHTML}`;
  h+=`<div class="row-btns">${S.host&&!S.over?'<button class="ghost" id="oend" style="flex:1">End game</button>':''}<button class="ghost" id="leave" style="flex:1">Leave room</button></div>`;
  return h}
// opening the game goes straight into today's game (or today's result when it is played)
function render(){
  if(view==='home'){openDaily();return}
  // the clock of the visas starts when today's list is first on screen (home or game), unless it is already over
  if(!TESTDAY&&!roomCode&&(view==='home'||view==='game'&&S&&S.mode==='daily')){const d=dailySaved();if(!(d&&d.over))Geomingo.clock.start('top10',todayKey())}
  // today's list is played on the home screen too: the summary follows the game, whatever the screen
  if(S&&S.mode!=='online')watchResult(tKey(),S.over);
  if(roomCode&&room){app.innerHTML=S&&S.mode==='online'?onlineHTML():lobbyHTML();bind();return}
  if(view==='home'){app.innerHTML=homeHTML();bind();return}
  if(view==='friends'){app.innerHTML=friendsHTML();bind();return}
  if(view==='solo'){app.innerHTML=soloHTML();bind();return}
  if(view==='archive'){app.innerHTML=archiveView();bind();return}
  const l=listById(S&&S.list);
  if(!S||!l){app.innerHTML=header('Top <span>10</span>','')+`<section class="panel"><p class="hint">Could not load the list. Try again later.</p></section>`;bind();return}
  let h=header('Top <span>10</span>',S.mode==='daily'?'Daily #'+S.num:S.mode==='archive'?'Archive #'+S.num:'Solo');
  h+=`<div class="backline"><button class="linkbtn" id="${S.mode==='archive'?'archback':S.mode==='free'?'soloback':'home'}">← Back</button><span class="ht">${S.mode==='daily'?"Today's list":S.mode==='archive'?'List #'+S.num:'Solo'}</span></div>`;
  // the ticket, as in every game: Mingo on top, then who is travelling, countries found and lives left
  const cell=Geomingo.tk,tk=()=>Geomingo.ticket(moodHTML(tKey(),'pass','10 stamps to win.',S.nolives?'In any order. No lives: play until you find them all.':'In any order. A country outside the top 10 costs a life.'),
    cell('Traveller',esc(Geomingo.traveller()),'tk-name')+cell('Found',S.found.length+'/10')+(S.mode==='daily'?cell('km',Geomingo.pts(S.found.length/10),'tk-pts'):'')+(S.nolives?cell('Mistakes',S.wrong.length,'tk-gs'):cell('Lives',livesHTML(S.lives,LIVES),'tk-gs')),{mode:S.mode==='free'?'practice':S.mode,num:S.num});
  // a guess while this list is on screen: only the ticket and the list change. The box you type in stays
  // where it is, so the phone keeps its keyboard open and the page does not jump up and down
  const g=$('t10game'),q=$('q');
  if(!S.over&&g&&g.dataset.k===tKey()&&q){const y=q.getBoundingClientRect().top;
    $('t10tk').innerHTML=tk();$('t10ls').innerHTML=listHTML();$('t10wr').innerHTML=wrongsHTML();if(q.value!==query)q.value=query;drawSugg();
    const dy=q.getBoundingClientRect().top-y;if(dy)window.scrollBy(0,dy);return}
  const card=`<section class="t10card"><div class="t10cq">${askHTML(true)}</div><div id="t10ls" style="display:contents">${listHTML()}</div></section>`;
  // today's daily done: the list goes inside the result ticket, Next trip and Share under it (Héctor 2026-11-12)
  if(S.over&&S.mode==='daily'){app.innerHTML=h+resultHTML(card+`<div id="t10wr" style="display:contents">${wrongsHTML()}</div>`)+rankingHTML()+srcHTML;bind();return}
  if(S.over)h+=resultHTML();
  else h+=`<div id="t10tk" style="display:contents">${tk()}</div>`;
  h+=`<section class="t10card"><div class="t10cq">${askHTML(true)}</div><div id="t10ls" style="display:contents">${listHTML()}</div></section>${S.over&&S.mode==='daily'?rankingHTML():''}${controlsHTML()}<div id="t10wr" style="display:contents">${wrongsHTML()}</div>${S.over?'':'<div class="t10gu" style="display:flex;justify-content:center">'+giveUpHTML()+'</div>'}${srcHTML}`;
  if(!S.over)h+=quickRules(' Full rules in <button type="button" class="qhelp">How to play</button>.')+`<i id="t10game" data-k="${esc(tKey())}" hidden></i>`;
  app.innerHTML=h;bind();
}
// Mingo's verdict, for the result panel
function verdict(){const f=S.found.length;
  return S.won?(!S.wrong.length?{pose:'happy',t:'Full page. Perfect ten.',s:S.nolives?'Not a single mistake.':'Not a single life lost.'}:{pose:'happy',t:'Visited. All ten.',s:livesTxt()})
    :f>=6?{pose:'think',t:'So close. '+f+' of 10.',s:S.nolives?'The full list is below.':'No lives left. The full list is below.'}:{pose:'sad',t:'Rough crossing, this one.',s:f+' of 10 found. The full list is below.'}}
function resultHTML(body){const v=verdict();
  if(S.mode==='daily')return `${Geomingo.doneTicket('top10',S.num,S.found.length+' of 10','next in '+nextIn(),body)}<pre class="sharebox" id="share" hidden>${esc(shareText())}</pre>
    <div class="gm-done-btns">${nextGameBtn('top10')}${SHARE_BTN.replace('Share result','Share')}</div>`;
  return `<section class="panel">${Geomingo.hello(v.pose,v.t,v.s,{key:'res'})}<span class="label">${S.mode==='daily'?'Top 10 #'+S.num:S.mode==='archive'?'Archive · Top 10 #'+S.num:'Solo list'}</span><p class="big">${S.found.length} of 10</p>
    <p class="hint">${S.won?(S.nolives?`You named the whole list with ${S.wrong.length} mistake${S.wrong.length===1?'':'s'}.`:`You named the whole list with ${S.lives} li${S.lives===1?'fe':'ves'} left.`):S.lives?'The full list is below.':'No lives left. The full list is below.'} ${S.mode==='daily'?`Next list in ${nextIn()}.`:S.mode==='archive'?"Archive games don't count for the ranking or your streak.":''}</p>
    <pre class="sharebox" id="share">${esc(shareText())}</pre>
    ${S.mode==='daily'?`${SHARE_BTN}<div class="row-btns sharerow">${nextGameBtn('top10')}</div>
    <button class="ghost" id="playsolo">Play Solo</button>${allPlayedHTML('top10')}`
    :S.mode==='archive'?`${SHARE_BTN}<div class="row-btns sharerow"><button class="primary" id="archback" style="flex:1">Back to archive</button></div>`
    :`${SHARE_BTN}<div class="row-btns sharerow"><button class="ghost" id="again" style="flex:1">New list</button></div>`}
    ${S.mode==='daily'?`<span class="label">Your daily lists</span>${statsHTML()}`:''}</section>${S.mode==='daily'?rankingHTML():''}`}
// today's ranking (signed-in players, first try of the day): countries found, then fewer misses, then who finished first
const rankingHTML=()=>Geomingo.account.rankingHTML('top10',{what:'list',score:r=>[r.s+'/10',r.m?r.m+' miss'+(r.m===1?'':'es'):'no misses']});
// signed in or out, today's result arrived from another device, the ranking moved: show it (not while typing)
Geomingo.account.onChange((why,typing)=>{if(why==='adopt'&&S&&S.mode==='daily'){const d=dailySaved();if(d){S=d;liveKey=''}}
  if(!typing&&!roomCode&&(view==='home'||view==='game'&&S&&S.over))render()});
function rulesHTML(){return `<h3>The idea</h3><ul>
  <li>Each game is a top 10 of countries based on real figures, for example "The 10 most populous countries" or "The 10 countries with the longest coastline".</li>
  <li>Name the ten countries in the list, in any order. Each one you find appears in its place, with its figure.</li>
  <li>Some lists cover the whole world, others one continent (Europe, Asia, Africa or the Americas). In a continent list, only its countries count.</li>
  <li>If several countries tie for 10th place, any of them counts: find ten to win.</li>
  <li>Only independent countries count, never territories. <b>Where the numbers come from</b> shows the source of each list.</li></ul>
  <h3>How to play</h3><ul>
  <li>Tap <b>Type a country…</b>, start typing and tap the country in the list.</li>
  <li>In the top 10: it appears in its place.</li>
  <li>Not in the top 10: you lose one of your <b>${LIVES} lives</b>, and you see where it ranks.</li>
  <li>The game ends when you find all ten or run out of lives. Then the full list is shown. <b>Give up</b> ends it early.</li></ul>
  <h3>Modes</h3><ul>
  <li><b>Today's list</b>: the same for everyone, new every day at midnight CET. One try. Missed one? Play it in <b>Menu → Archive</b>.</li>
  <li><b>Solo</b>: as many practice lists as you like, a new one each time until you have played them all. <b>Share</b> sends a friend a link to the same list. Pick <b>No lives</b> to train: play until the end, mistakes are only counted.</li>
  <li><b>With friends</b>: 2 to ${MAXP} players online, each on their own phone. The host creates a room and shares its code or link, and can set a time per turn (Off, 15 s or 30 s). You take turns naming a country: one in the top 10 scores a point, one outside passes the turn. There are no lives. You can also tap <b>Pass</b>, and running out of time passes too. The game ends when the ten are found or everyone passes in a row. Most points wins. If level: fewer wrong answers wins, then the higher places found (the lower your places add up), then whoever found a country first.</li></ul>`}
// tapping a suggestion does not take the focus from the box, so the phone keyboard stays open
function drawSugg(){const u=$('sugg');if(u){u.innerHTML=suggHTML();u.querySelectorAll('[data-g]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>guess(b.dataset.g)})}}
function bind(){
  if($('daily'))$('daily').onclick=openDaily;
  app.querySelectorAll('[data-go="free"]').forEach(b=>b.onclick=openSolo);
  if($('start'))$('start').onclick=()=>openFree(null,true);
  if($('cont'))$('cont').onclick=()=>openFree();
  if($('playsolo'))$('playsolo').onclick=openSolo;
  if($('soloback'))$('soloback').onclick=openSolo;
  if($('archback'))$('archback').onclick=openArchive;
  app.querySelectorAll('[data-arch]').forEach(b=>b.onclick=()=>playArchive(b.dataset.arch));
  app.querySelectorAll('[data-go="friends"]').forEach(b=>b.onclick=()=>{view='friends';render();window.scrollTo(0,0)});
  if($('home'))$('home').onclick=toHub;
  if($('rules'))$('rules').onclick=()=>dialog('How to play',rulesHTML());
  // give up: the list ends as it stands and the full ranking is shown
  bindGiveUp(()=>{if(!S||S.over||S.mode==='online')return;S.over=true;query='';typing=false;if(view==='home')view='game';save();render();window.scrollTo(0,0)});
  if($('src'))$('src').onclick=()=>{const l=listById(S.list);dialog(esc(l.title),`<p>${esc(l.src)}</p><p class="hint">Independent countries only. Countries the source does not measure have no place.</p>`)};
  // phones: the ten places in two columns while you play; the button (or an empty place) opens the answer sheet
  document.body.classList.toggle('kbon',!!(KB&&S&&!S.over&&document.querySelector('.t10list')));
  bindAsk($('askbtn')&&S?{key:tKey()+':'+(S.turn||0),
    head:`${esc(listById(S.list).title)} <i>${S.found.length} of 10 found</i>`,back:'Back to list',
    sugg:t=>{query=t;return suggHTML()},first:t=>{query=t;const m=matches(t).filter(c=>!S.found.includes(c.c)&&!S.wrong.includes(c.c));return m[0]&&m[0].c},
    pick:guess}:null);
  const q=$('q');
  if(q){q.oninput=e=>{query=e.target.value;drawSugg()};
    q.onkeydown=e=>{if(e.key==='Enter'){const m=matches(query).filter(c=>!S.found.includes(c.c)&&!S.wrong.includes(c.c));if(m[0])guess(m[0].c)}};
    drawSugg();
    // computers: the box has the focus while you play
    if(query||typing||view!=='home')setTimeout(()=>{q.focus({preventScroll:true});q.setSelectionRange(q.value.length,q.value.length)},0)}
  if($('copy'))$('copy').onclick=()=>share(shareMessage());
  if($('again'))$('again').onclick=()=>openFree(null,true);
  // With friends
  app.querySelectorAll('[data-seg="nolives"]').forEach(b=>b.onclick=()=>{store('t10-nolives',+b.dataset.v);render()});
  app.querySelectorAll('[data-seg="timer"]').forEach(b=>b.onclick=()=>{saveSetup();setup.timer=+b.dataset.v;saveSetup();render()});
  if($('fname'))$('fname').onchange=saveSetup;
  if($('jcode'))$('jcode').oninput=e=>{setup.join=e.target.value};
  if($('create'))$('create').onclick=createRoom;
  if($('join'))$('join').onclick=()=>joinRoom($('jcode').value);
  if($('jcode'))$('jcode').onkeydown=e=>{if(e.key==='Enter')joinRoom(e.target.value)};
  if($('copylink'))$('copylink').onclick=()=>{const t=pageLink('?room='+roomCode);
    if(navigator.share&&TOUCH){navigator.share({text:'Play Top 10 with me: '+t}).catch(()=>{});return}
    try{navigator.clipboard.writeText(t).then(()=>toast('Link copied.','good'),()=>toast('Copy the link above.'))}catch(e){toast('Copy the link above.')}};
  if($('leave'))$('leave').onclick=()=>{if(S&&S.mode==='online'&&!S.over&&!confirm('Leave the room? The game goes on without you.'))return;leaveRoom()};
  if($('ostart'))$('ostart').onclick=()=>onlineAct('start');
  if($('orematch'))$('orematch').onclick=()=>onlineAct('rematch');
  if($('olobby'))$('olobby').onclick=()=>onlineAct('lobby');
  if($('oend'))$('oend').onclick=()=>{if(confirm('End the game for everyone?'))onlineAct('end')};
  if($('opass'))$('opass').onclick=()=>onlineAct('pass');
  if($('oskip'))$('oskip').onclick=()=>onlineAct('skip');
}

/* ---- start: today's list on the home screen; ?l=pop-hi opens that list in Solo (a shared link), ?room=ABCD a friend's room, ?friends With friends ---- */
(()=>{const id=TESTQ.get('l'),rm=(TESTQ.get('room')||'').toUpperCase();
  if(id&&listById(id)){openFree(id);try{history.replaceState(null,'',location.pathname)}catch(e){}return}
  if(/^[A-Z]{4}$/.test(rm)){view='friends';setup.join=rm}
  else if(TESTQ.has('friends')){view='friends';try{history.replaceState(null,'',location.pathname)}catch(e){}}
  render()})();
// back in a room after a reload (the online scripts load after the page)
window.addEventListener('DOMContentLoaded',()=>{const code=Geomingo.room.saved('t10-room'); // an old or finished room is not reopened
  if(view==='friends')render(); // the Create and Join buttons were drawn before Firebase loaded
  if(!code||!initFB())return;
  db.ref('rooms/'+code).once('value').then(s=>{const r=s.val();
    if(r&&r.game==='top10'&&r.players&&r.players[ME]&&!roomCode&&Geomingo.room.resume('t10-room',r.status==='over'))listenRoom(code);else if(!roomCode)Geomingo.room.forget('t10-room')}).catch(()=>{})});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&roomCode&&room&&Geomingo.room.stale(room.status==='over')){leaveRoom().then(()=>{view='home';render()});return}
  if(document.hidden||roomCode)return;if(view==='home')render();else if(mode==='daily'&&S&&S.mode==='daily'&&S.date!==todayKey())openDaily()});
</script>
