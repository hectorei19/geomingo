/* Top 10: a ranked list with ten empty rows that fill in as you name the countries */
.t10q{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:1.9rem;line-height:1;letter-spacing:.02em;margin:0;text-wrap:balance}
.t10list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.t10list li{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px;border-top:1px dashed var(--rule)}
.t10list li:first-child{border-top:0}

.t10list li.miss .nm{color:var(--ink-2);font-weight:500}
.t10list .mini{width:24px;height:24px}
.t10in{display:flex;flex-direction:column;gap:6px}
.t10in input{width:100%;border:1.5px solid var(--ink);border-radius:5px;padding:12px;font-size:1.1rem;background:var(--paper)}
.t10in .sugg{max-height:none}
.lives{display:flex;align-items:center;gap:8px;font-size:.95rem;color:var(--ink-2)}
.lives i{width:12px;height:12px;border-radius:50%;background:var(--bad)}
.lives i.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule)}
.lives .cnt{margin-left:auto;font-family:var(--mono);font-size:.8rem}
.wrongs{margin:0;font-size:.92rem;color:var(--ink-2)}
.modes{max-width:320px;width:100%;align-self:center}
/* Geomingo look for the list */
.t10q{font-family:var(--display);font-weight:600;text-transform:none;letter-spacing:0;font-size:1.6rem;line-height:1.1}
.t10list{border:2px solid var(--line);border-radius:18px;box-shadow:none}
.t10list li{border-top:2px dashed var(--line)}
.t10list .rk{font-family:var(--display);font-weight:700;color:var(--flamingo-text)}

.lives i{background:var(--flamingo)}
.lives .cnt{font-family:var(--body);font-weight:800}

<script>
/* ---- the rankings ----
   Only numbers Countries already uses (DATA and the country data), with the sources named in its Credits.
   Independent countries only. A list is used only when the 10th and 11th places are not tied. */
const T10_FIRST='2026-10-19',LIVES=3;
const SOVC=C.filter(c=>!c.t);
const n0=v=>Math.round(v).toLocaleString('en-GB');
const ppl=v=>v>=1e9?(v/1e9).toFixed(2)+' billion':v>=1e6?(v/1e6).toFixed(1)+' million':n0(v);
const d1=v=>(+v).toFixed(1);
const num=v=>typeof v==='number'&&isFinite(v)?v:undefined;
const D=k=>c=>num(DATA[k][c.c]);
const AREANOTE='Total area (land and inland water), from the country data used in Countries (mledoze/countries). Vatican City, missing there, is 0.44 km² (Wikipedia, "Vatican City").';
// area in km²: the country data has none for Vatican City, so its official 0.44 km² is added here
const AREA=c=>c.c==='VAT'?0.44:c.a>0?c.a:undefined;
const big=v=>v>=1e12?(v/1e12).toFixed(2)+' trillion':v>=1e9?(v/1e9).toFixed(1)+' billion':(v/1e6).toFixed(0)+' million';
const GDPNOTE=NOTE('World Bank figures, 2025 column','List of countries by GDP (nominal) per capita');
const CO2NOTE=NOTE('figures for 2023','List of countries by carbon dioxide emissions per capita');
const FORESTNOTE=NOTE('forest share of land area','List of countries by forest area');
const L=(id,title,get,dir,fmt,src)=>({id,title,get,dir,fmt,src});
// the world lists; each one also comes in a version for Europe, Asia, Africa and the Americas (see REGIONS below)
const WORLD_LISTS=[
  L('pop-hi','The 10 most populous countries',D('pop'),-1,ppl,POPNOTE),
  L('pop-lo','The 10 least populous countries',D('pop'),1,v=>n0(v)+' people',POPNOTE),
  L('area-hi','The 10 largest countries by area',AREA,-1,v=>n0(v)+' km²',AREANOTE),
  L('area-lo','The 10 smallest countries by area',AREA,1,v=>v<1?v+' km²':n0(v)+' km²',AREANOTE),
  L('dens-hi','The 10 most densely populated countries',c=>D('pop')(c)&&AREA(c)?D('pop')(c)/AREA(c):undefined,-1,v=>n0(v)+' people per km²','Population divided by total area. '+POPNOTE+' '+AREANOTE),
  L('dens-lo','The 10 most sparsely populated countries',c=>D('pop')(c)&&AREA(c)?D('pop')(c)/AREA(c):undefined,1,v=>d1(v)+' people per km²','Population divided by total area. '+POPNOTE+' '+AREANOTE),
  L('gdptot-hi','The 10 countries with the biggest economy (total GDP)',c=>D('pop')(c)&&D('gdp')(c)?D('pop')(c)*D('gdp')(c):undefined,-1,v=>'$'+big(v),'GDP per person times population. '+GDPNOTE+' '+POPNOTE),
  L('gdp-hi','The 10 countries with the highest GDP per person',D('gdp'),-1,v=>'$'+n0(v),GDPNOTE),
  L('gdp-lo','The 10 countries with the lowest GDP per person',D('gdp'),1,v=>'$'+n0(v),GDPNOTE),
  L('hdi-hi','The 10 countries with the highest Human Development Index',D('hdi'),-1,v=>(+v).toFixed(3),NOTE('UNDP figures for 2023','List of countries by Human Development Index')),
  L('hdi-lo','The 10 countries with the lowest Human Development Index',D('hdi'),1,v=>(+v).toFixed(3),NOTE('UNDP figures for 2023','List of countries by Human Development Index')),
  L('life-hi','The 10 countries with the longest life expectancy',D('life'),-1,v=>d1(v)+' years',NOTE('UN figures for 2023','List of countries by life expectancy')),
  L('life-lo','The 10 countries with the shortest life expectancy',D('life'),1,v=>d1(v)+' years',NOTE('UN figures for 2023','List of countries by life expectancy')),
  L('age-hi','The 10 countries with the oldest population (median age)',D('age'),-1,v=>d1(v)+' years',NOTE('CIA World Factbook, 2024 estimates','List of countries by median age')),
  L('age-lo','The 10 countries with the youngest population (median age)',D('age'),1,v=>d1(v)+' years',NOTE('CIA World Factbook, 2024 estimates','List of countries by median age')),
  L('cpi-hi','The 10 least corrupt countries (Corruption Perceptions Index)',D('cpi'),-1,v=>n0(v)+' / 100',NOTE('Transparency International, 2025 index','Corruption Perceptions Index')),
  L('cpi-lo','The 10 most corrupt countries (Corruption Perceptions Index)',D('cpi'),1,v=>n0(v)+' / 100',NOTE('Transparency International, 2025 index','Corruption Perceptions Index')),
  L('co2-hi','The 10 countries with the most CO₂ emissions per person',D('co2'),-1,v=>d1(v)+' t',CO2NOTE),
  L('co2tot-hi','The 10 countries with the most CO₂ emissions in total',c=>D('pop')(c)&&D('co2')(c)?D('pop')(c)*D('co2')(c):undefined,-1,v=>(v>=1e9?(v/1e9).toFixed(2)+' billion':(v/1e6).toFixed(1)+' million')+' t','Emissions per person times population. '+CO2NOTE+' '+POPNOTE),
  L('urban-lo','The 10 countries with the smallest share of urban population',D('urban'),1,v=>d1(v)+'%',NOTE('UN figures for 2023','Urbanization by sovereign state')),
  L('capshare-hi','The 10 countries where the most people live in the capital (share of population)',c=>{if(DATA.cap_skip.includes(c.c)||!D('pop')(c)||!num(DATA.cappop[c.c]))return;const v=DATA.cappop[c.c]/D('pop')(c)*100;return v<95?v:undefined},-1,v=>d1(v)+'%','Population of the capital within its city limits, divided by the population of the country. City-states (Vatican City, Singapore, Monaco), where the capital is the whole country, are left out. '+CAPNOTE+' '+POPNOTE),
  L('coast-hi','The 10 countries with the longest coastline',D('coast'),-1,v=>n0(v)+' km',NOTE('CIA World Factbook figures','List of countries by length of coastline')),
  L('elev-hi','The 10 countries with the highest top point',D('elev'),-1,v=>n0(v)+' m',NOTE('highest points','List of elevation extremes by country')),
  L('elev-lo','The 10 flattest countries (lowest top point)',D('elev'),1,v=>n0(v)+' m',NOTE('highest points','List of elevation extremes by country')),
  L('landb-hi','The 10 countries with the longest land borders',D('landb'),-1,v=>n0(v)+' km',NOTE('total land border length','List of countries and territories by land borders')),
  L('forest-hi','The 10 most forested countries (share of land)',D('forest'),-1,v=>d1(v)+'%',FORESTNOTE),
  L('forestkm-hi','The 10 countries with the most forest (area)',c=>D('forest')(c)!==undefined&&AREA(c)?D('forest')(c)*AREA(c)/100:undefined,-1,v=>n0(v)+' km²','Forest share of land times total area, so a rough figure. '+FORESTNOTE+' '+AREANOTE),
  L('olymp-hi','The 10 countries with the most Olympic medals',D('olymp'),-1,v=>n0(v)+' medals','All Summer and Winter Olympics together, up to the 2026 Winter Games. Medals won as part of a former team (Soviet Union, East Germany...) are not added. Source: Wikipedia, "All-time Olympic Games medal table".'),
  L('cap-hi','The 10 countries with the most populous capital city',c=>DATA.cap_skip.includes(c.c)?undefined:num(DATA.cappop[c.c]),-1,ppl,'Population of the capital within its city limits. '+CAPNOTE),
  L('cap-lo','The 10 countries with the least populous capital city',c=>DATA.cap_skip.includes(c.c)||!(DATA.cappop[c.c]>0)?undefined:DATA.cappop[c.c],1,v=>n0(v)+' people','Population of the capital within its city limits. '+CAPNOTE),
  L('gdptot-lo','The 10 countries with the smallest economy (total GDP)',c=>D('pop')(c)&&D('gdp')(c)?D('pop')(c)*D('gdp')(c):undefined,1,v=>'$'+big(v),'GDP per person times population. '+GDPNOTE+' '+POPNOTE),
  L('co2-lo','The 10 countries with the least CO₂ emissions per person',D('co2'),1,v=>(+v).toFixed(2)+' t',CO2NOTE),
  L('urban-hi','The 10 most urban countries (share of urban population)',D('urban'),-1,v=>d1(v)+'%',NOTE('UN figures for 2023','Urbanization by sovereign state')),
  L('forest-lo','The 10 least forested countries (share of land)',D('forest'),1,v=>d1(v)+'%',FORESTNOTE),
  L('coast-lo','The 10 countries with the shortest coastline (landlocked ones left out)',c=>D('coast')(c)>0?D('coast')(c):undefined,1,v=>d1(v).replace(/\.0$/,'')+' km',NOTE('CIA World Factbook figures','List of countries by length of coastline')),
  L('landb-lo','The 10 countries with the shortest land borders (islands left out)',c=>D('landb')(c)>0?D('landb')(c):undefined,1,v=>d1(v).replace(/\.0$/,'')+' km',NOTE('total land border length','List of countries and territories by land borders')),
  L('nb-hi','The 10 countries with the most neighbouring countries',c=>c.b.filter(x=>byCode[x]&&!byCode[x].t).length,-1,v=>v+' neighbours','Independent countries that share a land border with it, from the country data used in Countries (mledoze/countries). Territories are not counted.'),
  L('lat-hi','The 10 northernmost countries',c=>c.lat,-1,v=>Math.abs(v)+'°'+(v<0?'S':'N'),'Latitude of the centre of the country, from the country data used in Countries (mledoze/countries).'),
  L('lat-lo','The 10 southernmost countries',c=>c.lat,1,v=>Math.abs(v)+'°'+(v<0?'S':'N'),'Latitude of the centre of the country, from the country data used in Countries (mledoze/countries).'),
  L('name-hi','The 10 countries with the longest names',c=>c.letters.length,-1,v=>v+' letters','Letters in the country\'s name as Geomingo writes it (spaces and hyphens not counted).'),
  L('name-lo','The 10 countries with the shortest names',c=>c.letters.length,1,v=>v+' letters','Letters in the country\'s name as Geomingo writes it (spaces and hyphens not counted).'),
  L('olympc-hi','The 10 countries with the most Olympic medals per person',c=>D('olymp')(c)&&D('pop')(c)?D('olymp')(c)/D('pop')(c)*1e6:undefined,-1,v=>d1(v)+' per million people','All-time Olympic medals divided by population. Medals: Wikipedia, "All-time Olympic Games medal table" (Summer and Winter, up to the 2026 Winter Games). '+POPNOTE),
];
// the same rankings within one continent, as the country data groups them (Russia and Cyprus count as Europe; Turkey and the Caucasus as Asia)
const REGIONS=[
  {k:'eu',name:'Europe',in:c=>c.r==='EU'},
  {k:'as',name:'Asia',in:c=>c.r==='AS'},
  {k:'af',name:'Africa',in:c=>c.r==='AF'},
  {k:'am',name:'the Americas',in:c=>c.r==='NA'||c.r==='SA'},
];
const ALL_LISTS=[...WORLD_LISTS,...REGIONS.flatMap(g=>WORLD_LISTS.map(l=>({...l,id:l.id+'-'+g.k,reg:g,
  title:l.title.replace(' countries',' countries in '+g.name),
  src:'Only countries in '+g.name+', as the country data used in Countries groups them. '+l.src})))];
// full ranking of a list: every independent country with a figure (in its continent, for a continent list), best first
function ranking(l){return SOVC.filter(c=>!l.reg||l.reg.in(c)).map(c=>({c:c.c,v:l.get(c)})).filter(x=>x.v!==undefined).sort((a,b)=>l.dir*(a.v-b.v)||(a.c<b.c?-1:1))}
// the countries that count as the top 10: the first ten, plus any tied with the 10th (then any of them counts)
function topCodes(l){const r=ranking(l),cut=r[9].v;return r.filter(x=>l.dir*(x.v-cut)<=0).map(x=>x.c)}
// a country's place, shared when tied ("#10" for every country level with the 10th)
function placeOf(l,code){const r=ranking(l),x=r.find(y=>y.c===code);return x?r.findIndex(y=>y.v===x.v)+1:0}
// lists used: at least 20 countries with a figure, and at most 12 countries level with the top 10
const LISTS=ALL_LISTS.filter(l=>{const r=ranking(l);return r.length>=20&&topCodes(l).length<=12});
const listById=id=>ALL_LISTS.find(l=>l.id===id);
// the daily list: lists come in a shuffled order that is the same for everyone, so none repeats until all were used.
// The first round (2026-10-19 to 2026-11-05) keeps the 18 lists the game began with, in the same order as before.
const FIRST_ROUND=['pop-hi','pop-lo','area-hi','gdp-hi','gdp-lo','hdi-hi','hdi-lo','life-lo','age-hi','co2-hi','urban-lo','coast-hi','elev-hi','elev-lo','landb-hi','forest-hi','olymp-hi','cap-hi'].map(listById);
function dailyList(key){const n=dayNum(key,T10_FIRST)-1;
  if(n<FIRST_ROUND.length)return shuffle(FIRST_ROUND,rngFrom(seedOf('top10-cycle-0')))[Math.max(n,0)];
  const m=n-FIRST_ROUND.length,len=LISTS.length,cycle=Math.floor(m/len);
  return shuffle(LISTS,rngFrom(seedOf('top10-round-'+cycle)))[m%len]}
// Solo: a random list you have not played on this device yet; when all were played, they all come back
function soloList(){const seen=new Set(load('t10-seen',[])),cur=S&&S.list;
  let o=LISTS.filter(x=>!seen.has(x.id)&&x.id!==cur);
  if(!o.length){store('t10-seen',[]);o=LISTS.filter(x=>x.id!==cur)}
  return o[Math.floor(Math.random()*o.length)]}
function markSeen(id){const s=load('t10-seen',[]);if(!s.includes(id)){s.push(id);store('t10-seen',s)}}
function newGame(mode,l,day){
  const S={mode,list:l.id,top:topCodes(l),found:[],wrong:[],lives:LIVES,over:false,won:false};
  if(mode==='daily'||mode==='archive'){S.date=day||todayKey();S.num=dayNum(S.date,T10_FIRST)}
  return S}

/* ---- state ----
   view: 'home' (today's list, then Solo and With friends), 'game' (a list on its own screen), 'solo' (Solo's start screen),
   'archive' (past daily lists) or 'friends' (online rooms) */
let S=null,mode='daily',view='home',query='',fresh=null,typing=false;
const dailySaved=()=>{const d=load('t10-daily',null);return d&&d.date===todayKey()?d.S:null};
function save(){if(!S||S.mode==='online')return;
  if(S.mode==='daily'){store('t10-daily',{date:S.date,over:S.over,S});
    if(S.over){const h=load('t10-hist',{});if(!h[S.date]){h[S.date]={f:S.found.length,l:S.lives};store('t10-hist',h);if(!TESTDAY)Geomingo.account.done('top10')}}}
  else if(S.mode==='archive'){const a=load('t10-arch',{});a[S.date]=S;store('t10-arch',a)}
  else store('t10-free',S)}
// today's game, saved or new (a new one is saved at the first answer)
function dailyGame(){const d=dailySaved();return d&&d.date===todayKey()?d:newGame('daily',dailyList(todayKey()))}
function openDaily(){view='game';mode='daily';S=dailyGame();query='';render();window.scrollTo(0,0)}
function openFree(id,fresh){view='game';mode='free';const f=load('t10-free',null);
  if(!id&&!fresh&&f&&!f.over&&listById(f.list))S=f;
  else{const l=id&&listById(id)||soloList();S=newGame('free',l);markSeen(l.id)}
  query='';save();render();window.scrollTo(0,0)}
// Solo: a screen to start from, as in every game (an unfinished practice list can be continued)
function openSolo(){view='solo';query='';render();window.scrollTo(0,0)}
function soloHTML(){const f=load('t10-free',null),open=f&&!f.over&&listById(f.list);
  return header('Top <span>10</span>','Solo')+`<section class="panel">
    <div class="backline"><button class="linkbtn" id="home">← Back</button><span class="ht">Solo</span></div>
    <p class="hint">Practice on unlimited lists, at your pace. A different list each time until you have played them all; Share sends a link to the same list.</p>
    ${open?`<button class="ghost" id="cont">Continue your list (${f.found.length}/10)</button>`:''}
    <button class="primary" id="start">Start game</button></section>${quickRules(' Full rules in <b>How to play</b>.')}`}
// the archive: past daily lists, one try each on this device
const archDay=k=>{const e=load('t10-hist',{})[k];return e?e.f+'/10':null};
function openArchive(){view='archive';query='';render();window.scrollTo(0,0)}
function playArchive(k){if(archDay(k)){toast('You played this list on its day.');return}
  const a=load('t10-arch',{});view='game';mode='archive';
  S=a[k]&&listById(a[k].list)?a[k]:newGame('archive',dailyList(k),k);query='';save();render();window.scrollTo(0,0)}
const archiveView=()=>header('Top <span>10</span>','Archive')+archiveHTML({first:T10_FIRST,label:'List',num:k=>dayNum(k,T10_FIRST),
  played:archDay,saved:k=>load('t10-arch',{})[k]||null,
  done:g=>[g.found.length+'/10',`<span class="dsq" style="grid-template-columns:repeat(5,1fr)" aria-hidden="true">${tiles(g).map(on=>`<i class="${on?'on':''}"></i>`).join('')}</span>`]});

/* ---- the search box: names only, found by their first letters, like Countries ---- */
function matches(q){const k=N(q),l=listById(S.list);if(!k)return[];return SOVC.filter(c=>(!l.reg||l.reg.in(c))&&(c.k.startsWith(k)||c.ak.some(a=>a.startsWith(k)))).slice(0,8)}
function suggHTML(){if(!query)return '';const res=matches(query);
  if(!res.length){const l=listById(S.list),k=N(query),out=l.reg&&SOVC.find(c=>c.k.startsWith(k)||c.ak.some(a=>a.startsWith(k)));

const FB_OK=()=>typeof firebase!=='undefined'&&typeof firebase.database==='function'&&!!(window.FIREBASE_CONFIG&&/^https:\/\//.test(FIREBASE_CONFIG.databaseURL||''));
const ROOM_V='t10-202610251900',MAXP=6,TIMERS=[0,15,30];

    for(let i=0;i<8;i++){code=randRoom();const ex=await db.ref('rooms/'+code).get();if(!ex.exists())break}
    await db.ref('rooms/'+code).set({game:'top10',v:ROOM_V,host:ME,created:TS(),cfg:{timer:setup.timer},status:'lobby',

async function joinRoom(raw){
  const code=(raw||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(code.length!==4){toast('Room codes have 4 letters.','bad');return}
  if(needName())return;
  if(!initFB()){toast('Online play is not available right now. Check the connection and reload.','bad');return}
  if(joining)return;joining=true;
  try{let why='';
    const res=await db.ref('rooms/'+code).transaction(r=>{
      if(!r)return r;
      if(r.game!=='top10'){why='other';return}
      if(r.v!==ROOM_V){why='version';return}
      r.players=r.players||{};
      if(r.players[ME]){r.players[ME].name=setup.fname;r.players[ME].on=true;return r}
      if(r.status!=='lobby'){why='started';return}
      if(Object.keys(r.players).length>=MAXP){why='full';return}
      r.players[ME]={name:setup.fname,t:now(),on:true};return r});
    const val=res.snapshot.val();
    if(!val){toast('No room called '+code+'. Check the code.','bad');return}
    if(!res.committed||!val.players||!val.players[ME]){
      toast(why==='other'?code+' is a room of another game. Open that game to join it.':why==='version'?'You and the host have different versions of the game. Both of you reload the page, then try again.':why==='full'?'Room '+code+' already has '+MAXP+' players.':why==='started'?'That game has already started. Ask the host for a rematch.':'Could not join '+code+'.','bad');return}
    listenRoom(code)}catch(e){console.error(e);toast('Could not join. Check the connection and try again.','bad')}
  finally{joining=false}}
function listenRoom(code){
  if(roomRef)roomRef.off();
  roomCode=code;roomRef=db.ref('rooms/'+code);firstSync=true;seenEv=null;view='friends';setup.join='';
  try{localStorage.setItem('t10-room',code)}catch(e){}
  try{const u=new URL(location.href);if(u.searchParams.has('room')){u.searchParams.delete('room');history.replaceState(null,'',u.pathname+u.search)}}catch(e){}
  const me=roomRef.child('players/'+ME+'/on');me.onDisconnect().set(false);
  db.ref('.info/connected').on('value',s=>{if(s.val()&&roomCode===code){me.onDisconnect().set(false);roomRef.child('players/'+ME).once('value',p=>{if(p.exists())me.set(true)})}});
  roomRef.on('value',snap=>{const r=snap.val();
    if(!r||!r.players||!r.players[ME]){const was=roomCode;dropRoom();
      if(was)toast(r?'You are no longer in room '+was+'.':'Room '+was+' was closed.','bad');render();return}

function dropRoom(){

async function leaveRoom(){const ref=roomRef;

    try{await ref.transaction(r=>{if(!r)return r;if(r.players)delete r.players[ME];
      const left=lobbyOrder(r);if(!left.length)return null;if(r.host===ME)r.host=left[0];return r})}catch(e){}}

  dropRoom();view='friends';render()}
// the room as a game state, rebuilt on every change
function syncRoom(){const r=room;
  if(r.status==='lobby'||!listById(r.list)){S=null;clearInterval(tick);render();return}
  const order=r.order||lobbyOrder(r),fd=r.found||{},wr=r.wrong||{},byK=o=>Object.keys(o).sort((a,b)=>o[a].k-o[b].k);
  const players=order.map((pid,i)=>{const p=r.players[pid]||{};
    return {pid,name:p.name||'Gone',on:p.on!==false,lives:livesOf(r,pid),score:Object.values(fd).filter(x=>x.o===i).length,miss:Object.values(wr).filter(x=>x.o===i).length}});
  const me=order.indexOf(ME);
  S={mode:'online',list:r.list,top:topOf(r.list),found:byK(fd),wrong:byK(wr),by:Object.fromEntries([...Object.entries(fd),...Object.entries(wr)].map(([c,x])=>[c,x.o])),
     players,turn:r.turn||0,timer:r.cfg.timer||0,deadline:r.deadline||0,over:r.status==='over',me,host:r.host===ME,lives:me>=0?players[me].lives:0};
  S.won=S.found.length>=10;

  firstSync=false;

// next turn: the next player with lives left (online players first); the game ends when nobody can play on
function advance(r){const order=r.order,len=order.length,alive=i=>livesOf(r,order[i])>0;
  const nAlive=order.filter((_,i)=>alive(i)).length;
  if(Object.keys(r.found||{}).length>=10||!nAlive||(r.passes||0)>=nAlive){r.status='over';r.deadline=0;return}
  const t=r.turn||0;let next=-1;
  for(let s=1;s<=len&&next<0;s++){const i=(t+s)%len;if(alive(i)&&(r.players[order[i]]||{}).on!==false)next=i}
  for(let s=1;s<=len&&next<0;s++){const i=(t+s)%len;if(alive(i))next=i}
  r.turn=next;r.deadline=r.cfg.timer?now()+r.cfg.timer*1000:0}
async function onlineGuess(code){const c=byCode[code];let note='';
  try{const res=await roomRef.transaction(r=>{
      if(!r)return r;
      if(r.status!=='playing'){note='over';return}
      if(r.order[r.turn||0]!==ME){note='turn';return}
      r.found=r.found||{};r.wrong=r.wrong||{};
      if(r.found[code]||r.wrong[code]){note='tried';return}
      const nm=(r.players[ME]||{}).name||'Someone',top=topOf(r.list),i=top.indexOf(code);
      r.k=(r.k||0)+1;r.passes=0;
      if(i>=0){r.found[code]={o:r.turn||0,k:r.k};r.ev={id:evId(),kind:'good',c:code,text:`${nm}: ${c.n} is #${placeOf(listById(r.list),code)}.`}}
      else{r.wrong[code]={o:r.turn||0,k:r.k};r.lives=r.lives||{};r.lives[ME]=livesOf(r,ME)-1;
        const k=placeOf(listById(r.list),code)-1;
        r.ev={id:evId(),kind:'bad',text:`${nm}: ${c.n} is not in the top 10${k>=0?` (#${k+1})`:''}.${r.lives[ME]<=0?' Out of lives.':''}`}}
      advance(r);return r});
    if(!res.committed)toast(note==='turn'?'It is not your turn any more.':note==='tried'?c.n+' was already named.':'The game is over.','bad')}
  catch(e){console.error(e);toast('That answer did not go through. Check the connection.','bad')}}
async function onlineAct(kind){
  try{await roomRef.transaction(r=>{
    if(!r)return r;
    const nm=(r.players[ME]||{}).name||'Someone',cur=r.order&&r.order[r.turn||0];
    if(kind==='pass'){if(r.status!=='playing'||cur!==ME)return;r.passes=(r.passes||0)+1;r.ev={id:evId(),kind:'',text:nm+' passed.'};advance(r);return r}
    // anyone can move the game on when the player whose turn it is has left
    if(kind==='skip'){if(r.status!=='playing'||!cur||(r.players[cur]||{}).on!==false)return;
      r.passes=(r.passes||0)+1;r.ev={id:evId(),kind:'',text:((r.players[cur]||{}).name||'Someone')+' is offline: turn skipped.'};advance(r);return r}
    if(kind==='end'){if(r.status!=='playing'||r.host!==ME)return;r.status='over';r.deadline=0;r.ev={id:evId(),kind:'',text:nm+' ended the game.'};return r}
    if(kind==='start'||kind==='rematch'){if(r.host!==ME)return;
      const order=(kind==='start'?lobbyOrder(r):(r.order||lobbyOrder(r))).filter(pid=>r.players[pid]&&(kind==='start'||r.players[pid].on!==false));
      if(order.length<2)return;
      r.order=order;r.list=randomList(r.list);r.v=ROOM_V;r.found=null;r.wrong=null;r.lives=null;r.k=0;r.passes=0;r.turn=0;r.status='playing';
      r.deadline=r.cfg.timer?now()+r.cfg.timer*1000:0;
      r.ev={id:evId(),kind:'',text:kind==='start'?'Game on. '+r.players[order[0]].name+' starts.':'Rematch: a new list.'};return r}
    if(kind==='lobby'){if(r.host!==ME)return;r.status='lobby';r.order=null;r.list=null;r.found=null;r.wrong=null;r.lives=null;r.deadline=0;return r}
  })}catch(e){console.error(e);toast('That did not go through. Check the connection.','bad')}}
async function tryTimeout(turn,deadline){
  if(!roomRef||tryTimeout.busy===deadline)return;tryTimeout.busy=deadline;
  try{await roomRef.transaction(r=>{
    if(!r)return r;
    if(r.status!=='playing'||(r.turn||0)!==turn||r.deadline!==deadline||now()<deadline)return;
    r.passes=(r.passes||0)+1;r.ev={id:evId(),kind:'bad',text:"Time's up for "+((r.players[r.order[turn]]||{}).name||'someone')+'.'};advance(r);return r})}catch(e){}}

    <p class="hint">2 to ${MAXP} players, each on their own phone. The host creates a room and shares its link or code.</p>
    <div class="field"><label class="label" for="fname">Your name in the room</label><input id="fname" maxlength="16" autocomplete="nickname" placeholder="Your name" value="${esc(setup.fname||(Geomingo.traveller()==='Guest'?'':Geomingo.traveller()))}"></div>
    <div class="field"><span class="label">Time per turn</span>${seg('timer',TIMERS.map(t=>[t,t?t+' s':'Off']),setup.timer)}</div>
    <div class="field">${FB_OK()?'':'<p class="hint">Online play needs a connection: reload the page when you are online.</p>'}<button class="primary" id="create" ${FB_OK()?'':'disabled style="opacity:.5"'}>Create room</button></div>
    <div class="field"><label class="label" for="jcode">Join a friend's room</label><div class="joinrow"><input class="code-in" id="jcode" placeholder="ABCD" maxlength="4" value="${esc(setup.join||'')}" autocomplete="off"><button class="ghost" id="join" ${FB_OK()?'':'disabled'}>Join</button></div></div>
  </section>
  <section class="panel qrules"><span class="label">Quick rules</span><p class="hint">Everyone plays the same ranking and takes turns naming one country. A country in the top 10 scores a point for you; one outside costs you one of your ${LIVES} lives. Most countries found wins.</p></section>`}
function lobbyHTML(){const r=room,order=lobbyOrder(r),link=pageLink('?room='+roomCode);
  return header('Top <span>10</span>','room '+roomCode)+`<section class="panel namecard"><span class="label">Room code</span><p class="roomcode">${roomCode}</p>
    <p class="hint">Friends open Top 10, choose <b>With friends</b>, then type this code under Join. Or send them the link:</p>
    <pre class="sharebox" id="linkbox">${esc(link)}</pre><button class="ghost" id="copylink">Copy link</button>
    <span class="label">Players ${order.length}/${MAXP}</span>
    <div class="players">${order.map((pid,i)=>{const p=r.players[pid];return `<div class="lp ${p.on===false?'off':''}"><span class="pin" style="${pinStyle(i)}"></span>${esc(p.name)}<span class="tag">${[pid===r.host?'host':'',pid===ME?'you':'',p.on===false?'offline':''].filter(Boolean).join(' · ')}</span></div>`}).join('')}</div>
    <p class="hint">${r.cfg.timer?r.cfg.timer+' s per turn':'No turn timer'} · a random list for each game</p>
    ${r.host===ME?`<button class="primary" id="ostart" ${order.length<2?'disabled style="opacity:.5"':''}>${order.length<2?'Waiting for players…':'Start game'}</button>`:'<p class="hint">Waiting for the host to start the game.</p>'}
    <button class="ghost" id="leave">Leave room</button></section>`}
function onlineHTML(){const cur=S.players[S.turn]||{};
  let h=header('Top <span>10</span>','room '+roomCode);
  if(!S.over){const cell=Geomingo.tk;
    const say=moodHTML(tKey(),'pass',S.turn===S.me?'Your turn.':'Waiting for '+cur.name+'…',S.found.length+' of 10 found. Name a country in the top 10.');
    const stub=S.players.map((p,i)=>`<div class="tk-c pl${i===S.turn?' on':''}${!p.on||!p.lives?' off':''}"><i><span class="pin" style="${pinStyle(i)}"></span>${esc(p.name)}</i><b>${p.score} <small aria-label="${p.lives} lives left" style="color:var(--coral);font-size:13px">${'♥'.repeat(p.lives)}</small></b></div>`).join('')
      +(S.timer?cell('Time',`<span id="tleft">${Math.max(0,Math.ceil((S.deadline-now())/1000))}s</span>`):'');
    h+=Geomingo.ticket(say,stub,{timer:S.timer})}
  else h+=`<div class="scores">${S.players.map((p,i)=>`<span class="chip ${!p.on||!p.lives?'off':''}"><span class="pin" style="${pinStyle(i)}"></span>${esc(p.name)} <b>${p.score}</b></span>`).join('')}</div>`;
  if(S.over){const rk=S.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score||a.miss-b.miss),best=rk[0],tie=rk.length>1&&rk[1].score===best.score&&rk[1].miss===best.miss;
    h+=`<section class="panel"><span class="label">Room ${roomCode}</span><p class="big">${tie?"It's a tie":esc(best.name)+' wins'}</p>
      <p class="hint">${S.won?'All ten found.':`${S.found.length} of 10 found. The full list is below.`} ${rk.map(p=>`${esc(p.name)} ${p.score}`).join(' · ')}</p>
      ${S.host?`<div class="row-btns"><button class="primary" id="orematch" style="flex:1">Rematch</button><button class="ghost" id="olobby" style="flex:1">Back to room</button></div>`:'<p class="hint">Waiting for the host to start a rematch.</p>'}</section>`}
  else if(S.me>=0&&!S.lives)h+=`<p class="hint">You are out of lives: watch the others finish.</p>`;
  if(!S.over&&!cur.on&&S.turn!==S.me)h+=`<button class="ghost" id="oskip">${esc(cur.name)} is offline: skip their turn</button>`;
  h+=`<section class="panel">${askHTML()}</section>${listHTML()}`;
  h+=`<div class="row-btns">${S.host&&!S.over?'<button class="ghost" id="oend" style="flex:1">End game</button>':''}<button class="ghost" id="leave" style="flex:1">Leave room</button></div>`;
  return h}
function render(){
  // today's list is played on the home screen too: the summary follows the game, whatever the screen
  if(S&&S.mode!=='online')watchResult(tKey(),S.over);
  if(roomCode&&room){app.innerHTML=S&&S.mode==='online'?onlineHTML():lobbyHTML();bind();return}
  if(view==='home'){app.innerHTML=homeHTML();bind();return}
  if(view==='friends'){app.innerHTML=friendsHTML();bind();return}
  if(view==='solo'){app.innerHTML=soloHTML();bind();return}
  if(view==='archive'){app.innerHTML=archiveView();bind();return}
  const l=listById(S&&S.list);
  if(!S||!l){app.innerHTML=header('Top <span>10</span>','')+`<section class="panel"><p class="hint">Could not load the list. Try again later.</p></section>`;bind();return}
  let h=header('Top <span>10</span>',S.mode==='daily'?'Daily #'+S.num:S.mode==='archive'?'Archive #'+S.num:'Solo');
  h+=`<div class="backline"><button class="linkbtn" id="${S.mode==='archive'?'archback':S.mode==='free'?'soloback':'home'}">← Back</button><span class="ht">${S.mode==='daily'?"Today's list":S.mode==='archive'?'List #'+S.num:'Solo'}</span></div>`;
  if(S.over)h+=resultHTML();
  else{const cell=Geomingo.tk;
    // the ticket, as in every game: Mingo on top, then who is travelling, countries found and lives left
    h+=Geomingo.ticket(moodHTML(tKey(),'pass','10 stamps to win.','In any order. A country outside the top 10 costs a life.'),
      cell('Traveller',esc(Geomingo.traveller()),'tk-name')+cell('Found',S.found.length+'/10','tk-pts')+cell('Lives',livesHTML(S.lives,LIVES),'tk-gs'))}
  h+=`<section class="panel">${askHTML(true)}</section>${listHTML()}`;
  if(!S.over)h+=quickRules(' Full rules in <b>How to play</b>.');
  app.innerHTML=h;bind();
}
// Mingo's verdict, for the result panel
function verdict(){const f=S.found.length;
  return S.won?(S.lives===LIVES?{pose:'happy',t:'Full page. Perfect ten.',s:'Not a single life lost.'}:{pose:'happy',t:'Visited. All ten.',s:livesTxt()})
    :f>=6?{pose:'think',t:'So close. '+f+' of 10.',s:'No lives left. The full list is below.'}:{pose:'sad',t:'Rough crossing, this one.',s:f+' of 10 found. The full list is below.'}}
function resultHTML(){const v=verdict();
  return `<section class="panel">${Geomingo.hello(v.pose,v.t,v.s,{key:'res'})}<span class="label">${S.mode==='daily'?'Top 10 #'+S.num:S.mode==='archive'?'Archive · Top 10 #'+S.num:'Solo list'}</span><p class="big">${S.found.length} of 10</p>
    <p class="hint">${S.won?`You named the whole list with ${S.lives} li${S.lives===1?'fe':'ves'} left.`:S.lives?'The full list is below.':'No lives left. The full list is below.'} ${S.mode==='daily'?`Next list in ${nextIn()}.`:S.mode==='archive'?"Archive games don't count for the ranking or your streak.":''}</p>
    <pre class="sharebox" id="share">${esc(shareText())}</pre>
    ${S.mode==='daily'?`<div class="row-btns"><button class="ghost" id="copy">Share</button>${nextGameBtn('top10')}</div>
    <button class="ghost" id="playsolo">Play Solo</button>${allPlayedHTML('top10')}`
    :S.mode==='archive'?`<div class="row-btns"><button class="ghost" id="copy" style="flex:1">Share</button><button class="primary" id="archback" style="flex:1">Back to archive</button></div>`
    :`<div class="row-btns"><button class="ghost" id="copy" style="flex:1">Share</button><button class="ghost" id="again" style="flex:1">New list</button></div>`}
    ${S.mode==='daily'?`<span class="label">Your daily lists</span>${statsHTML()}`:''}</section>${S.mode==='daily'?rankingHTML():''}`}
// today's ranking (signed-in players, first try of the day): countries found, then fewer misses, then who finished first
const rankingHTML=()=>Geomingo.account.rankingHTML('top10',{what:'list',score:r=>[r.s+'/10',r.m?r.m+' miss'+(r.m===1?'':'es'):'no misses']});
// signed in or out, today's result arrived from another device, the ranking moved: show it (not while typing)
Geomingo.account.onChange((why,typing)=>{if(why==='adopt'&&S&&S.mode==='daily'){const d=dailySaved();if(d){S=d;liveKey=''}}
  if(!typing&&!roomCode&&(view==='home'||view==='game'&&S&&S.over))render()});
function rulesHTML(){return `<h3>The idea</h3><ul>
  <li>Each round is a ranking of countries made from real figures, for example "The 10 most populous countries" or "The 10 countries with the longest coastline".</li>
  <li>Name the ten countries in the ranking, in any order. Each one you find appears in its place, with its figure.</li>
  <li>A country that is not in the top 10 costs one of your <b>${LIVES} lives</b>, and you see where it ranks.</li>
  <li>The game ends when you find all ten or run out of lives; then the full list is shown.</li>
  <li>Some lists cover the whole world, others one continent: Europe, Asia, Africa or the Americas. In a continent list, only its countries count.</li>
  <li>If countries are tied for 10th place, any of them counts: name ten to win.</li>
  <li>Only independent countries count, never territories. The figures are the same ones Countries uses; "Where the numbers come from" names the source of each list.</li></ul>
  <h3>Modes</h3><ul>
  <li><b>Today's list</b>: the same for everyone, new every day at midnight CET. One try, saved on this device. Missed one? Play it in <b>Menu → Archive</b>.</li>
  <li><b>Solo</b>: unlimited practice lists, a different one each time until you have played them all. Share sends a link to the same list.</li>
  <li><b>With friends</b>: online, 2 to ${MAXP} players, each on their own phone. The host creates a room and shares its code or link. You take turns naming a country: one in the top 10 scores a point for you, one outside costs one of your ${LIVES} lives. The round ends when the ten are found, everyone is out of lives or everyone passes. Most points wins.</li></ul>`}
function drawSugg(){const u=$('sugg');if(u){u.innerHTML=suggHTML();u.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>guess(b.dataset.g))}}
function bind(){
  if($('daily'))$('daily').onclick=openDaily;
  app.querySelectorAll('[data-go="free"]').forEach(b=>b.onclick=openSolo);
  if($('start'))$('start').onclick=()=>openFree(null,true);
  if($('cont'))$('cont').onclick=()=>openFree();
  if($('playsolo'))$('playsolo').onclick=openSolo;
  if($('soloback'))$('soloback').onclick=openSolo;
  if($('archback'))$('archback').onclick=openArchive;
  app.querySelectorAll('[data-arch]').forEach(b=>b.onclick=()=>playArchive(b.dataset.arch));
  app.querySelectorAll('[data-go="friends"]').forEach(b=>b.onclick=()=>{view='friends';render();window.scrollTo(0,0)});
  if($('home'))$('home').onclick=goHome;
  if($('rules'))$('rules').onclick=()=>dialog('How to play',rulesHTML());
  // give up: the list ends as it stands and the full ranking is shown
  bindGiveUp(()=>{if(!S||S.over||S.mode==='online')return;S.over=true;query='';typing=false;if(view==='home')view='game';save();render();window.scrollTo(0,0)});
  if($('src'))$('src').onclick=()=>{const l=listById(S.list);dialog(esc(l.title),`<p>${esc(l.src)}</p><p class="hint">Independent countries only. Places with no figure in the source are left out.</p>`)};
  const q=$('q');
  if(q){q.oninput=e=>{query=e.target.value;drawSugg()};
    q.onkeydown=e=>{if(e.key==='Enter'){const m=matches(query).filter(c=>!S.found.includes(c.c)&&!S.wrong.includes(c.c));if(m[0])guess(m[0].c)}};
    drawSugg();
    // on the home screen the box gets the focus only once you have started typing, so phones do not open the keyboard at once
    if(query||typing||(!TOUCH&&view!=='home'))setTimeout(()=>{q.focus();q.setSelectionRange(q.value.length,q.value.length)},0)}
  if($('copy'))$('copy').onclick=()=>share(shareMessage());
  if($('again'))$('again').onclick=()=>openFree(null,true);
  // With friends
  app.querySelectorAll('[data-seg="timer"]').forEach(b=>b.onclick=()=>{saveSetup();setup.timer=+b.dataset.v;saveSetup();render()});
  if($('fname'))$('fname').onchange=saveSetup;
  if($('jcode'))$('jcode').oninput=e=>{setup.join=e.target.value};
  if($('create'))$('create').onclick=createRoom;
  if($('join'))$('join').onclick=()=>joinRoom($('jcode').value);
  if($('jcode'))$('jcode').onkeydown=e=>{if(e.key==='Enter')joinRoom(e.target.value)};
  if($('copylink'))$('copylink').onclick=()=>{const t=pageLink('?room='+roomCode);
    if(navigator.share&&TOUCH){navigator.share({text:'Play Top 10 with me: '+t}).catch(()=>{});return}
    try{navigator.clipboard.writeText(t).then(()=>toast('Link copied.','good'),()=>toast('Copy the link above.'))}catch(e){toast('Copy the link above.')}};
  if($('leave'))$('leave').onclick=()=>{if(S&&S.mode==='online'&&!S.over&&!confirm('Leave the room? The game goes on without you.'))return;leaveRoom()};
  if($('ostart'))$('ostart').onclick=()=>onlineAct('start');
  if($('orematch'))$('orematch').onclick=()=>onlineAct('rematch');
  if($('olobby'))$('olobby').onclick=()=>onlineAct('lobby');
  if($('oend'))$('oend').onclick=()=>{if(confirm('End the game for everyone?'))onlineAct('end')};
  if($('opass'))$('opass').onclick=()=>onlineAct('pass');
  if($('oskip'))$('oskip').onclick=()=>onlineAct('skip');
}

/* ---- start: today's list on the home screen; ?l=pop-hi opens that list in Solo (a shared link), ?room=ABCD a friend's room, ?friends With friends ---- */
(()=>{const id=TESTQ.get('l'),rm=(TESTQ.get('room')||'').toUpperCase();
  if(id&&listById(id)){openFree(id);try{history.replaceState(null,'',location.pathname)}catch(e){}return}
  if(/^[A-Z]{4}$/.test(rm)){view='friends';setup.join=rm}
  else if(TESTQ.has('friends')){view='friends';try{history.replaceState(null,'',location.pathname)}catch(e){}}
  render()})();
// back in a room after a reload (the online scripts load after the page)
window.addEventListener('DOMContentLoaded',()=>{let code='';try{code=localStorage.getItem('t10-room')||''}catch(e){}
  if(view==='friends')render(); // the Create and Join buttons were drawn before Firebase loaded
  if(!code||!initFB())return;
  db.ref('rooms/'+code).once('value').then(s=>{const r=s.val();
    if(r&&r.game==='top10'&&r.players&&r.players[ME]&&!roomCode)listenRoom(code);else try{localStorage.removeItem('t10-room')}catch(e){}}).catch(()=>{})});
document.addEventListener('visibilitychange',()=>{if(document.hidden||roomCode)return;if(view==='home')render();else if(mode==='daily'&&S&&S.mode==='daily'&&S.date!==todayKey())openDaily()});
</script>
</body>
</html>
