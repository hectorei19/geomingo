<style>
/* Customs: one traveller at a time at the desk, five clues opened one by one, the answer box under them */
.play{display:flex;flex-direction:column;gap:12px;width:100%}
.desk{display:flex;gap:6px;width:100%}
.desk button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;background:var(--sheet);border:2px dashed var(--line);border-radius:10px;color:var(--ink-2);font:inherit;font-size:.7rem;cursor:default}
.desk button b{font-family:var(--mono);font-size:.95rem;color:var(--ink)}
.desk button img{height:23px;width:auto;max-width:40px;object-fit:contain;border-radius:2px;box-shadow:0 0 0 1px var(--rule)}
.desk button.right,.desk button.wrong{padding:6px 2px}
/* the traveller at the desk now: the same size, filled in flamingo */
.desk button.sel{border:2px solid var(--flamingo);background:var(--flamingo);color:var(--on-flamingo);font-weight:700;letter-spacing:.06em}
.desk button.sel b{font-size:1.1rem;color:var(--on-flamingo)}
.desk button.right{border-style:solid;border-color:var(--good);background:var(--p4-soft)}
.desk button.wrong{border-style:solid;border-color:var(--bad);background:var(--p0-soft)}
.desk button.right,.desk button.wrong{cursor:pointer}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.clue{display:flex;gap:12px;align-items:flex-start;background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.clue .ci{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sea-soft);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:.85rem}
.clue .ct{display:flex;flex-direction:column;gap:2px;min-width:0}
.clue .ct span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.clue .ct b{font-weight:600;font-size:1rem;line-height:1.3}
.clue .ct small{font-size:.85rem;color:var(--ink-2)}
.clue .fl{height:56px;width:auto;max-width:120px;object-fit:contain;border-radius:4px;box-shadow:0 0 0 1px var(--rule);margin-top:4px}
.clue.new{border-color:var(--gold)}
.clue.off{border-style:dashed;opacity:.55}
.clue.off .ci{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule)}
.worth{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--ink-2)}
.worth b{font-family:var(--mono);color:var(--gold)}
.worth .linkbtn{margin-left:auto}
.missed{display:flex;flex-direction:column;gap:2px;margin:0;border:2px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:9px 12px}
.missed b{color:var(--bad)}
.missed span{font-size:.9rem;color:var(--ink-2)}
.locked{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink-2);font-size:.92rem}
.locked .linkbtn{margin-left:auto}
/* a traveller who has just left the desk: the answer in big, then Next traveller */
.left{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px solid var(--good);border-radius:16px;padding:16px 14px;background:var(--p4-soft)}
.left.wrong{border-color:var(--bad);background:var(--bad-soft)}
.left img{height:80px;width:auto;max-width:180px;object-fit:contain;border-radius:5px;box-shadow:0 0 0 1px var(--rule)}
.left .ln{font-family:var(--display);font-weight:700;font-size:1.8rem;line-height:1.1;overflow-wrap:anywhere}
.left .lst{font-family:var(--type,var(--mono));letter-spacing:.15em;font-weight:700;color:var(--good);border:2px solid currentColor;padding:2px 10px;border-radius:4px;transform:rotate(-4deg)}
.left.wrong .lst{color:var(--bad)}
.left .ls{color:var(--ink-2);font-size:.92rem}
.left .primary{width:100%;margin-top:6px}
.reveal{display:flex;align-items:center;gap:12px;background:var(--sheet);border:2px solid var(--good);border-radius:16px;padding:10px 12px}
.reveal.wrong{border-color:var(--bad)}
.reveal .flag{width:48px;height:auto;border-radius:3px;box-shadow:0 0 0 1px var(--rule);flex:none}
.reveal .rn{display:flex;flex-direction:column;min-width:0}
.reveal .rn b{font-family:var(--display);font-weight:700;font-size:1.4rem;line-height:1.1}
.reveal .rn small{color:var(--ink-2);font-size:.9rem}
.reveal .rpts{margin-left:auto;font-family:var(--mono);font-size:.95rem;white-space:nowrap;color:var(--gold)}
.ans{display:flex;flex-direction:column;gap:6px}
.ans input{width:100%;border:1.5px solid var(--ink);border-radius:5px;padding:12px;font-size:1.1rem;background:var(--paper)}
.ans .sugg{max-height:none}
.dsq{grid-template-columns:repeat(5,1fr);width:100px}
.dsq i.mid{background:var(--p2)}
.dsq i.bad{background:var(--bad)}
.arch .dsq{width:64px}
.cpre{display:flex;gap:6px;width:100%}
.cpre i{flex:1;aspect-ratio:3/4;border-radius:8px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--mono);font-size:.8rem;color:var(--ink-2)}
</style>

<script>
/* ---- Customs: a traveller at the desk, and you work out where they come from ----
   Each traveller hands over five clues, one at a time, from vague to obvious: size, where on the map, language and
   road side, neighbours, flag. Name the country after k clues and it is worth 6 - k points (5 down to 1).
   A wrong answer opens the next clue; a wrong answer with all five open lets the traveller go (0 points).
   A traveller is {c: country code, k: clues open, tries: wrong answers, st: 'play' | 'right' | 'wrong'}. */
const CLUES=5,PER=5,MAX=CLUES*PER,FIRST='2026-11-02';
const SOV=C.filter(c=>!c.t);
const cByCode=Object.fromEntries(SOV.map(c=>[c.c,c]));
const flagSrc=c=>'../flagpie/flags/'+c+'.svg';
const contName={EU:'Europe',AS:'Asia',AF:'Africa',NA:'North or Central America',SA:'South America',OC:'Oceania'};
const worth=q=>CLUES+1-q.k;
const ptsOf=q=>q.st==='right'?worth(q):0;
// v: which clue of each group this traveller gives (picked once, so a saved game keeps its clues)
const newQ=(c,rand)=>{rand=rand||Math.random;return {c,k:1,tries:[],st:'play',v:GROUPS.map(()=>Math.floor(rand()*1e6))}};
let query='',typing=false;

/* ---- the clues: five groups, from not obvious to obvious ----
   Each group is a list of possible clues; a traveller gets one at random from each group (only the ones the
   country has data for), so the same country can come back with other clues. */
// European number format: dot for thousands, comma for decimals (4.964 km, 83,7 years)
const num=(n,d)=>Number(n).toLocaleString('de-DE',d==null?{maximumFractionDigits:3}:{minimumFractionDigits:d,maximumFractionDigits:d});
function popText(n){if(n>=1e9)return num(+(n/1e9).toFixed(2))+' billion';if(n>=1e6)return num(+(n/1e6).toFixed(n>=1e8?0:1))+' million';
  if(n>=1e4)return num(Math.round(n/1e3)*1e3);return num(Math.round(n/10)*10)}
const areaText=a=>num(a>=1e4?Math.round(a/1e3)*1e3:a>=100?Math.round(a/10)*10:a)+' km²';
const latText=l=>Math.abs(l)<1?'right on the Equator':Math.round(Math.abs(l))+'° '+(l>=0?'north':'south')+' of the Equator';
const listText=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const isIn=(k,c)=>(EXTRA[k]||DATA[k]||[]).includes(c);
// land neighbours: landNeighbours() (data/countries.js) from NB_FROM on; before that day the old count, so a clue never changes mid-day
const nbOf=c=>(todayKey()<NB_FROM?c.b:landNeighbours(c)).filter(b=>cByCode[b]);
// a language named after the country gives it away (Icelandic, Italian, German…)
const giveaway=(c,w)=>N(w).slice(0,4)===c.k.slice(0,4);
const FLAGCOL=[['flag_red','red'],['flag_white','white'],['flag_blue','blue'],['flag_green','green'],['flag_yellow','yellow'],['flag_black','black'],['flag_orange','orange']];
const FLAGSYM=[['flag_star','a star'],['flag_moon','a crescent moon'],['flag_sun','a sun'],['flag_cross','a cross'],['flag_uj','the Union Jack'],['flag_arms','a coat of arms'],['flag_animal','an animal']];
const SEAS=[['sea_med','the Mediterranean'],['sea_carib','the Caribbean Sea'],['sea_baltic','the Baltic Sea'],['sea_black','the Black Sea'],['sea_red','the Red Sea'],['sea_gulf','the Persian Gulf'],['sea_caspian','the Caspian Sea'],['sea_north','the North Sea']];
// facts for group 3: [data key, what it says]
const FACTS=[['ind_uk','Became independent from the United Kingdom'],['ind_es','Became independent from Spain'],['pol_eu','A member of the European Union'],['pol_nato','A member of NATO'],
  ['pol_cw','A member of the Commonwealth'],['pol_g20','A member of the G20'],['pol_mon','A monarchy, with a king, queen, emir or similar'],['pol_opec','A member of OPEC, the oil exporters'],
  ['pol_ussr','Was part of the Soviet Union'],['arab','A member of the Arab League'],['asean','A member of ASEAN, in Southeast Asia'],['nukes','Has nuclear weapons'],['noarmy','Has no army of its own'],
  ['nuclear','Makes electricity in nuclear power plants'],['sp_summer','Has hosted the Summer Olympics'],['sp_winter','Has hosted the Winter Olympics'],['sp_wchost','Has hosted the men\'s football World Cup'],
  ['sp_wcwin','Has won the men\'s football World Cup'],['sp_f1','Has a Formula 1 race'],['euro','Takes part in Eurovision'],['metro','Has a metro system'],['wc','Has played at the men\'s football World Cup']];
const GROUPS=[
  // 1 Curiosities
  ['Curiosity',c=>{const d=c.c,o=[],V=k=>DATA[k][d];
    if(V('life'))o.push(['Life expectancy: '+num(V('life'))+' years','How long people live on average']);
    if(V('age'))o.push(['Median age: '+num(V('age'))+' years','Half the people are younger than this']);
    if(V('forest')!=null)o.push(['Forest covers '+Math.round(V('forest'))+'% of the land','']);
    if(V('elev'))o.push(['Highest point: '+num(V('elev'))+' m above the sea','']);
    o.push(V('olymp')?['Has won '+num(V('olymp'))+' Olympic medal'+(V('olymp')===1?'':'s'),'Summer and Winter Games, all time']:['Has never won an Olympic medal','Summer and Winter Games, all time']);
    if(V('urban')!=null)o.push([Math.round(V('urban'))+'% of the people live in towns and cities','']);
    if(V('co2')!=null)o.push(['CO₂ per person: '+num(V('co2'))+' tonnes a year','']);
    if(V('cpi')!=null)o.push(['Corruption score: '+V('cpi')+' out of 100','100 is the cleanest (Transparency International)']);
    if(V('hdi'))o.push(['Human development index: '+num(V('hdi')),'From 0 to 1: health, schooling and income']);
    return o}],
  // 2 Numbers
  ['Numbers',c=>{const d=c.c,o=[],V=k=>DATA[k][d];
    o.push(['Population: '+popText(V('pop')||0)+' inhabitants','']);
    o.push(['Area: '+areaText(c.a),'']);
    if(V('gdp'))o.push(['Wealth per person: '+num(Math.round(V('gdp')/100)*100)+' US dollars a year','GDP per person']);
    if(V('coast'))o.push(['Coastline: '+num(Math.round(V('coast')))+' km','']);
    if(V('cappop')&&CAPOK(c))o.push(['The capital has '+popText(V('cappop'))+' inhabitants','']);
    if(V('landb'))o.push(['Land borders: '+num(V('landb'))+' km in all','']);
    return o}],
  // 3 History, clubs and the flag described
  ['History and clubs',c=>{const d=c.c,f=FACTS.filter(([k])=>isIn(k,d)).map(x=>x[1]),o=[];
    for(let i=0;i+1<f.length;i+=2)o.push([f[i],f[i+1]]);if(f.length%2)o.push([f[f.length-1],'']);
    const col=FLAGCOL.filter(([k])=>isIn(k,d)).map(x=>x[1]),sym=FLAGSYM.filter(([k])=>isIn(k,d)).map(x=>x[1]);
    o.push(['Its flag is '+listText(col),sym.length?'With '+listText(sym):'']);
    if(c.cu.includes('EUR'))o.push(['Pays with the euro','']);
    return o}],
  // 4 The map
  ['On the map',c=>{const d=c.c,nb=nbOf(c),o=[],ct=contName[c.r];
    o.push([ct+', '+latText(c.lat),'']);
    o.push([ct+(c.ll?', landlocked: no coast':!nb.length?', an island country':', with a coast'),nb.length?nb.length+' land neighbour'+(nb.length===1?'':'s'):'No land borders']);
    const sea=SEAS.filter(([k])=>isIn(k,d)).map(x=>x[1]);if(sea.length)o.push([ct+', on '+listText(sea),'']);
    const lg=c.lg.filter(l=>!giveaway(c,l));
    if(lg.length===c.lg.length&&lg.length)o.push([ct+'. '+(lg.length>1?'Languages: ':'Language: ')+listText(lg.slice(0,3))+(lg.length>3?' and '+(lg.length-3)+' more':''),'Drives on the '+(LEFT.has(d)?'left':'right')]);
    return o}],
  // 5 The obvious
  ['The obvious',c=>{const nb=nbOf(c).map(b=>cByCode[b].n).sort(),o=[];
    if(nb.length)o.push([nb.length>6?'Borders '+listText(nb.slice(0,6))+' and '+(nb.length-6)+' more':'Borders '+listText(nb),'']);
    if(c.cap&&!giveaway(c,c.cap))o.push(['The capital starts with '+c.cap[0].toUpperCase(),c.cap.replace(/[ \-'.]/g,'').length+' letters']);
    o.push(['','',true]);
    return o}]];
function clue(q,i){const c=cByCode[q.c],[lab,f]=GROUPS[i],o=f(c),v=(q.v||[])[i];
  // old saves without v: always the same pick for the country
  const x=o[(v!=null?v:seedOf(q.c+i))%o.length];
  return x[2]?{ico:i+1,lab:'Flag',main:'',sub:'',flag:q.c}:{ico:i+1,lab,main:x[0],sub:x[1]}}
function cluesHTML(q){const done=q.st!=='play';
  return `<ol class="clues">${Array.from({length:CLUES},(_,i)=>{
    if(i>=q.k&&!done)return '';
    const x=clue(q,i);
    return `<li class="clue${!done&&i===q.k-1&&i>0?' new':''}${i>=q.k?' off':''}"><span class="ci">${x.ico}</span><span class="ct"><span>${x.lab}</span>${x.main?`<b>${esc(x.main)}</b>`:''}${x.sub?`<small>${esc(x.sub)}</small>`:''}${x.flag?`<img class="fl" src="${flagSrc(x.flag)}" alt="A flag">`:''}</span></li>`}).join('')}</ol>`}

/* answering: the same box as in the other games */
function matches(t){const k=N(t);if(!k)return [];
  const ex=[],st=[],ins=[];for(const c of SOV){if(c.k===k||c.ak.includes(k))ex.push(c);else if(c.k.startsWith(k)||c.ak.some(a=>a.startsWith(k)))st.push(c);else if(k.length>=3&&(c.k.includes(k)||c.ak.some(a=>a.includes(k))))ins.push(c)}
  return [...ex,...st,...ins].slice(0,6)}
function suggHTML(q){if(!query)return SHEETS?'<li class="hint" style="padding:8px 2px">Start typing, then tap the country.</li>':'';const res=matches(query);
  if(!res.length)return `<li class="hint" style="padding:8px 2px">No country matches “${esc(query)}”.</li>`;
  return res.map(c=>{const t=q.tries.includes(c.c);return `<li><button data-g="${c.c}" ${t?'disabled':''}>${esc(c.n)}${t?'<span class="tag">not it</span>':''}</button></li>`}).join('')}
function answerBoxHTML(q){
  if(SHEETS)return askBtnHTML();
  return `<div class="ans"><input id="q" placeholder="Type a country…" autocomplete="off" autocapitalize="words" spellcheck="false" value="${esc(query)}" aria-label="Type a country"><ul class="sugg" id="sugg">${suggHTML(q)}</ul></div>`}
function bindAnswer(q,onPick){
  if(SHEETS){bindAsk($('askbtn')?{key:q.c+':'+q.k+':'+view,back:'Back to the clues',
    head:`<span>Where is this traveller from? <i>${worth(q)} point${worth(q)===1?'':'s'}</i></span>`,
    sugg:t=>{query=t;return suggHTML(q)},first:t=>{const m=matches(t).filter(c=>!q.tries.includes(c.c));return m[0]&&m[0].c},pick:onPick}:null);return}
  const box=$('q');if(!box)return;
  const draw=()=>{const u=$('sugg');if(u){u.innerHTML=suggHTML(q);u.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>onPick(b.dataset.g))}};
  box.oninput=e=>{query=e.target.value;draw()};
  box.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const m=matches(query).filter(c=>!q.tries.includes(c.c));if(m[0])onPick(m[0].c)}};
  draw();if(query||typing)setTimeout(()=>{box.focus();box.setSelectionRange(box.value.length,box.value.length)},0)}
// one answer: 'right', 'wrong' (the next clue opens) or 'out' (all five were open: the traveller goes)
function answer(q,code){if(code===q.c){q.st='right';return 'right'}
  q.tries.push(code);if(q.k>=CLUES){q.st='wrong';return 'out'}q.k++;return 'wrong'}
// ask for the next clue without answering; with all five open, "I don't know" lets the traveller go
function nextClue(q){if(q.st!=='play')return;if(q.k<CLUES)q.k++;else q.st='wrong'}
const tk=Geomingo.tk;
// what happened is shown on the card itself (the red box, or the traveller who just left), not in the ticket
function feedback(q,res){if(res==='right')Geomingo.stamp('customs',cByCode[q.c].n,'+'+worth(q),q.c)}
function revealHTML(q){const c=cByCode[q.c],ok=q.st==='right';
  return `<div class="reveal ${ok?'':'wrong'}"><img class="flag" src="${flagSrc(q.c)}" alt=""><span class="rn"><b>${esc(c.n)}</b><small>${ok?'Right with '+q.k+' clue'+(q.k===1?'':'s'):'The answer'} · capital ${esc(c.cap)}</small></span><span class="rpts">${ok?'+'+worth(q):'0'}</span></div>`}
// the five at the desk: the ones gone show their flag and points, the one at the desk now is filled in
const deskHTML=G=>`<div class="desk" role="group" aria-label="The five travellers">${G.qs.map((q,i)=>{const now=i===G.sel&&!G.over&&G.left==null,cls=[now?'sel':'',q.st==='right'?'right':q.st==='wrong'?'wrong':''].join(' ');
  return `<button data-tv="${i}" class="${cls}" aria-label="Traveller ${i+1}${q.st==='play'?'':': '+esc(cByCode[q.c].n)}"${now?' aria-current="step"':''}>${q.st!=='play'?`<img src="${flagSrc(q.c)}" alt=""><b>${q.st==='right'?'+'+worth(q):'0'}</b>`:now?`NOW<b>${i+1}</b>`:`#${i+1}<b>–</b>`}</button>`}).join('')}</div>`;
const pointsOf=G=>G.qs.reduce((n,q)=>n+ptsOf(q),0);
const rightOf=G=>G.qs.filter(q=>q.st==='right').length;
const wrongOf=G=>G.qs.reduce((n,q)=>n+q.tries.length,0);
// the game's play area: the five at the desk, the clues of the one at the desk, the answer box
// the traveller who just left the desk, in big, until you tap Next traveller (or See your result after the last one)
function leftHTML(G,i){const q=G.qs[i],c=cByCode[q.c],ok=q.st==='right';
  return `<div class="left${ok?'':' wrong'}"><span class="label">Traveller ${i+1} of ${PER}</span><img src="${flagSrc(q.c)}" alt=""><b class="ln">${esc(c.n)}</b><span class="lst">${ok?'ADMITTED':'DENIED'}</span>
    <span class="ls">${ok?'+'+worth(q)+' point'+(worth(q)===1?'':'s')+' · right with '+q.k+' clue'+(q.k===1?'':'s'):'0 points'+(q.tries.length?' · you said '+q.tries.map(x=>esc(cByCode[x].n)).join(', '):'')}</span>
    <span class="ls">Capital ${esc(c.cap)}</span>
    <button class="primary" id="nexttv">${G.over?'See your result':'Next traveller →'}</button></div>`}
// the game's play area: the five at the desk, then one card: the open clues, what's still locked, a wrong answer, the answer box
function playHTML(G){let h=deskHTML(G);
  if(G.left!=null)return `<div class="play">${h}${leftHTML(G,G.left)}</div>`;
  if(G.over)return `<div class="play">${h}</div>`;
  const q=G.qs[G.sel],more=CLUES-q.k;
  h+=`<span class="label">Traveller ${G.sel+1} of ${PER} · worth ${worth(q)} point${worth(q)===1?'':'s'}</span>`+cluesHTML(q)+
    `<div class="locked">${more?'🔒 '+more+' more clue'+(more===1?'':'s')+' locked':'All five clues are open'}<button class="linkbtn" id="nextclue">${more?'Next clue':'I don\'t know'}</button></div>`+
    (q.tries.length?`<p class="missed"><b>✗ Not ${q.tries.map(c=>esc(cByCode[c].n)).join(', not ')}.</b><span>Clue ${q.k} is open. Now worth ${worth(q)}.</span></p>`:'')+answerBoxHTML(q)+giveUpHTML();
  return `<div class="play">${h}</div>`}
// after a traveller leaves the desk: show who it was, then the next one still waiting, or the game is over
function advance(G){if(G.qs[G.sel].st==='play')return;G.left=G.sel;const n=G.qs.findIndex(q=>q.st==='play');if(n<0)G.over=true;else G.sel=n}
// Next traveller: back to the top of the card
function nextTraveller(G,save){const end=G.over;G.left=null;if(save)save();render();
  if(end){window.scrollTo(0,0);return}const d=document.querySelector('.desk');if(d)window.scrollTo(0,Math.max(0,d.getBoundingClientRect().top+window.scrollY-90))}
// a traveller just left: bring the card into view (the answer box was lower down)
function showLeft(){const d=document.querySelector('.desk');if(d&&d.getBoundingClientRect().top<0)window.scrollTo(0,Math.max(0,d.getBoundingClientRect().top+window.scrollY-90))}
const sq=q=>q.st==='right'?(q.k===1?'🟩':q.k<=3?'🟨':'🟧'):'🟥';
const sqClass=q=>q.st==='right'?(q.k<=2?'on':'mid'):q.st==='wrong'?'bad':'';
const squaresHTML=G=>`<span class="dsq" aria-hidden="true">${G.qs.map(q=>`<i class="${sqClass(q)}"></i>`).join('')}</span>`;

/* ---- Daily: five travellers, the same for everyone, new at midnight CET ----
   Three well-known countries (10 million people or more) and two of the rest, each dealt from its own deck shuffled
   once per cycle, so no country comes back until its deck is used up. Saved as cu-daily {date, over, S: the game}. */
function dailyQs(key){const n=dayNum(key,FIRST)-1,deal=(pool,per,tag)=>{const codes=pool.map(c=>c.c).sort(),days=Math.floor(codes.length/per);
    const cyc=Math.floor(n/days),i=((n%days)+days)%days;return shuffle(codes,rngFrom(seedOf('customs-'+tag+'-'+cyc))).slice(i*per,(i+1)*per)};
  const big=SOV.filter(c=>(DATA.pop[c.c]||0)>=1e7),rest=SOV.filter(c=>(DATA.pop[c.c]||0)<1e7);
  const a=deal(big,3,'big'),b=deal(rest,2,'rest');
  return shuffle([a[0],a[1],b[0],a[2],b[1]],rngFrom(seedOf('customs-order-'+key))).map(c=>newQ(c,rngFrom(seedOf('customs-clues-'+key+'-'+c))))}
let D=null;
const dailySaved=()=>{const d=load('cu-daily',null);return d&&d.date===todayKey()?d:null};
function dailyGame(){const d=dailySaved();if(d&&d.S){if(d.S.over)d.S.left=null;return d.S}
  return {mode:'daily',date:todayKey(),num:dayNum(todayKey(),FIRST),qs:dailyQs(todayKey()),sel:0,over:false}}
function dailySave(){if(!D)return;
  if(D.mode==='archive'){const a=load('cu-arch',{});a[D.date]=D;store('cu-arch',a);if(D.over)logHist(D);return}
  store('cu-daily',{date:D.date,over:D.over,S:D});
  if(D.over&&logHist(D)&&!TESTDAY){Geomingo.clock.stop('customs',D.date,pointsOf(D)/MAX);Geomingo.account.done('customs')}}
// a finished daily (on its day) goes into the history once: {p points, r travellers named, m wrong answers}
function logHist(G){if(G.mode!=='daily')return false;const h=load('cu-hist',{});if(h[G.date])return false;
  h[G.date]={p:pointsOf(G),r:rightOf(G),m:wrongOf(G)};store('cu-hist',h);return true}
function dailyPick(code){const q=D.qs[D.sel];if(!q||q.st!=='play'||D.over)return;
  const res=answer(q,code);query='';typing=res==='wrong';
  feedback(q,res);advance(D);dailySave();render();if(res!=='wrong')showLeft()}
function dailyNextClue(){const q=D.qs[D.sel];if(!q||q.st!=='play'||D.over)return;nextClue(q);
  advance(D);dailySave();render();if(q.st!=='play')showLeft()}
function dailyShareText(G){return `${Geomingo.share('Customs')} #${G.num}${G.mode==='archive'?' (archive)':''} — ${pointsOf(G)}/${MAX}\n${G.qs.map(sq).join('')}`}
const dailyShare=G=>dailyShareText(G)+"\n\nPlay today's Customs: "+pageLink();
function verdict(G){const p=pointsOf(G),r=rightOf(G);
  return r===PER&&p>=20?{pose:'happy',t:'Waved through. '+p+' points.',s:'All five named.'}:r===PER?{pose:'happy',t:'All five stamped.',s:p+' of '+MAX+' points.'}
    :r>=3?{pose:'happy',t:r+' of 5 stamped.',s:p+' points. Tap a traveller to see who it was.'}:r>=1?{pose:'think',t:'A long queue today.',s:r+' of 5, '+p+' points.'}
    :{pose:'sad',t:'Nobody got through today.',s:'Solo helps.'}}
// the result, on top of the page, as in every game
function resultHTML(G){const p=pointsOf(G),v=verdict(G);
  if(G.mode==='archive')return `<section class="panel">${Geomingo.hello(v.pose,v.t,v.s,{key:'res'})}<span class="label">Archive · Customs #${G.num}</span><p class="big">${p} points</p>
    <p class="hint">${rightOf(G)} of 5 named. Archive games don't count for the ranking or your streak.</p>
    <pre class="sharebox" id="share">${esc(dailyShareText(G))}</pre>
    ${SHARE_BTN}<div class="row-btns sharerow"><button class="primary" id="archback" style="flex:1">Back to archive</button></div></section>`;
  return `${Geomingo.doneTicket('customs',G.num,p+' points','next in '+nextIn(),summaryHTML(G))}<pre class="sharebox" id="share" hidden>${esc(dailyShareText(G))}</pre>
    <div class="gm-done-btns">${nextGameBtn('customs')}${SHARE_BTN.replace('Share result','Share')}</div>`}
// the summary under a finished game: who each traveller was
const summaryHTML=G=>`<section class="panel"><span class="label">The travellers</span>${G.qs.map(revealHTML).join('')}</section>`;
// today's ranking (signed-in players, first try of the day): points, then fewer wrong answers, then who finished first
const rankingHTML=()=>Geomingo.account.rankingHTML('customs',{what:'game',score:r=>[r.s+' pts',r.m+' wrong']});
Geomingo.account.onChange((why,typing)=>{if(why==='adopt'&&D&&D.mode==='daily'&&D.date===todayKey()){D=dailyGame();liveKey=''}
  if(!typing&&(view==='home'||view==='daily'&&D&&D.over))render()});
function openDaily(){D=dailyGame();query='';view='daily';render();window.scrollTo(0,0)}
function ticketHTML(G,mode){const lf=G.left!=null,i=lf?G.left:G.sel,q=G.qs[i];
  const m=lf?(q.st==='right'?['happy','Stamped.','Tap Next traveller when you are ready.']:['sad','Not this time.','Tap Next traveller when you are ready.'])
    :[G.qs.some(x=>x.st!=='play')||q.k>1?'think':'pass','A traveller at the desk.','Read the clues and name the country. Every new clue lowers the points.'];
  return Geomingo.ticket(Geomingo.hello(m[0],m[1],m[2]),
    tk('Traveller',esc(mode==='online'?RACE.me():Geomingo.traveller()),'tk-name')+tk('Desk',(i+1)+'/'+PER)+(mode==='daily'?tk('km',Geomingo.clPts(G.qs.filter(x=>x.st==='right').length,pointsOf(G),PER),'tk-pts'):tk('Points',pointsOf(G),'tk-pts'))+tk('Worth',lf?(q.st==='right'?'+'+worth(q):'0'):'+'+worth(q),'tk-gs'),{mode,num:G.num})}
function dailyHTML(){const arch=D.mode==='archive';let h=header('Customs',(arch?'Archive #':'Daily #')+D.num);
  h+=`<div class="backline"><button class="linkbtn" id="${arch?'archback':'home'}">← Back</button><span class="ht">${arch?'Archive #'+D.num:"Today's travellers"}</span></div>`;
  if(D.over&&D.left==null)return h+resultHTML(D)+(D.mode==='archive'?summaryHTML(D):rankingHTML());
  return h+ticketHTML(D,arch?'archive':'daily')+`<section class="panel">${playHTML(D)}</section>`+quickRules()}
const cuAverage=()=>{const h=load('cu-hist',{}),v=Object.values(h);return v.length?EU(v.reduce((a,e)=>a+(+e.p||0),0)/v.length,1):'–'};

/* ---- the archive: past days, one try each on this device ---- */
const archDay=k=>{const e=load('cu-hist',{})[k];return e?e.p+' pts':null};
function openArchive(){view='archive';query='';typing=false;render();window.scrollTo(0,0)}
function playArchive(k){if(archDay(k)){toast('You played this day already.');return}
  const a=load('cu-arch',{});D=a[k]||{mode:'archive',date:k,num:dayNum(k,FIRST),qs:dailyQs(k),sel:0,over:false};
  query='';typing=false;view='daily';dailySave();render();window.scrollTo(0,0)}
const archiveView=()=>header('Customs','Archive')+archiveHTML({first:FIRST,label:'Day',num:k=>dayNum(k,FIRST),
  played:archDay,saved:k=>load('cu-arch',{})[k]||null,done:g=>[pointsOf(g)+' pts',squaresHTML(g)]});

/* ---- Solo: five random travellers from anywhere, as many games as you like (cu-solo keeps the numbers) ---- */
let T=null;
function openSolo(){view='solo';query='';typing=false;render();window.scrollTo(0,0)}
function soloHTML(){return header('Customs','Solo')+`<section class="panel">
  <div class="backline"><button class="linkbtn" id="home">← Back</button><span class="ht">Solo</span></div>
  <p class="hint">Five travellers, a new set every game. Up to ${MAX} points.</p>
  <div class="field"><span class="label">Difficulty</span>${seg('diff',[['easy','Easy'],['hard','Hard']],soloDiff())}<p class="hint">${soloDiff()==='easy'?'Well-known countries, with 10 million people or more':'Any of the 197 countries'}.</p></div>
  <button class="primary" id="start">Start game</button></section>${quickRules()}`}
const soloDiff=()=>load('cu-diff','easy')==='hard'?'hard':'easy';
const seg=(name,opts,val)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-seg="${name}" data-v="${v}" aria-pressed="${v===val}">${l}</button>`).join('')}</div>`;
function openTrain(){const pool=soloDiff()==='easy'?SOV.filter(c=>(DATA.pop[c.c]||0)>=1e7):SOV,codes=shuffle(pool.map(c=>c.c),Math.random).slice(0,PER);
  T={mode:'solo',qs:codes.map(c=>newQ(c)),sel:0,over:false};mood=null;view='train';query='';typing=false;render();window.scrollTo(0,0)}
function trainEnd(){if(view==='room'||T.logged)return;T.logged=1;logSolo('cu-solo',{p:pointsOf(T),best:pointsOf(T),r:rightOf(T)})}
function trainPick(code){const q=T.qs[T.sel];if(!q||q.st!=='play'||T.over)return;
  const res=answer(q,code);query='';typing=res==='wrong';feedback(q,res);advance(T);if(T.over)trainEnd();render();if(res!=='wrong')showLeft()}
function trainNextClue(){const q=T.qs[T.sel];if(!q||q.st!=='play'||T.over)return;nextClue(q);
  advance(T);if(T.over)trainEnd();render();if(q.st!=='play')showLeft()}
function trainHTML(){let h=header('Customs','Solo')+`<div class="backline"><button class="linkbtn" id="soloback">← Back</button><span class="ht">Solo</span></div>`;
  if(T.over&&T.left==null){const p=pointsOf(T),s=load('cu-solo',null)||{};
    return h+`<section class="panel">${Geomingo.hello(p>=15?'happy':'think',p+' points.',rightOf(T)+' of 5 named. Your best Solo game: '+(s.best||p)+'.',{key:'res'})}<span class="label">Solo</span><p class="big">${p} points</p>
      <button class="primary" id="tagain">New game</button></section>`+summaryHTML(T)}
  return h+ticketHTML(T,'practice')+`<section class="panel">${playHTML(T)}</section>`+quickRules()}

/* ---- stats, rules, credits ---- */
function myStatsHTML(){const h=load('cu-hist',{}),so=load('cu-solo',null)||{n:0};
  return statsPageHTML({game:'Customs',hist:h,unit:'day',avg:cuAverage(),lbs:d=>[{path:'lb/customs',dates:d}],num:k=>'Customs #'+dayNum(k,FIRST),
    solo:{n:so.n,unit:'game',medal:so.best||0,stats:[[so.best||0,'best'],[so.n?EU(so.p/so.n,1):0,'average'],[so.r||0,'named']]},
    friends:(fr=>Object.assign(fr,{third:[fr.best||0,'best']}))(friendsOf('cu-friends'))})}
const quickRules=()=>`<section class="panel qrules"><span class="label">Quick rules</span><p class="hint">Five travellers, five clues each, from not obvious to obvious. Name the country with 1 clue for 5 points, with 2 for 4, down to 1 point with all five. A wrong answer opens the next clue. Full rules in <button type="button" class="qhelp">How to play</button>.</p></section>`;
function rulesHTML(){return `<h3>The idea</h3><ul>
  <li>Five travellers come to the customs desk, one at a time. Work out which country each one comes from.</li>
  <li>Only the 197 independent countries, never territories.</li></ul>
  <h3>The clues</h3><ul>
  <li>Each traveller has five clues, from not obvious to obvious, one from each group:</li>
  <li><b>1 Curiosity</b>: life expectancy, median age, forest, highest point, Olympic medals, city life, CO₂, corruption or development score.</li>
  <li><b>2 Numbers</b>: population, area, wealth per person, coastline, the capital's size or the length of its borders.</li>
  <li><b>3 History and clubs</b>: independence, the EU, NATO, the Commonwealth, the Arab League, World Cups and Olympics hosted, nuclear power… or its flag described in words.</li>
  <li><b>4 On the map</b>: continent with how far from the Equator, the coast, its seas, or its languages and driving side.</li>
  <li><b>5 The obvious</b>: its neighbours, the capital's first letter or the flag.</li>
  <li>Which clue of each group you get is random, so a country can come back with other clues.</li>
  <li>You start with clue 1. Tap <b>Next clue</b> to open another one.</li></ul>
  <h3>Points</h3><ul>
  <li>Name the country with 1 clue open: <b>5 points</b>. With 2: 4. With 3: 3. With 4: 2. With all 5: 1.</li>
  <li>A wrong answer opens the next clue, so it costs a point. A wrong answer with all five clues open, or <b>I don't know</b>, lets the traveller go with 0.</li>
  <li>Best game: ${MAX} points. <b>Give up</b> ends the game as it stands.</li></ul>
  <h3>How to answer</h3><ul>
  <li>Tap <b>Type a country…</b>, start typing and tap the country in the list.</li>
  <li>Names are in English. Accents, capitals and spaces don't matter. Each country has one name only, the one shown in the list as you type (United Kingdom, not UK).</li></ul>
  <h3>Modes</h3><ul>
  <li><b>Today's travellers</b>: five countries, the same for everyone, new every day at midnight CET. One try. Missed a day? Play it in <b>Menu → Archive</b>.</li>
  <li><b>Solo</b>: five random travellers, as many games as you like. <b>Easy</b>: well-known countries (10 million people or more). <b>Hard</b>: any country.</li>
  <li><b>With friends</b>: online, 2 to 6 players, each on their own phone. Everyone gets the same five travellers (well-known countries) at the same time and plays at their own pace. No lives. Most points win, then the fastest.</li></ul>`}
function creditsHTML(){return DATA_CREDITS}

/* ---- home: today's travellers on top, then Solo and With friends, as in the other games ---- */
let view='home';
// ?solo (from Practice on the Geomingo home page) opens the Solo screen
try{if(new URLSearchParams(location.search).has('solo')){view='solo';history.replaceState(null,'',location.pathname)}}catch(e){}
// Back from today's game, Solo or With friends goes to the Geomingo home page (in a room: leave it first)
const toHub=()=>{if(typeof roomCode!=='undefined'&&roomCode){goHome();return}location.href='../'};
const dateLabel=k=>new Date(k+'T12:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
function homeHTML(){const key=todayKey();
  if(!D||D.mode!=='daily'||D.date!==key)D=dailyGame();
  const h=load('cu-hist',{});let daily;
  if(D.over)daily=`<button class="hcard" id="daily"><span class="hm">Customs #${D.num} · done</span><span class="dsum">${squaresHTML(D)}<span class="dtxt"><span class="ht">${pointsOf(D)} points</span><span class="hs">${rightOf(D)} of 5 named</span></span>${dstatsHTML(streakOf(h),Object.keys(h).length,cuAverage())}</span><span class="hs">Tap to see the travellers and share your result.</span><span class="hm">Next travellers in ${nextIn()}</span></button>`;
  else{const started=D.qs.some(q=>q.st!=='play'||q.k>1||q.tries.length);
    daily=`<button class="hcard ac" id="daily"><span class="hm">#${D.num} · ${dateLabel(key)}</span><span class="ht">Today's travellers</span><span class="hs">${started?'You started: '+pointsOf(D)+' points so far. Tap to carry on.':'Five countries, the same for everyone, one try. Tap to open the desk.'}</span>
      <span class="cpre" aria-hidden="true">${D.qs.map((q,i)=>`<i>${q.st==='right'?'+'+worth(q):q.st==='wrong'?'0':'#'+(i+1)}</i>`).join('')}</span></button>`}
  const st=Geomingo.streak(),p=D.over?pointsOf(D):0;
  const hello=D.over?Geomingo.hello(p?'happy':'sad',p?'Stamped for today.'+(st>1?' '+st+'-day streak.':''):'Rough crossing today.',"Today's travellers are done. Next ones in "+nextIn()+'.')
    :Geomingo.hello('pass','GeoPass ready.','Five travellers at the desk. Every one you name is a stamp.');
  return header('Customs','')+`<section class="home">${hello}${Geomingo.account.userHTML()}${daily}${D.over?rankingHTML():''}</section>${quickRules()}`}
function goHome(){view='home';toastMsg=null;drawToast();query='';typing=false;render();window.scrollTo(0,0)}
// opening the game goes straight into today's game (or today's result when it is played)
/* ---- With friends: online rooms (../shared/race.js), everyone plays the same set at the same time ----
   The room's game is played with the Solo moves (T is the room's game while view is 'room'). */
const RACE=GeoRace({game:'customs',key:'cu',name:'Customs',total:PER,what:'the same five travellers',
  deal:seed=>{const pool=SOV.filter(c=>(DATA.pop[c.c]||0)>=1e7).map(c=>c.c).sort();return {qs:shuffle(pool,rngFrom(seed)).slice(0,PER).map(c=>newQ(c,rngFrom(seedOf(seed+':'+c)))),sel:0,over:false,left:null}},
  points:pointsOf,right:rightOf,shareLine:G=>G.qs.map(sq).join(''),header,render:()=>render()});
function roomHTML(){if(!RACE.inGame())return RACE.lobbyHTML();
  let h=header('Customs','Room '+RACE.code)+RACE.backHTML()+RACE.scoresHTML();
  if(T.over&&T.left==null)return h+RACE.resultHTML()+summaryHTML(T);
  return h+ticketHTML(T,'online')+`<section class="panel">${playHTML(T)}</section>`}
function render(){
  // With friends first: its screens stay until you leave the room or go back to the Geomingo home page
  const rv=RACE.view();
  if(rv==='friends'){view='friends';app.innerHTML=RACE.friendsHTML();bind();return}
  if(rv==='room'){view='room';if(RACE.inGame()){T=RACE.G;RACE.save()}app.innerHTML=roomHTML();bind();return}
  if(view==='room'||view==='friends')view='home';
  if(view==='home'){openDaily();return}
  if(!TESTDAY&&(view==='home'||view==='daily'&&D&&D.mode==='daily')){const g=dailyGame();if(!g.over)Geomingo.clock.start('customs',todayKey())}
  if(D&&D.mode==='daily')watchResult('cu:'+D.date,D.over&&D.left==null);
  if(view==='train')app.innerHTML=trainHTML();
  else if(view==='solo')app.innerHTML=soloHTML();
  else if(view==='archive')app.innerHTML=archiveView();
  else if(view==='daily')app.innerHTML=dailyHTML();
  else app.innerHTML=homeHTML();
  bind()}
function bind(){
  RACE.bind();const TV=view==='train'||view==='room'&&RACE.inGame();
  if(!$('askbtn'))closeSheet();
  if(TV)bindGiveUp(()=>{if(T.over)return;T.qs.forEach(q=>{if(q.st==='play')q.st='wrong'});T.over=true;T.left=null;trainEnd();render();window.scrollTo(0,0)});
  else bindGiveUp(()=>{if(!D||D.over)return;D.qs.forEach(q=>{if(q.st==='play')q.st='wrong'});D.over=true;D.left=null;query='';typing=false;dailySave();render();window.scrollTo(0,0)});
  if($('home'))$('home').onclick=toHub;
  app.querySelectorAll('[data-go="train"]').forEach(b=>b.onclick=openSolo);
  if($('playsolo'))$('playsolo').onclick=openSolo;
  if($('soloback'))$('soloback').onclick=openSolo;
  if($('archback'))$('archback').onclick=openArchive;
  if($('start'))$('start').onclick=openTrain;
  if($('tagain'))$('tagain').onclick=openTrain;
  if($('daily'))$('daily').onclick=openDaily;
  if($('copy')&&view!=='room')$('copy').onclick=()=>share(dailyShare(D));
  app.querySelectorAll('[data-arch]').forEach(b=>b.onclick=()=>playArchive(b.dataset.arch));
  const G=TV?T:view==='daily'?D:null;
  app.querySelectorAll('[data-tv]').forEach(b=>b.onclick=()=>{const q=G&&G.qs[+b.dataset.tv];if(q&&q.st!=='play')toast(cByCode[q.c].n+(q.st==='right'?' · +'+worth(q):''))});
  if($('nextclue'))$('nextclue').onclick=TV?trainNextClue:dailyNextClue;
  if($('nexttv'))$('nexttv').onclick=()=>TV?nextTraveller(T):nextTraveller(D,dailySave);
  app.querySelectorAll('[data-seg="diff"]').forEach(b=>b.onclick=()=>{store('cu-diff',b.dataset.v);render()});
  if(TV&&T&&!T.over)bindAnswer(T.qs[T.sel],trainPick);
  else if(view==='daily'&&D&&!D.over)bindAnswer(D.qs[D.sel],dailyPick)}
RACE.boot();
render();
// a new day while the page was in the background: today's new travellers
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(view==='home'||view==='daily'&&D&&D.mode==='daily'&&D.date!==todayKey()){D=null;if(view==='daily')openDaily();else render()}});
</script>
</body>
</html>
