<script>
const N = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'');
// country names come from the Geomingo country database (../data/countries.js, C): one name per country
const CO=Object.fromEntries(C.filter(c=>!c.t).map(c=>[c.c,{n:c.n}]));
// every city (CITIES): a national capital, one per country (CO, by ISO code), and the names it can be typed with
CITIES.forEach((c,i)=>{c.i=i;c.k=N(c.n);c.ak=c.al.map(N);c.co=CO[c.k3];c.t=0;});
const byCode = Object.fromEntries(CITIES.map(c=>[c.c,c]));
byCode['lapaz-bol']=byCode['sucre-bol']; // Bolivia used La Paz before: old saved games still open
// countries whose capital is not their biggest city (Wikipedia list, as in Country Grid, plus China)
const NOTBIG = new Set([...CO_LISTS.cap_notlargest,'CHN']);

/* ---- categories: all about the city itself ---- */
const CATS = [];
const add=(fam,label,test)=>CATS.push({id:CATS.length,fam,label,test});
// continent: the country's; Moscow counts as Europe, Ankara, Tbilisi, Yerevan and Baku as Asia
[['AF','In Africa'],['EU','In Europe'],['AS','In Asia'],['OC','In Oceania'],['NA','In North or Central America'],['SA','In South America']].forEach(([r,l])=>add('place',l,c=>c.reg.includes(r)));
add('coast','On the coast',c=>!!c.coast);
add('coast','Inland',c=>!c.coast);
add('alt','Over 1,000 m above sea level',c=>c.alt>=1);
add('alt','Over 2,000 m above sea level',c=>c.alt>=2);
add('lat','South of the Equator',c=>c.lat<0);
add('lat','North of 50°N',c=>c.lat>50);
add('lat','In the tropics',c=>Math.abs(c.lat)<23.44);
add('size','Over 1 million people',c=>c.pop>=1e6);
add('size','Under 100,000 people',c=>c.pop<1e5);
add('size','Megacity (10 million+)',c=>!!c.mega);
add('big','Not its country\'s biggest city',c=>NOTBIG.has(c.k3));
add('sport','Hosted the Summer Olympics',c=>!!c.os);
add('sport','Hosted a men\'s World Cup final',c=>!!c.wcf);
add('water','On the Mediterranean',c=>c.sea==='med');
add('water','On the Danube',c=>c.river==='danube');
['A','B','C','D','K','L','M','N','P','S','T','V'].forEach(L=>add('name','Name starts with '+L,c=>c.k[0]===L.toLowerCase()));
add('name','Name of 2+ words',c=>/[\s-]/.test(c.n.trim()));
add('name','Name has 5 letters or fewer',c=>c.k.length<=5);
add('name','Name has 10+ letters',c=>c.k.length>=10);
add('name','Name contains Z',c=>c.k.includes('z'));
add('name','Name ends in A',c=>c.k.endsWith('a'));
add('name','Same first letter as its country',c=>c.k[0]===N(c.co.n)[0]);
// added 2026-11-12 (at the end, so the numbers of the older categories in saved games stay the same)
add('lon','West of Greenwich',c=>c.lon<0);
add('lon','East of 100°E',c=>c.lon>100);
add('lat','South of 20°S',c=>c.lat<-20);
add('size','100,000 to 1 million people',c=>c.pop>=1e5&&c.pop<1e6);
// added 2026-11-13, checked in two sources each (see README): big rivers, oceans, capitals made after 1950, metros
const SETOF=s=>new Set(s.split(' '));
const RIVERS={EGY:'Nile',SDN:'Nile',SSD:'Nile',AUT:'Danube',SVK:'Danube',HUN:'Danube',SRB:'Danube',COD:'Congo',COG:'Congo',MLI:'Niger',NER:'Niger',
  LAO:'Mekong',KHM:'Mekong',IRQ:'Tigris',GBR:'Thames',FRA:'Seine',POL:'Vistula'};
const OCEAN={atl:SETOF('PRT IRL ISL MAR GHA SEN GAB AGO GMB GIN SLE LBR TGO MRT CPV GNB GNQ STP CUB JAM HTI DOM BHS TTO BRB LCA KNA ATG DMA VCT GRD ARG URY GUY'),
  pac:SETOF('JPN PHL BRN PAN PER NZL FJI PNG WSM TON SLB VUT KIR MHL NRU PLW TUV'),ind:SETOF('LKA MDV OMN SOM DJI MOZ MUS SYC COM')};
const NEWCAP=SETOF('BRA NGA PAK KAZ MMR TZA CIV BLZ BDI MWI PLW MRT BWA');
const METRO=SETOF('DZA ARG ARM AUT AZE BGD BLR BEL BRA BGR CHL CHN CZE DNK DOM ECU EGY FIN FRA GEO DEU GRC HUN IND IRN ITA JPN KAZ PRK KOR MYS MEX NLD NOR PAN PER PHL POL PRT QAT ROU RUS SAU SGP ESP SWE TWN THA TUR UKR GBR USA UZB VEN VNM IDN');
add('river','On a big river',c=>!!c.cap&&!!RIVERS[c.k3]);
add('ocean','On the Atlantic Ocean',c=>!!c.cap&&OCEAN.atl.has(c.k3));
add('ocean','On the Pacific Ocean',c=>!!c.cap&&OCEAN.pac.has(c.k3));
add('ocean','On the Indian Ocean',c=>!!c.cap&&OCEAN.ind.has(c.k3));
add('hist','Made capital after 1950',c=>!!c.cap&&NEWCAP.has(c.k3));
add('metro','Has a metro',c=>!!c.cap&&METRO.has(c.k3));
// worked out from the data: another country's capital less than 100 km away (great-circle distance between the GeoNames points)
const KM=(a,b)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(b.lat-a.lat)/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(r(b.lon-a.lon)/2)**2;return 12742*Math.asin(Math.sqrt(h))};
add('near','Another capital less than 100 km away',c=>!!c.cap&&CITIES.some(d=>d.cap&&d.k3!==c.k3&&KM(c,d)<100));
// people in the city itself (GeoNames) compared with the whole country (UN, data/countries.js)
add('share','A quarter of the country lives there',c=>!!c.cap&&!!DATA.pop[c.k3]&&c.pop/DATA.pop[c.k3]>=0.25);
// added 2026-11-21 (Héctor: more well-known categories, so the same ones come back less often): about the city's country,
// from the Geomingo country database (../data/countries.js), the same lists and rules as in Countries
const CLG=Object.fromEntries(C.map(c=>[c.c,c]));
const inCoList=k=>c=>!!c.cap&&EXTRA[k].includes(c.k3);
add('pol','EU member',inCoList('pol_eu'));
add('pol','Monarchy',inCoList('pol_mon'));
add('sport','Won the men\'s World Cup',inCoList('sp_wcwin'));
['Spanish','French','Arabic'].forEach(L=>add('lang','Official language: '+L,c=>!!c.cap&&!!CLG[c.k3]&&CLG[c.k3].lg.includes(L)));
// added 2026-11-23 (Héctor: categories should be about the CITY, not the country). The six country ones above stay in CATS, so old
// saved games and old daily grids still work, but they are in NOT_IN_GRIDS: no grid after that uses them any more.
// ISLAND = capitals whose city lies on an island (list below; checked in Wikipedia and Britannica)
const ISLAND=SETOF('ISL IRL GBR DNK MLT CYP TWN JPN LKA MDV BHR SGP IDN PHL BRN TLS MUS MDG SYC COM STP CPV GNQ CUB JAM HTI DOM BHS TTO BRB LCA KNA ATG DMA VCT GRD NZL FJI PNG WSM TON SLB VUT KIR MHL FSM NRU PLW TUV');
add('size','Over 5 million people',c=>c.pop>=5e6);
add('size','Under 500,000 people',c=>c.pop<5e5);
add('lat','Northern hemisphere',c=>c.lat>0);
add('lon','Eastern hemisphere',c=>c.lon>0);
add('island','On an island',c=>!!c.cap&&ISLAND.has(c.k3));
// Since ONLY_COUNTRIES_FROM Capitals has all 197 countries of the other Geomingo games: Jerusalem (Israel, Tel Aviv also accepted)
// and Ramallah (Palestine) were added (nw). Daily grids before that day leave them out (setOld), so those days stay as they were.
const ONLY_COUNTRIES_FROM='2026-11-10';
const oldDay=key=>!!key&&key<ONLY_COUNTRIES_FROM;
// From FIX_FROM (data/countries.js) Kiribati's capital is called "South Tarawa", its official name, as in the other games;
// daily grids before that day keep "Tarawa" (setPre / setOld), so those days stay as they were.
const OLD_NAMES={'tarawa-kir':'Tarawa'};
CATS.forEach(k=>{k.set=CITIES.map(c=>!!k.test(c));
  k.setPre=CITIES.map(c=>{if(!OLD_NAMES[c.c])return !!k.test(c);const n=c.n,kk=c.k;c.n=OLD_NAMES[c.c];c.k=N(c.n);try{return !!k.test(c)}finally{c.n=n;c.k=kk}});
  k.setOld=k.setPre.map((v,i)=>v&&!CITIES[i].nw);k.count=k.set.filter(Boolean).length;});
const setMode=key=>oldDay(key)?'setOld':fixedDay(key)?'set':'setPre';
const NAMEWORD='Uses the English name shown in this game (for example "Kyiv", "Delhi", "Washington"). Spaces, hyphens and accents are ignored.';
function describe(k){
  const L=k.label;let m;
  if(m=/^In (.+)$/.exec(L)){const extra={'Europe':' Moscow counts as Europe, and so does Nicosia.','Asia':' Ankara, Tbilisi, Yerevan and Baku count as Asia.','North or Central America':' Includes the Caribbean, Central America and Mexico.','Oceania':' Australia, New Zealand and the Pacific islands.','Africa':'','South America':''};
    return 'The capital is in '+m[1]+'.'+(extra[m[1]]||'')}
  const D={
    'On the coast':'The city is on the shore of a sea or ocean, including bays, fjords and the mouth of an estuary. Lakes and the Caspian Sea do not count (so Baku does not), nor do river cities inland like Washington or Phnom Penh. The Río de la Plata counts as sea, so Buenos Aires and Montevideo do.',
    'Inland':'The city is not on the shore of a sea or ocean: inland, or on a lake or a river. The opposite of "On the coast" (tap that category to see the exact rule).',
    'Over 1,000 m above sea level':'The city centre is more than 1,000 metres above sea level, as given in the city\'s Wikipedia article.',
    'Over 2,000 m above sea level':'The city centre is more than 2,000 metres above sea level, as given in the city\'s Wikipedia article.',
    'South of the Equator':'The city is in the southern hemisphere.',
    'North of 50°N':'The city is north of latitude 50°N, roughly the line through Prague and Kyiv (both just north of it). Coordinates from GeoNames.',
    'In the tropics':'The city lies between the Tropic of Cancer (23.4°N) and the Tropic of Capricorn (23.4°S).',
    'Over 1 million people':'At least 1 million people live in the city itself, as counted by GeoNames (the suburbs around it may or may not be included, depending on how the country draws its city limits).',
    'Under 100,000 people':'Fewer than 100,000 people live in the city itself. Source: GeoNames.',
    'Megacity (10 million+)':'One of the cities with more than 10 million people in their whole urban area. Source: United Nations, World Urbanization Prospects 2018, as listed in Wikipedia, "Megacity". Seoul (9.96 million) and London just miss out.',
    'Not its country\'s biggest city':'Another city in the country has more people than the capital, like New York (not Washington), Sydney (not Canberra) or Istanbul (not Ankara). Source: Wikipedia, "List of countries whose capital is not their largest city", plus China (Shanghai).',
    'Hosted the Summer Olympics':'The city has hosted the Summer Olympic Games at least once, up to Paris 2024.',
    'Hosted a men\'s World Cup final':'The final of the men\'s FIFA World Cup was played in the city or a suburb next to it, up to 2026: Saint-Denis and Colombes count for Paris, Solna for Stockholm.',
    'On the Mediterranean':'The city is on the Mediterranean Sea, including the Adriatic and the Aegean.',
    'On the Danube':'The Danube flows through the city.',
    'West of Greenwich':'The city is west of the Greenwich meridian (0° longitude), like Madrid, Dakar or every capital in the Americas. London is just west of it, and so are Apia (Samoa) and Nukuʻalofa (Tonga), far out in the Pacific. Coordinates from GeoNames.',
    'East of 100°E':'The city is east of longitude 100°E, roughly the line through Bangkok (just east of it): East and Southeast Asia, Australia and the Pacific. Coordinates from GeoNames.',
    'South of 20°S':'The city is south of latitude 20°S, like Pretoria, Asunción, Canberra or Wellington. Coordinates from GeoNames.',
    'On a big river':'The city is on the banks of one of these big rivers: the Nile (Cairo, Khartoum, Juba), the Danube, the Congo, the Niger, the Mekong, the Tigris, the Thames, the Seine or the Vistula. Checked in Wikipedia and Britannica.',
    'On the Atlantic Ocean':'The city is on the coast of the Atlantic Ocean or a bay, estuary or sea that is part of it: the Caribbean, the Gulf of Guinea, the Irish Sea, the Río de la Plata. Inland seas (the Mediterranean, the Baltic, the North Sea) do not count.',
    'On the Pacific Ocean':'The city is on the coast of the Pacific Ocean or a bay or sea that is part of it, like Tokyo Bay, Manila Bay or the Coral Sea. Singapore, Jakarta and Dili lie where the Pacific and Indian Oceans meet and do not count.',
    'On the Indian Ocean':'The city is on the coast of the Indian Ocean or a sea or gulf that is part of it, like the Arabian Sea or the Gulf of Aden. The Persian Gulf and the Red Sea do not count.',
    'Made capital after 1950':'The capital was moved to this city in 1950 or later, often a new city built for it: Brasília, Abuja, Islamabad, Astana, Naypyidaw, Dodoma, Yamoussoukro, Belmopan, Gitega, Lilongwe, Ngerulmud, Nouakchott and Gaborone. Checked in Wikipedia and Britannica.',
    'Has a metro':'The city has a metro (underground or rapid transit) in service, as listed in both Wikipedia, "List of metro systems", and UrbanRail.net. Trams and city trains do not count.',
    'Another capital less than 100 km away':'The capital of another country is less than 100 km away in a straight line, like Vienna and Bratislava, Kinshasa and Brazzaville, or Rome and Vatican City.',
    'A quarter of the country lives there':'At least a quarter of the country\'s people live in the city itself, like Montevideo or Yerevan. City from GeoNames, country from the United Nations (2023).',
    '100,000 to 1 million people':'Between 100,000 and 1 million people live in the city itself (at least 100,000, fewer than 1 million). Source: GeoNames.',
    'Name of 2+ words':'The city name is made of two or more words, counting words joined by a hyphen, like Mexico City or Port-au-Prince. '+NAMEWORD,
    'Name has 5 letters or fewer':'The city name has 5 letters or fewer, like Rome or Paris. '+NAMEWORD,
    'Name has 10+ letters':'The city name has 10 letters or more, not counting spaces. '+NAMEWORD,
    'Name contains Z':'The city name contains the letter Z anywhere. '+NAMEWORD,
    'Name ends in A':'The city name ends in the letter A, like Vienna or Lima. '+NAMEWORD,
    'Over 5 million people':'At least 5 million people live in the city itself. Source: GeoNames.',
    'Under 500,000 people':'Fewer than 500,000 people live in the city itself. Source: GeoNames.',
    'Northern hemisphere':'The city is north of the Equator. Coordinates from GeoNames.',
    'Eastern hemisphere':'The city is east of the Greenwich meridian (0° longitude), like Rome, Nairobi or Tokyo. The opposite of "West of Greenwich". Coordinates from GeoNames.',
    'On an island':'The city itself lies on an island, like Havana, Tokyo, London, Dublin or Copenhagen. Capitals of island countries count, and so does Manama. Stockholm and Abu Dhabi, only partly on islands, do not. Checked in Wikipedia and Britannica.',
    'EU member':'The city\'s country is a member state of the European Union (27 members).',
    'Monarchy':'The city\'s country has a monarch as head of state: a king, queen, emperor, emir, sultan, grand duke, prince or the Pope. Commonwealth realms with King Charles III count, like Canberra or Ottawa.',
    'Won the men\'s World Cup':'The city\'s country has won the men\'s FIFA World Cup, up to Spain\'s win in 2026. England counts as the United Kingdom, so London counts.',
    'Same first letter as its country':'The city name starts with the same letter as the name of its country, like Mexico City (Mexico) or Seoul (South Korea). Country names as in Country Grid ("United States", "United Kingdom", "Türkiye"...). '+NAMEWORD
  };
  if(D[L])return D[L];
  if(m=/^Official language: (.+)$/.exec(L))return m[1]+' is one of the official national languages of the city\'s country. Widely spoken but unofficial languages do not count.';
  if(m=/^Name starts with (.)$/.exec(L))return 'The city name starts with the letter '+m[1]+'. '+NAMEWORD;
  return L+'.';
}
const SHORT={'In North or Central America':'In N. & Central America','Over 1,000 m above sea level':'Over 1,000 m high','Over 2,000 m above sea level':'Over 2,000 m high',
  'Over 1 million people':'Over 1M people','Over 5 million people':'Over 5M people','Under 500,000 people':'Under 500K people','Under 100,000 people':'Under 100K people','Megacity (10 million+)':'Mega­city (10M+)','Not its country\'s biggest city':'Not its country\'s biggest city',
  'Hosted the Summer Olympics':'Summer Olympics host','Hosted a men\'s World Cup final':'World Cup final host','On the Mediterranean':'Medi­terranean',
  'Name has 5 letters or fewer':'5 letters or fewer','Name has 10+ letters':'10+ letters','Name of 2+ words':'2+ words','Same first letter as its country':'Same letter as country','100,000 to 1 million people':'100K to 1M people','On the Atlantic Ocean':'On the Atlantic','On the Pacific Ocean':'On the Pacific','On the Indian Ocean':'On the Indian Ocean',
  'Another capital less than 100 km away':'Another capital within 100 km','A quarter of the country lives there':'¼ of the country lives here','Won the men\'s World Cup':'Won World Cup','Official language: Spanish':'Official: Spanish','Official language: French':'Official: French','Official language: Arabic':'Official: Arabic'};
CATS.forEach(k=>{k.desc=EUT(describe(k));k.short=EUT(SHORT[k.label]||k.label)});
const POOL = CATS.filter(k=>k.count>=4);

/* ---- seeded rng + generator ---- */
function rngFrom(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const inter=(a,b,m)=>{m=m===true?'setOld':m||'set';const A=a[m],B=b[m],o=[];for(let i=0;i<CITIES.length;i++)if(A[i]&&B[i])o.push(i);return o};
/* A grid is "safe" when no sequence of correct answers can ever leave a square impossible:
   for every square, its countries can never all be taken by other squares at the same time. */
function canBlock(ans,c){const A=ans[c];const own=new Map();
  const tryC=(x,seen)=>{for(let d=0;d<ans.length;d++){if(d===c||seen.has(d)||!ans[d].includes(x))continue;seen.add(d);if(!own.has(d)||tryC(own.get(d),seen)){own.set(d,x);return true}}return false};
  for(const x of A)if(!tryC(x,new Set()))return false;return true}
const isSafe=ans=>ans.every((_,c)=>!canBlock(ans,c));
/* ---- grid rules: every square has at least 2 answers ---- */
// specialist categories: never used in grids (they were only in the old Hard level)
const NOT_IN_GRIDS=new Set(['Over 2,000 m above sea level','On the Danube','Hosted a men\'s World Cup final','Name contains Z',
  // about the country, not the city (Héctor, 23 Nov 2026)
  'EU member','Monarchy','Won the men\'s World Cup','Official language: Spanish','Official language: French','Official language: Arabic']);
function evalGrid(rows,cols){
  const answers=[];let bad=0;
  for(const rk of rows)for(const ck of cols){const a=inter(rk,ck);answers.push(a);
    if(a.length<2)bad+=10;if(a.length>CITIES.length*0.5)bad+=10;
    // a square where one category holds the other (Megacity × Over 1 million people, Mediterranean × On the coast) is no puzzle: never used
    if(a.length===rk.count||a.length===ck.count)bad+=10;}
  if(bad)return{answers,score:bad+100};
  let u=0;for(let c=0;c<answers.length;c++)if(canBlock(answers,c))u++;
  return{answers,score:u};
}
function famOK(list){const f={};for(const k of list){f[k.fam]=(f[k.fam]||0)+1;if(f[k.fam]>2)return false}return true}

const RARE=new Set(['sport','water','alt']);
const WILD=new Set(['On the coast','Inland']);
let AVOID=null;
let FAMS=null;
// "Name starts with…" squares are trivial with the search box, so they are not used
function famsFor(){if(!FAMS){const pool=POOL.filter(k=>!/^Name starts with/.test(k.label)&&!NOT_IN_GRIDS.has(k.label));const f={};pool.forEach(k=>(f[k.fam]=f[k.fam]||[]).push(k));FAMS={pool,fams:Object.values(f),rare:pool.filter(k=>RARE.has(k.fam))}}return FAMS}
// CATW evens out the search: categories that fit with almost anything were kept far more often than narrow ones
// (a border, a small sea), so each has a weight (the four categories added on 2026-11-12 and the six of 2026-11-21 were set by hand, from how often they came up) measured over 4,000 Normal 4 × 4 grids (labels missing here weigh 1).
const CATW={"Northern hemisphere":0.2,"Eastern hemisphere":0.2,"Over 5 million people":1.5,"Under 500,000 people":0.25,"On an island":0.3,"Monarchy":0.2,"Official language: French":0.4,"Official language: Arabic":0.6,"Official language: Spanish":0.6,"Won the men's World Cup":2,"Has a metro":0.12,"A quarter of the country lives there":0.2,"Another capital less than 100 km away":0.3,"100,000 to 1 million people":0.2,"West of Greenwich":0.3,"East of 100°E":0.6,"South of 20°S":1.5,"In Africa":0.53,"In Europe":2.45,"In Asia":0.97,"In Oceania":6,"In North or Central America":2.78,"In South America":6,"On the coast":0.52,"Inland":0.62,"Over 1,000 m above sea level":0.87,"South of the Equator":0.46,"North of 50°N":6,"In the tropics":0.44,"Over 1 million people":0.38,"Under 100,000 people":0.99,"Megacity (10 million+)":4.29,"Not its country's biggest city":0.23,"Hosted the Summer Olympics":6,"On the Mediterranean":6,"Name of 2+ words":0.43,"Name has 5 letters or fewer":0.19,"Name has 10+ letters":0.19,"Name ends in A":0.11,"Same first letter as its country":0.21};
const catWeight=k=>AVOID&&AVOID.has(k.label)?0:(CATW[k.label]||1)*(WILD.has(k.label)?0.5:1);

function searchGrid(n,r,restarts){
  for(let rs=0;rs<restarts;rs++){
    const cand=[];const seen=new Set();for(let i=0;i<400&&cand.length<4*n;i++){const k=pickCat(r);if(!seen.has(k)){seen.add(k);cand.push(k)}}let rows=[],cols=[];
    for(const k of cand){if(rows.length<n&&famOK([...rows,k]))rows.push(k);else if(cols.length<n&&!rows.includes(k)&&famOK([...cols,k]))cols.push(k);if(rows.length===n&&cols.length===n)break}
    for(let g=0;g<2000&&(rows.length<n||cols.length<n);g++){const k=pickCat(r);if(rows.includes(k)||cols.includes(k))continue;if(rows.length<n&&famOK([...rows,k]))rows.push(k);else if(cols.length<n&&famOK([...cols,k]))cols.push(k)}
    if(rows.length<n||cols.length<n)continue;

    let anchor=null;const rare=famsFor().rare;
    if(rare.length&&r()<0.5){anchor=rare[Math.floor(r()*rare.length)];if(!catWeight(anchor))anchor=null;else
      if(!cols.includes(anchor)&&!rows.includes(anchor))rows[0]=anchor;else anchor=null}

    for(let it=0;it<1500&&cur.score>0;it++){

      if(anchor&&axis==='r'&&i===0)continue;

      const na=arr.slice();na[i]=k;if(!famOK(na))continue;
