<style>
/* Flag Pie: the colours of a flag as a pie chart, four more clues opened one by one, the answer box under them */
.play{display:flex;flex-direction:column;gap:12px;width:100%}
.piecard{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--sheet);border:2px solid var(--gold);border-radius:16px;padding:14px 12px}
.piecard svg{display:block;width:min(64vw,230px);height:auto}
.piecard.small svg{width:min(40vw,150px)}
.leg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;width:100%}
.leg li{display:flex;align-items:center;gap:8px;font-size:.95rem;min-width:0}
.leg i{flex:none;width:16px;height:16px;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.leg span{min-width:0;overflow-wrap:anywhere}
.leg b{margin-left:auto;font-family:var(--mono);font-weight:700;white-space:nowrap}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.clue{display:flex;gap:12px;align-items:flex-start;background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.clue .ci{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sea-soft);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:.85rem}
.clue .ct{display:flex;flex-direction:column;gap:2px;min-width:0}
.clue .ct span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.clue .ct b{font-weight:600;font-size:1rem;line-height:1.3}
.clue .ct small{font-size:.85rem;color:var(--ink-2)}
.clue .blur{width:150px;border-radius:4px;margin-top:6px;overflow:hidden;box-shadow:0 0 0 1px var(--rule)}
.clue .blur img{display:block;width:100%;filter:blur(7px);transform:scale(1.15)}
.clue.new{border-color:var(--gold)}
.clue.off{border-style:dashed;opacity:.55}
.missed{display:flex;flex-direction:column;gap:2px;margin:0;border:2px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:9px 12px}
.missed b{color:var(--bad)}
.missed span{font-size:.9rem;color:var(--ink-2)}
.locked{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink-2);font-size:.92rem}
.locked .linkbtn{margin-left:auto}
.ans{display:flex;flex-direction:column;gap:6px}
.ans input{width:100%;border:1.5px solid var(--ink);border-radius:5px;padding:12px;font-size:1.1rem;background:var(--paper)}
.ans .sugg{max-height:none}
/* the flag once the game is over: the real one, with its pie next to it */
.reveal{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:2px solid var(--good);border-radius:16px;padding:16px 14px;background:var(--p4-soft)}
.reveal.wrong{border-color:var(--bad);background:var(--bad-soft)}
.reveal img.real{width:min(70vw,240px);height:auto;border-radius:5px;box-shadow:0 0 0 1px var(--rule);background:var(--rule)}
.reveal .ln{font-family:var(--display);font-weight:700;font-size:1.8rem;line-height:1.1;overflow-wrap:anywhere}
.reveal .lst{font-family:var(--type,var(--mono));letter-spacing:.15em;font-weight:700;color:var(--good);border:2px solid currentColor;padding:2px 10px;border-radius:4px;transform:rotate(-4deg)}
.reveal.wrong .lst{color:var(--bad)}
.reveal .ls{color:var(--ink-2);font-size:.92rem}
.dsq{grid-template-columns:repeat(5,1fr);width:100px}
.dsq i.mid{background:var(--p2)}
.dsq i.bad{background:var(--bad)}
.arch .dsq{width:64px}
.hpie{display:flex;justify-content:center;gap:6px;width:100%}
.hpie svg{width:52px;height:52px}
.desk{display:flex;gap:6px;width:100%}
.desk button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;background:var(--sheet);border:2px dashed var(--line);border-radius:10px;color:var(--ink-2);font:inherit;font-size:.7rem;cursor:default}
.desk button b{font-family:var(--mono);font-size:.95rem;color:var(--ink)}
.desk button img{width:34px;height:23px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px var(--rule);background:var(--rule)}
.desk button.right,.desk button.wrong{padding:6px 2px;cursor:pointer}
.desk button.sel{border:2px solid var(--flamingo);background:var(--flamingo);color:var(--on-flamingo);font-weight:700;letter-spacing:.06em}
.desk button.sel b{font-size:1.1rem;color:var(--on-flamingo)}
.desk button.right{border-style:solid;border-color:var(--good);background:var(--p4-soft)}
.desk button.wrong{border-style:solid;border-color:var(--bad);background:var(--p0-soft)}
.reveal .primary{width:100%;margin-top:6px}
.flist{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:12px;background:var(--sheet);border:2px solid var(--good);border-radius:14px;padding:10px 12px}
.frow.wrong{border-color:var(--bad)}
.frow svg{width:44px;height:44px;flex:none}
.frow img{width:48px;height:auto;border-radius:3px;box-shadow:0 0 0 1px var(--rule);flex:none}
.frow .rn{display:flex;flex-direction:column;min-width:0}
.frow .rn b{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.1}
.frow .rn small{color:var(--ink-2);font-size:.85rem}
.frow .rpts{margin-left:auto;font-family:var(--mono);color:var(--gold);white-space:nowrap}
</style>

<script>
/* ---- Flag Pie: the colours of a flag as a pie chart, and you name the country ----
   Five flags per game (Héctor, 2026-11-04: one was too little), one at a time, as the travellers in Customs.
   The pie (pies.js) says how much of the flag each colour covers, coat of arms and all. Four more clues open one at a
   time, from not obvious to obvious: the design (stripes, symbols), the map, population and capital, the flag blurred.
   Right with k clues open = 6 - k points (5 down to 1). A wrong answer opens the next clue; a wrong answer with all
   five open lets the flag go with 0. A flag with the same pie (SAME) is a right answer too. Best game 25.
   A game is {qs: five flags, sel: the one on screen, over, left: the one just finished, shown until Next flag};
   a flag is {c: country code, k: clues open, tries: wrong answers, st: 'play' | 'right' | 'wrong', alt: the twin named}. */
const CLUES=5,PER=5,MAX=CLUES*PER,FIRST='2026-11-04';
const SOV=C.filter(c=>!c.t&&PIE[c.c]);
const cByCode=Object.fromEntries(SOV.map(c=>[c.c,c]));
const realFlag=c=>'flags/'+c+'.svg';
const contName={EU:'Europe',AS:'Asia',AF:'Africa',NA:'North or Central America',SA:'South America',OC:'Oceania'};
const worth=q=>CLUES+1-q.k;
const ptsOf=q=>q.st==='right'?worth(q):0;
const newQ=c=>({c,k:1,tries:[],st:'play',alt:null});
const newGame=(codes,o)=>Object.assign({qs:codes.map(newQ),sel:0,over:false,left:null},o||{});
let query='',typing=false;
// European number format: dot for thousands, comma for decimals (34,1 %)
const num=(n,d)=>Number(n).toLocaleString('de-DE',d==null?{maximumFractionDigits:3}:{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=p=>num(p,1)+' %';
function popText(n){if(n>=1e9)return num(+(n/1e9).toFixed(2))+' billion';if(n>=1e6)return num(+(n/1e6).toFixed(n>=1e8?0:1))+' million';
  if(n>=1e4)return num(Math.round(n/1e3)*1e3);return num(Math.round(n/10)*10)}
const listText=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const isIn=(k,c)=>(EXTRA[k]||DATA[k]||[]).includes(c);
const giveaway=(c,w)=>N(w).slice(0,4)===c.k.slice(0,4);

/* ---- the pie: the slices in the flag's own colours, biggest first, clockwise from the top ---- */
function pieSVG(code,label){const s=PIE[code];let a=-Math.PI/2,p='';
  if(s.length===1)p=`<circle r="1" fill="${s[0][0]}"/>`;
  else for(const [col,v] of s){const a2=a+v/100*2*Math.PI,big=v>50?1:0;
    p+=`<path d="M0 0L${Math.cos(a).toFixed(4)} ${Math.sin(a).toFixed(4)}A1 1 0 ${big} 1 ${Math.cos(a2).toFixed(4)} ${Math.sin(a2).toFixed(4)}Z" fill="${col}"/>`;a=a2}
  return `<svg viewBox="-1.04 -1.04 2.08 2.08" role="img" aria-label="${esc(label||'The colours of the flag')}"><g stroke="#0C1220" stroke-width=".012" stroke-linejoin="round">${p}</g><circle r="1" fill="none" stroke="rgba(255,255,255,.25)" stroke-width=".02"/></svg>`}
const legendHTML=code=>`<ul class="leg">${PIE[code].map(([col,v,n])=>`<li><i style="background:${col}"></i><span>${esc(n)}</span><b>${pct(v)}</b></li>`).join('')}</ul>`;
const pieCardHTML=(code,small)=>`<div class="piecard${small?' small':''}">${pieSVG(code,'The colours of the flag: '+PIE[code].map(([,v,n])=>n+' '+pct(v)).join(', '))}${legendHTML(code)}</div>`;

/* ---- the clues after the pie ---- */
const SYM=[['flag_star','a star'],['flag_moon','a crescent moon'],['flag_sun','a sun'],['flag_cross','a cross'],['flag_uj','the Union Jack'],['flag_arms','a coat of arms'],['flag_animal','an animal']];
function clue(q,i){const c=cByCode[q.c],d=c.c;
  if(i===2){const sym=SYM.filter(([k])=>isIn(k,d)).map(x=>x[1]);
    return {lab:'The design',main:LAY[d]||'No simple stripes',sub:sym.length?'With '+listText(sym):'No star, moon, sun, cross or coat of arms'}}
  if(i===3){const nb=c.b.filter(b=>cByCode[b]).length;
    return {lab:'On the map',main:contName[c.r],sub:c.ll?'Landlocked: no coast':!nb?'An island country':'With a coast, '+nb+' land neighbour'+(nb===1?'':'s')}}
  if(i===4)return {lab:'People and capital',main:'Population: '+popText(DATA.pop[d]||0),sub:c.cap&&!giveaway(c,c.cap)?'The capital starts with '+c.cap[0].toUpperCase():''};
  return {lab:'The flag, blurred',blur:d}}
function cluesHTML(q){return `<ol class="clues">${[2,3,4,5].map(i=>{if(i>q.k)return '';const x=clue(q,i);
    return `<li class="clue${i===q.k?' new':''}"><span class="ci">${i}</span><span class="ct"><span>${x.lab}</span>${x.main?`<b>${esc(x.main)}</b>`:''}${x.sub?`<small>${esc(x.sub)}</small>`:''}${x.blur?`<span class="blur"><img src="${realFlag(x.blur)}" alt="The flag, blurred"></span>`:''}</span></li>`}).join('')}</ol>`}

/* answering: the same box as in the other games */
function matches(t){const k=N(t);if(!k)return [];
  const ex=[],st=[],ins=[];for(const c of SOV){if(c.k===k||c.ak.includes(k))ex.push(c);else if(c.k.startsWith(k)||c.ak.some(a=>a.startsWith(k)))st.push(c);else if(k.length>=3&&(c.k.includes(k)||c.ak.some(a=>a.includes(k))))ins.push(c)}
  return [...ex,...st,...ins].slice(0,6)}
function suggHTML(q){if(!query)return SHEETS?'<li class="hint" style="padding:8px 2px">Start typing, then tap the country.</li>':'';const res=matches(query);
  if(!res.length)return `<li class="hint" style="padding:8px 2px">No country matches “${esc(query)}”.</li>`;
  return res.map(c=>{const t=q.tries.includes(c.c);return `<li><button data-g="${c.c}" ${t?'disabled':''}>${esc(c.n)}${t?'<span class="tag">not it</span>':''}</button></li>`}).join('')}
function answerBoxHTML(q){
  if(SHEETS)return askBtnHTML();
  return `<div class="ans"><input id="q" placeholder="Type a country…" autocomplete="off" autocapitalize="words" spellcheck="false" value="${esc(query)}" aria-label="Type a country"><ul class="sugg" id="sugg">${suggHTML(q)}</ul></div>`}
function bindAnswer(G,onPick){const q=G.qs[G.sel];
  if(SHEETS){bindAsk($('askbtn')?{key:q.c+':'+q.k+':'+view+':'+G.sel,back:'Back to the pie',
    head:`<span>Whose flag is this? <i>${worth(q)} point${worth(q)===1?'':'s'}</i></span>`,
    sugg:t=>{query=t;return suggHTML(q)},first:t=>{const m=matches(t).filter(c=>!q.tries.includes(c.c));return m[0]&&m[0].c},pick:onPick}:null);return}
  const box=$('q');if(!box)return;
  const draw=()=>{const u=$('sugg');if(u){u.innerHTML=suggHTML(q);u.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>onPick(b.dataset.g))}};
  box.oninput=e=>{query=e.target.value;draw()};
  box.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const m=matches(query).filter(c=>!q.tries.includes(c.c));if(m[0])onPick(m[0].c)}};
  draw();if(query||typing)setTimeout(()=>{box.focus();box.setSelectionRange(box.value.length,box.value.length)},0)}
// one answer: 'right' (the country, or one with the same pie), 'wrong' (the next clue opens) or 'out' (all five were open)
function answer(q,code){if(code===q.c||(SAME[q.c]||[]).includes(code)){q.st='right';q.alt=code===q.c?null:code;return 'right'}
  q.tries.push(code);if(q.k>=CLUES){q.st='wrong';return 'out'}q.k++;return 'wrong'}
// the next clue without answering; with all five open, "I don't know" lets the flag go
function nextClue(q){if(q.st!=='play')return;if(q.k<CLUES)q.k++;else q.st='wrong'}
function feedback(q,res){if(res==='right')Geomingo.stamp('flagpie',cByCode[q.c].n,'+'+worth(q),q.c)}
const tk=Geomingo.tk;
const pointsOf=G=>G.qs.reduce((n,q)=>n+ptsOf(q),0);
const rightOf=G=>G.qs.filter(q=>q.st==='right').length;
const wrongOf=G=>G.qs.reduce((n,q)=>n+q.tries.length,0);
const pieOnlyOf=G=>G.qs.filter(q=>q.st==='right'&&q.k===1).length;
// the five flags of the game in a row: the one on screen in flamingo, the finished ones with their flag and points
const deskHTML=G=>`<div class="desk" role="group" aria-label="The five flags">${G.qs.map((q,i)=>{const now=i===G.sel&&!G.over&&G.left==null,cls=[now?'sel':'',q.st==='right'?'right':q.st==='wrong'?'wrong':''].join(' ');
  return `<button data-tv="${i}" class="${cls}" aria-label="Flag ${i+1}${q.st==='play'?'':': '+esc(cByCode[q.c].n)}"${now?' aria-current="step"':''}>${q.st!=='play'?`<img src="${realFlag(q.c)}" alt=""><b>${q.st==='right'?'+'+worth(q):'0'}</b>`:now?`NOW<b>${i+1}</b>`:`#${i+1}<b>–</b>`}</button>`}).join('')}</div>`;
// a flag that has just finished: the real one in big, then Next flag
function leftHTML(G,i){const q=G.qs[i],c=cByCode[q.c],ok=q.st==='right';
  const twin=q.alt?`<span class="ls">You said ${esc(cByCode[q.alt].n)}: its flag has the same pie, so it counts.</span>`:'';
  const others=(SAME[q.c]||[]).filter(x=>x!==q.alt).map(x=>cByCode[x]&&cByCode[x].n).filter(Boolean);
  return `<div class="reveal${ok?'':' wrong'}"><span class="label">Flag ${i+1} of ${PER}</span><img class="real" src="${realFlag(q.c)}" alt="The flag of ${esc(c.n)}"><b class="ln">${esc(c.n)}</b><span class="lst">${ok?'STAMPED':'MISSED'}</span>
    <span class="ls">${ok?'+'+worth(q)+' point'+(worth(q)===1?'':'s')+' · right with '+q.k+' clue'+(q.k===1?'':'s'):'0 points'+(q.tries.length?' · you said '+q.tries.map(x=>esc(cByCode[x].n)).join(', '):'')}</span>${twin}
    ${others.length?`<span class="ls">Same pie: ${esc(listText(others))}.</span>`:''}
    <button class="primary" id="nexttv">${G.over?'See your result':'Next flag →'}</button></div>`}
// the play area: the five flags, then the pie on screen, its open clues, what's still locked, a wrong answer, the answer box
function playHTML(G){let h=deskHTML(G);
  if(G.left!=null)return `<div class="play">${h}${leftHTML(G,G.left)}</div>`;
  if(G.over)return `<div class="play">${h}</div>`;
  const q=G.qs[G.sel],more=CLUES-q.k;
  return `<div class="play">${h}<span class="label">Flag ${G.sel+1} of ${PER} · worth ${worth(q)} point${worth(q)===1?'':'s'}</span>${pieCardHTML(q.c)}${cluesHTML(q)}
    <div class="locked">${more?'🔒 '+more+' more clue'+(more===1?'':'s')+' locked':'All five clues are open'}<button class="linkbtn" id="nextclue">${more?'Next clue':'I don\'t know'}</button></div>
    ${q.tries.length?`<p class="missed"><b>✗ Not ${q.tries.map(c=>esc(cByCode[c].n)).join(', not ')}.</b><span>Clue ${q.k} is open. Now worth ${worth(q)}.</span></p>`:''}${answerBoxHTML(q)}${giveUpHTML()}</div>`}
// after a flag finishes: show it, then the next one still to play, or the game is over
function advance(G){if(G.qs[G.sel].st==='play')return;G.left=G.sel;const n=G.qs.findIndex(q=>q.st==='play');if(n<0)G.over=true;else G.sel=n}
function nextFlag(G,save){const end=G.over;G.left=null;if(save)save();render();
  if(end){window.scrollTo(0,0);return}const d=document.querySelector('.desk');if(d)window.scrollTo(0,Math.max(0,d.getBoundingClientRect().top+window.scrollY-90))}
function showLeft(){const d=document.querySelector('.desk');if(d&&d.getBoundingClientRect().top<0)window.scrollTo(0,Math.max(0,d.getBoundingClientRect().top+window.scrollY-90))}
// the summary under a finished game: each flag, its pie and the points
const summaryHTML=G=>`<section class="panel"><span class="label">The five flags</span><div class="flist">${G.qs.map(q=>{const c=cByCode[q.c],ok=q.st==='right';
  return `<div class="frow${ok?'':' wrong'}">${pieSVG(q.c)}<img src="${realFlag(q.c)}" alt=""><span class="rn"><b>${esc(c.n)}</b><small>${ok?'Right with '+q.k+' clue'+(q.k===1?'':'s'):'Missed'}</small></span><span class="rpts">${ok?'+'+worth(q):'0'}</span></div>`}).join('')}</div></section>`;
const sq=q=>q.st==='right'?(q.k===1?'🟩':q.k<=3?'🟨':'🟧'):'🟥';
const sqClass=q=>q.st==='right'?(q.k<=2?'on':'mid'):q.st==='wrong'?'bad':'';
const squaresHTML=G=>`<span class="dsq" aria-hidden="true">${G.qs.map(q=>`<i class="${sqClass(q)}"></i>`).join('')}</span>`;

/* ---- Daily: five flags, the same for everyone, new at midnight CET ----
   Only flags whose pie has no near twin (UNIQ), dealt five a day from a deck shuffled once per cycle, so no flag
   comes back until the deck is used up. Saved as fp-daily {date, over, S: the game}. */
// the daily deck, kept as it was on the first day so a day's flags never change when the pies are measured again
const DECK=["AFG","AND","ARE","ARM","ATG","AZE","BEN","BFA","BGD","BHS","BIH","BLR","BLZ","BRA","BRB","BRN","BTN","BWA","CHL","CMR","COD","CPV","CUB","CYP","DEU","DJI","DMA","DNK","DZA","ERI","ESP","ETH","FIN","FJI","GAB","GEO","GMB","GNQ","GRC","GRD","GUY","IRN","ISL","ISR","JAM","JOR","JPN","KAZ","KEN","KHM","KIR","KNA","KOR","LAO","LBN","LBR","LBY","LCA","LKA","LSO","LUX","MDA","MDV","MHL","MMR","MNE","MNG","MOZ","MRT","MUS","MWI","NAM","NER","NGA","NOR","NPL","NRU","OMN","PAK","PAN","PER","PHL","PLW","PNG","PRK","PRT","PSE","RWA","SAU","SLB","SLE","SMR","SSD","STP","SUR","SWE","SWZ","SYC","TGO","TJK","TKM","TUR","TUV","TZA","UGA","UKR","UNK","URY","USA","UZB","VAT","VCT","VUT","ZAF","ZMB","ZWE"];
function dailyCodes(key){const n=dayNum(key,FIRST)-1,codes=DECK.filter(c=>cByCode[c]).sort(),days=Math.floor(codes.length/PER);
  const cyc=Math.floor(n/days),i=((n%days)+days)%days;return shuffle(codes,rngFrom(seedOf('flagpie5-'+cyc))).slice(i*PER,(i+1)*PER)}
let D=null;
// saves from the first day, when a game was one flag ({c, k, …} without qs), are left behind
const isGame=S=>S&&Array.isArray(S.qs);
const dailySaved=()=>{const d=load('fp-daily',null);return d&&d.date===todayKey()&&isGame(d.S)?d:null};
function dailyGame(){const d=dailySaved();if(d)return d.S;
  return newGame(dailyCodes(todayKey()),{mode:'daily',date:todayKey(),num:dayNum(todayKey(),FIRST)})}
function dailySave(){if(!D)return;
  if(D.mode==='archive'){const a=load('fp-arch',{});a[D.date]=D;store('fp-arch',a);if(D.over)logHist(D);return}
  store('fp-daily',{date:D.date,over:D.over,S:D});
  if(D.over&&logHist(D)&&!TESTDAY){Geomingo.clock.stop('flagpie',D.date,pointsOf(D)/MAX);Geomingo.account.done('flagpie')}}
// a finished daily (on its day) goes into the history once: {p points, r flags named, a from the pie alone, m wrong answers, n: 5}
function logHist(G){if(G.mode!=='daily')return false;const h=load('fp-hist',{});
  // the first day was played as one flag: that entry (no n) gives way to the five-flag game
  if(h[G.date]&&!(G.date===FIRST&&!h[G.date].n))return false;
  h[G.date]={p:pointsOf(G),r:rightOf(G),a:pieOnlyOf(G),m:wrongOf(G),n:PER};store('fp-hist',h);return true}
function dailyPick(code){const q=D&&D.qs[D.sel];if(!q||q.st!=='play'||D.over)return;
  const res=answer(q,code);query='';typing=res==='wrong';feedback(q,res);advance(D);dailySave();render();if(res!=='wrong')showLeft()}
function dailyNextClue(){const q=D&&D.qs[D.sel];if(!q||q.st!=='play'||D.over)return;nextClue(q);advance(D);dailySave();render();if(q.st!=='play')showLeft()}
function dailyShareText(G){return `${Geomingo.share('Flag Pie')} #${G.num}${G.mode==='archive'?' (archive)':''} — ${pointsOf(G)}/${MAX}\n${G.qs.map(sq).join('')}`}
const dailyShare=G=>dailyShareText(G)+"\n\nPlay today's Flag Pie: "+pageLink();
function verdict(G){const p=pointsOf(G),r=rightOf(G);
  return r===PER&&p>=20?{pose:'happy',t:'A flag expert. '+p+' points.',s:'All five named.'}:r===PER?{pose:'happy',t:'All five stamped.',s:p+' of '+MAX+' points.'}
    :r>=3?{pose:'happy',t:r+' of 5 stamped.',s:p+' points. Tap a flag to see which it was.'}:r>=1?{pose:'think',t:'Tricky colours today.',s:r+' of 5, '+p+' points.'}
    :{pose:'sad',t:'No flag today.',s:'Solo helps: unlimited flags.'}}
const fpAverage=()=>{const v=Object.values(load('fp-hist',{})).filter(e=>(+e.n||1)===PER);return v.length?EU(v.reduce((a,e)=>a+(+e.p||0),0)/v.length,1):'–'};
// the result, on top of the page, as in every game
function resultHTML(G){const p=pointsOf(G),v=verdict(G);
  if(G.mode==='archive')return `<section class="panel">${Geomingo.hello(v.pose,v.t,v.s,{key:'res'})}<span class="label">Archive · Flag Pie #${G.num}</span><p class="big">${p} points</p>
    <p class="hint">${rightOf(G)} of 5 named. Archive games don't count for the ranking or your streak.</p>
    <pre class="sharebox" id="share">${esc(dailyShareText(G))}</pre>
    ${SHARE_BTN}<div class="row-btns sharerow"><button class="primary" id="archback" style="flex:1">Back to archive</button></div></section>`;
  return `<section class="panel">${Geomingo.hello(v.pose,v.t,v.s,{key:'res'})}<span class="label">Flag Pie #${G.num}</span><p class="big">${p} points</p>
    <p class="hint">${rightOf(G)} of 5 named. Next flags in ${nextIn()}.</p>
    <pre class="sharebox" id="share">${esc(dailyShareText(G))}</pre>
    ${SHARE_BTN}<div class="row-btns sharerow">${nextGameBtn('flagpie')}</div>
    <button class="ghost" id="playsolo">Play Solo</button>
    ${allPlayedHTML('flagpie')}
    <span class="label">Your daily games</span>${statTiles(Object.keys(load('fp-hist',{})).length,fpAverage(),streakOf(load('fp-hist',{})))}</section>${rankingHTML()}`}
// today's ranking (signed-in players, first try of the day): points, then fewer wrong answers, then who finished first
const rankingHTML=()=>Geomingo.account.rankingHTML('flagpie',{what:'game',score:r=>[r.s+' pts',r.m+' wrong']});
Geomingo.account.onChange((why,typing)=>{if(why==='adopt'&&D&&D.mode==='daily'&&D.date===todayKey()){D=dailyGame();liveKey=''}
  if(!typing&&(view==='home'||view==='daily'&&D&&D.over))render()});
function openDaily(){D=dailyGame();query='';view='daily';render();window.scrollTo(0,0)}
function ticketHTML(G,mode){const lf=G.left!=null,i=lf?G.left:G.sel,q=G.qs[i];
  const m=lf?(q.st==='right'?['happy','Stamped.','Tap Next flag when you are ready.']:['sad','Not this one.','Tap Next flag when you are ready.'])
    :q.k>1||q.tries.length?['think','Look again.','A new clue is open. Every clue lowers the points.']
    :['pass','A flag in pieces.','These are its colours and how much of it each one covers. Whose flag is it?'];
  return Geomingo.ticket(Geomingo.hello(m[0],m[1],m[2]),
    tk('Traveller',esc(Geomingo.traveller()),'tk-name')+tk('Flag',(i+1)+'/'+PER)+tk('Points',pointsOf(G),'tk-pts')+tk('Worth',lf?(q.st==='right'?'+'+worth(q):'0'):'+'+worth(q),'tk-gs'),{mode,num:G.num})}
function dailyHTML(){const arch=D.mode==='archive';let h=header('Flag Pie',(arch?'Archive #':'Daily #')+D.num);
  h+=`<div class="backline"><button class="linkbtn" id="${arch?'archback':'home'}">← Back</button><span class="ht">${arch?'Archive #'+D.num:"Today's flags"}</span></div>`;
  if(D.over&&D.left==null)return h+resultHTML(D)+summaryHTML(D);
  return h+ticketHTML(D,arch?'archive':'daily')+`<section class="panel">${playHTML(D)}</section>`+quickRules()}

/* ---- the archive: past days, one try each on this device ---- */
const archDay=k=>{const e=load('fp-hist',{})[k];return e?e.p+' pts':null};
function openArchive(){view='archive';query='';typing=false;render();window.scrollTo(0,0)}
function playArchive(k){if(archDay(k)){toast('You played this day already.');return}
  const a=load('fp-arch',{});D=isGame(a[k])?a[k]:newGame(dailyCodes(k),{mode:'archive',date:k,num:dayNum(k,FIRST)});
  query='';typing=false;view='daily';dailySave();render();window.scrollTo(0,0)}
const archiveView=()=>header('Flag Pie','Archive')+archiveHTML({first:FIRST,label:'Day',num:k=>dayNum(k,FIRST),
  played:archDay,saved:k=>{const g=load('fp-arch',{})[k];return isGame(g)?g:null},done:g=>[pointsOf(g)+' pts',squaresHTML(g)]});

/* ---- Solo: five random flags a game, as many games as you like (fp-solo keeps the numbers) ----
   Easy: well-known countries (10 million people or more) whose pie has no near twin. Hard: every flag. */
let T=null;
const soloDiff=()=>load('fp-diff','easy')==='hard'?'hard':'easy';
const seg=(name,opts,val)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-seg="${name}" data-v="${v}" aria-pressed="${v===val}">${l}</button>`).join('')}</div>`;
const soloPool=()=>soloDiff()==='easy'?UNIQ.filter(c=>cByCode[c]&&(DATA.pop[c]||0)>=1e7):SOV.map(c=>c.c);
function openSolo(){view='solo';query='';typing=false;render();window.scrollTo(0,0)}
function soloHTML(){return header('Flag Pie','Solo')+`<section class="panel">
  <div class="backline"><button class="linkbtn" id="home">← Back</button><span class="ht">Solo</span></div>
  <p class="hint">Five flags, a new set every game. Up to ${MAX} points.</p>
  <div class="field"><span class="label">Difficulty</span>${seg('diff',[['easy','Easy'],['hard','Hard']],soloDiff())}<p class="hint">${soloDiff()==='easy'?'Well-known countries, with 10 million people or more, and no two pies alike':'Any of the '+SOV.length+' countries. Some flags share the same pie: any of them counts'}.</p></div>
  <button class="primary" id="start">Start game</button></section>${quickRules()}`}
function openTrain(){T=newGame(shuffle(soloPool(),Math.random).slice(0,PER),{mode:'solo'});mood=null;view='train';query='';typing=false;render();window.scrollTo(0,0)}
function trainEnd(){if(T.logged)return;T.logged=1;logSolo('fp-solo5',{p:pointsOf(T),best:pointsOf(T),r:rightOf(T)})}
function trainPick(code){const q=T&&T.qs[T.sel];if(!q||q.st!=='play'||T.over)return;
  const res=answer(q,code);query='';typing=res==='wrong';feedback(q,res);advance(T);if(T.over)trainEnd();render();if(res!=='wrong')showLeft()}
function trainNextClue(){const q=T&&T.qs[T.sel];if(!q||q.st!=='play'||T.over)return;nextClue(q);advance(T);if(T.over)trainEnd();render();if(q.st!=='play')showLeft()}
function trainHTML(){let h=header('Flag Pie','Solo')+`<div class="backline"><button class="linkbtn" id="soloback">← Back</button><span class="ht">Solo</span></div>`;
  if(T.over&&T.left==null){const p=pointsOf(T),s=load('fp-solo5',null)||{};
    return h+`<section class="panel">${Geomingo.hello(p>=15?'happy':'think',p+' points.',rightOf(T)+' of 5 named. Your best Solo game: '+(s.best||p)+'.',{key:'res'})}<span class="label">Solo</span><p class="big">${p} points</p>
      <button class="primary" id="tagain">New game</button></section>`+summaryHTML(T)}
  return h+ticketHTML(T,'practice')+`<section class="panel">${playHTML(T)}</section>`+quickRules()}

/* ---- stats, rules, credits ---- */
function myStatsHTML(){const h=load('fp-hist',{}),so=load('fp-solo5',null)||{n:0};
  return statsPageHTML({game:'Flag Pie',hist:h,unit:'day',avg:fpAverage(),lbs:d=>[{path:'lb/flagpie',dates:d}],num:k=>'Flag Pie #'+dayNum(k,FIRST),
    solo:{n:so.n,unit:'game',medal:so.best||0,stats:[[so.best||0,'best'],[so.n?EU(so.p/so.n,1):0,'average'],[so.r||0,'named']]},
    friends:{n:0,w:0,place:0,best:0,third:[0,'best']}})}
const quickRules=()=>`<section class="panel qrules"><span class="label">Quick rules</span><p class="hint">Five flags, each one as a pie of its colours. Name the country with the pie alone for 5 points; every wrong answer opens one more clue and lowers the points. Full rules in <button type="button" class="qhelp">How to play</button>.</p></section>`;
function rulesHTML(){return `<h3>The idea</h3><ul>
  <li>Five flags, one at a time. Each one is shown as a pie chart: its colours and how much of the flag each one covers, coat of arms and all. Name the country.</li>
  <li>Only the ${SOV.length} independent countries, never territories.</li></ul>
  <h3>The clues</h3><ul>
  <li><b>1 The pie</b>: always open.</li>
  <li><b>2 The design</b>: stripes, and whether it has a star, a moon, a sun, a cross, a coat of arms…</li>
  <li><b>3 On the map</b>: the continent and its coast or neighbours.</li>
  <li><b>4 People and capital</b>: the population and the capital's first letter.</li>
  <li><b>5 The flag, blurred</b>.</li>
  <li>A wrong answer opens the next clue. You can also tap <b>Next clue</b>.</li></ul>
  <h3>Points</h3><ul>
  <li>Right with the pie alone: <b>5 points</b>. With 2 clues: 4. With 3: 3. With 4: 2. With all 5: 1.</li>
  <li>A wrong answer with all five clues open, or <b>I don't know</b>, lets the flag go with 0.</li>
  <li>Best game: ${MAX} points. <b>Give up</b> ends the game as it stands.</li>
  <li>Some flags have the same pie (France, the Netherlands and Russia, for example). Any of them counts as right.</li></ul>
  <h3>How the pie is measured</h3><ul>
  <li>Each flag is drawn in its official shape and every pixel is counted (1.500 across), so the percentages are exact to one decimal.</li>
  <li>Shades that look the same are one slice, and specks under 0,5 % join the closest colour.</li></ul>
  <h3>How to answer</h3><ul>
  <li>Tap <b>Type a country…</b>, start typing and tap the country in the list.</li>
  <li>Names are in English. Accents, capitals and spaces don't matter. Each country has one name only, the one shown in the list as you type (United Kingdom, not UK).</li></ul>
  <h3>Modes</h3><ul>
  <li><b>Today's flags</b>: five flags, the same for everyone, new every day at midnight CET. One try. Missed a day? Play it in <b>Menu → Archive</b>.</li>
  <li><b>Solo</b>: five random flags, as many games as you like. <b>Easy</b>: well-known countries, no two pies alike. <b>Hard</b>: every flag.</li>
  <li><b>With friends</b>: coming soon.</li></ul>`}
function creditsHTML(){return DATA_CREDITS.replace('</ul>',`<li>Flag Pie: the flags in their official shapes from <a href="https://github.com/hjnilsson/country-flags" target="_blank" rel="noopener">hjnilsson/country-flags</a> (from Wikimedia Commons, public domain), measured pixel by pixel in November 2026.</li></ul>`)}

/* ---- home: today's flags on top, then Solo and With friends, as in the other games ---- */
let view='home';
const dateLabel=k=>new Date(k+'T12:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
function homeHTML(){const key=todayKey();
  if(!D||D.mode!=='daily'||D.date!==key)D=dailyGame();
  const h=load('fp-hist',{});let daily;
  if(D.over)daily=`<button class="hcard" id="daily"><span class="hm">Flag Pie #${D.num} · done</span><span class="dsum">${squaresHTML(D)}<span class="dtxt"><span class="ht">${pointsOf(D)} points</span><span class="hs">${rightOf(D)} of 5 named</span></span>${dstatsHTML(streakOf(h),Object.keys(h).length,fpAverage())}</span><span class="hs">Tap to see the flags and share your result.</span><span class="hm">Next flags in ${nextIn()}</span></button>`;
  else{const started=D.qs.some(q=>q.st!=='play'||q.k>1||q.tries.length);
    daily=`<button class="hcard ac" id="daily"><span class="hm">#${D.num} · ${dateLabel(key)}</span><span class="ht">Today's flags</span><span class="hs">${started?'You started: '+pointsOf(D)+' points so far. Tap to carry on.':'Five flags, the same for everyone, one try. Tap to guess whose colours these are.'}</span>
      <span class="hpie" aria-hidden="true">${D.qs.map(q=>q.st==='play'?pieSVG(q.c):`<img src="${realFlag(q.c)}" alt="" style="width:52px;height:auto;align-self:center;border-radius:3px">`).join('')}</span></button>`}
  const st=Geomingo.streak(),p=D.over?pointsOf(D):0;
  const hello=D.over?Geomingo.hello(p?'happy':'sad',p?'Stamped for today.'+(st>1?' '+st+'-day streak.':''):'Rough crossing today.',"Today's flags are done. Next ones in "+nextIn()+'.')
    :Geomingo.hello('pass','GeoPass ready.','Five flags cut into their colours. Every one you name is a stamp.');
  return header('Flag Pie','')+`<section class="home">${hello}${Geomingo.account.userHTML()}${daily}${D.over?rankingHTML():''}
    <div class="hrow"><button class="hcard" data-go="train"><span class="ht">Solo</span><span class="hs">Practice on unlimited flags, at your pace.</span></button>
    <div class="hcard soon" aria-disabled="true"><span class="ht">With friends</span><span class="hs">Play online, 2 to 6 players. (coming soon)</span></div></div></section>${quickRules()}`}
function goHome(){view='home';toastMsg=null;drawToast();query='';typing=false;render();window.scrollTo(0,0)}
function render(){
  if(!TESTDAY&&(view==='home'||view==='daily'&&D&&D.mode==='daily')){const g=dailyGame();if(!g.over)Geomingo.clock.start('flagpie',todayKey())}
  if(D&&D.mode==='daily')watchResult('fp:'+D.date,D.over&&D.left==null);
  if(view==='train')app.innerHTML=trainHTML();
  else if(view==='solo')app.innerHTML=soloHTML();
  else if(view==='archive')app.innerHTML=archiveView();
  else if(view==='daily')app.innerHTML=dailyHTML();
  else app.innerHTML=homeHTML();
  bind()}
function bind(){
  if(!$('askbtn'))closeSheet();
  if(view==='train')bindGiveUp(()=>{if(!T||T.over)return;T.qs.forEach(q=>{if(q.st==='play')q.st='wrong'});T.over=true;T.left=null;trainEnd();render();window.scrollTo(0,0)});
  else bindGiveUp(()=>{if(!D||D.over)return;D.qs.forEach(q=>{if(q.st==='play')q.st='wrong'});D.over=true;D.left=null;query='';typing=false;dailySave();render();window.scrollTo(0,0)});
  if($('home'))$('home').onclick=goHome;
  app.querySelectorAll('[data-go="train"]').forEach(b=>b.onclick=openSolo);
  if($('playsolo'))$('playsolo').onclick=openSolo;
  if($('soloback'))$('soloback').onclick=openSolo;
  if($('archback'))$('archback').onclick=openArchive;
  if($('start'))$('start').onclick=openTrain;
  if($('tagain'))$('tagain').onclick=openTrain;
  if($('daily'))$('daily').onclick=openDaily;
  if($('copy'))$('copy').onclick=()=>share(dailyShare(D));
  app.querySelectorAll('[data-arch]').forEach(b=>b.onclick=()=>playArchive(b.dataset.arch));
  const G=view==='train'?T:view==='daily'?D:null;
  app.querySelectorAll('[data-tv]').forEach(b=>b.onclick=()=>{const q=G&&G.qs[+b.dataset.tv];if(q&&q.st!=='play')toast(cByCode[q.c].n+(q.st==='right'?' · +'+worth(q):''))});
  if($('nextclue'))$('nextclue').onclick=view==='train'?trainNextClue:dailyNextClue;
  if($('nexttv'))$('nexttv').onclick=()=>view==='train'?nextFlag(T):nextFlag(D,dailySave);
  app.querySelectorAll('[data-seg="diff"]').forEach(b=>b.onclick=()=>{store('fp-diff',b.dataset.v);render()});
  if(view==='train'&&T&&!T.over)bindAnswer(T,trainPick);
  else if(view==='daily'&&D&&!D.over)bindAnswer(D,dailyPick)}
render();
// a new day while the page was in the background: today's new flags
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(view==='home'||view==='daily'&&D&&D.mode==='daily'&&D.date!==todayKey()){D=null;if(view==='daily')openDaily();else render()}});
</script>
</body>
</html>
