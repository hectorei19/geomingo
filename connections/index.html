<script>
/* ---- the puzzle ----
   Four hidden categories from Countries' CATS, four countries each. Every country fits its own category and
   none of the other three, so there is only one way to split the 16 into groups.
   Difficulty (t): 0 well-known themes … 3 the trickiest (names and capitals, and from version 5 also history, politics and sport).
   Until 17 Nov 2026 the colour showed the difficulty: yellow, green, blue, purple. Since COLOUR_FROM each game gives the four
   colours to the four groups in a random order made from its seed (g.c), so the colour no longer gives the easy group away. */
const CX_FIRST='2026-10-19',MAX_MISTAKES=5;
const TEMOJI=['🟨','🟩','🟦','🟪'],COLOUR_FROM='2026-11-18';
// a group's colour: g.c in games made since COLOUR_FROM, the difficulty in older saved games
const gcol=g=>g.c==null?g.t:g.c;
const TIER_OF={region:0,lang:0,money:0,pol:0,flagc:1,flags:1,sea:1,border:1,sport:1,hist:1,geo2:1,geo:2,people:2,dev:2,geo3:2,sport2:2,pol2:2,misc:2,name:3,cap:3};
const TIER0=new Set(['Landlocked','Island nation (no land borders)']);
const SKIP=new Set(['Is a territory (not independent)']);
// independent countries only: territories never appear
const SOV=C.filter(c=>!c.t).map(c=>c.i);
// everything below that depends on which countries are in a category is worked out by prepRule(), once for each
// neighbour rule (see neighbourRule in shared/data.js): dailies before NB_FROM (versions 1-3) keep the old count
let POOLS,CHECKED,CHECKED_OF,POOLS2,MEMBERS,GAME,GAME_OF,POOLS3,NARROW;
function poolsNow(){const P=[[],[],[],[]];
  CATS.forEach(k=>{if(k.v7||SKIP.has(k.label))return;const t=TIER0.has(k.label)?0:TIER_OF[k.fam];if(t==null)return;
    if(SOV.filter(i=>k.set[i]).length>=4)P[t].push(k)});return P}
function buildPuzzleV1(seed){const r=rngFrom(seed);
  for(let a=0;a<3000;a++){
    const ks=POOLS.map(p=>p[Math.floor(r()*p.length)]);
    if(new Set(ks.map(k=>k.fam)).size<4)continue;
    const groups=[];
    for(let g=0;g<4;g++){const ex=SOV.filter(i=>ks[g].set[i]&&ks.every((k,h)=>h===g||!k.set[i]));
      if(ex.length<4)break;
      // better-known countries (1 million people or more) when the category has enough of them
      const big=ex.filter(i=>(DATA.pop[C[i].c]||0)>=1e6);
      groups.push({k:ks[g].id,t:g,m:shuffle(big.length>=4?big:ex,r).slice(0,4).map(i=>C[i].c)})}
    if(groups.length===4)return {seed,groups,order:shuffle(groups.flatMap(g=>g.m),r)}}
  return null}
// Since 2026-10-25: no other four of the 16 share a category, so the only set of four that works is a real group.
// Every category of up to 40 countries is checked, plus three broad ones players reach for first (Africa, Europe, landlocked);
// broader ones (flag has blue…) cannot all be avoided, so a guess that shares one is explained instead (see submit).
// Groups come only from those checked categories. Daily puzzles before that day keep the old way, so they stay as they were.
const STRICT_FROM='2026-10-25',CHECK_MAX=40,CHECK_ALSO=new Set(['Landlocked','In Africa','In Europe']);
const sizeOf=k=>SOV.filter(i=>k.set[i]).length;
const isBig=i=>(DATA.pop[C[i].c]||0)>=1e6;
// fill the 16 one country at a time (better-known countries first), never letting a category outside the puzzle reach four
// (of: each country's checked categories; tries: how many fills to attempt)
function pickClean(ks,ex,r,of=CHECKED_OF,tries=6){
  const own=new Set(ks.map(k=>k.id)),big=ex.map(e=>e.filter(isBig)),small=ex.map(e=>e.filter(i=>!isBig(i)));
  for(let b=0;b<tries;b++){const cnt=new Uint8Array(CATS.length),ms=[[],[],[],[]];
    const cand=ex.map((e,g)=>[...shuffle(big[g],r),...shuffle(small[g],r)]);
    let ok=true;
    for(let n=0;n<4&&ok;n++)for(let g=0;g<4&&ok;g++){
      const pick=cand[g].find(i=>!ms[g].includes(i)&&of.get(i).every(k=>own.has(k.id)||cnt[k.id]<3));
      if(pick==null){ok=false;break}
      ms[g].push(pick);of.get(pick).forEach(k=>cnt[k.id]++)}
    if(ok)return ms}
  return null}
function buildClean(seed,pools,of,attempts,tries){
  const r=rngFrom(seed);
  for(let a=0;a<attempts;a++){
    const ks=pools.map(p=>p[Math.floor(r()*p.length)]);
    if(new Set(ks.map(k=>k.fam)).size<4)continue;
    const ex=ks.map((kg,g)=>MEMBERS.get(kg).filter(i=>ks.every((k,h)=>h===g||!k.set[i])));
    if(ex.some(e=>e.length<4))continue;
    const ms=pickClean(ks,ex,r,of,tries);if(!ms)continue;
    const groups=ms.map((m,g)=>({k:ks[g].id,t:g,m:m.map(i=>C[i].c)}));
    return {seed,groups,order:shuffle(groups.flatMap(g=>g.m),r)}}
  return null}
// Since 2026-10-26 (version 3): the game only knows GAME, every category of up to 40 countries plus the continents and
// landlocked. The 25 broad ones (flag has blue, centre in the tropics, capital over 1 million…) are left out: among
// 16 countries four of them always share one, so they could never be kept apart. No four of the 16 share a GAME
// category except the four groups, so there is exactly one solution and no other four to explain.
const UNIQUE_FROM='2026-10-26';
const RULES={};
function prepRule(old){neighbourRule(old);const key=old?'old':'new';
  const R=RULES[key]||(RULES[key]=(()=>{const P=poolsNow();
    const CK=CATS.filter(k=>!k.v7&&!SKIP.has(k.label)&&(sizeOf(k)<=CHECK_MAX||CHECK_ALSO.has(k.label)));
    const GM=CATS.filter(k=>!k.v7&&!SKIP.has(k.label)&&(sizeOf(k)<=CHECK_MAX||CHECK_ALSO.has(k.label)||k.label==='In Asia'));
    return {POOLS:P,CHECKED:CK,CHECKED_OF:new Map(SOV.map(i=>[i,CK.filter(k=>k.set[i])])),
      POOLS2:P.map(p=>p.filter(k=>sizeOf(k)<=CHECK_MAX||k.label==='Landlocked')),
      MEMBERS:new Map(CATS.map(k=>[k,SOV.filter(i=>k.set[i])])),GAME:GM,GAME_OF:new Map(SOV.map(i=>[i,GM.filter(k=>k.set[i])])),
      POOLS3:P.map(p=>p.filter(k=>GM.includes(k))),NARROW:CATS.filter(k=>!k.v7&&!SKIP.has(k.label)).sort((a,b)=>sizeOf(a)-sizeOf(b))}})());
  ({POOLS,CHECKED,CHECKED_OF,POOLS2,MEMBERS,GAME,GAME_OF,POOLS3,NARROW}=R)}
prepRule(false);
/* ---- version 7 (dailies from EASY_FROM, and every Solo / With friends puzzle): easier, better-known categories ----
   Players found Connections too hard. Version 7 only uses categories most people know or can see on the flag, plus a
   few new ones made from lists the database already has (no new data). Yellow is always one of the easiest. The
   obscure ones (highest point, forest, coastline, corruption, HDI, median age…) no longer make groups. As before, no
   other four of the 16 share any category the game knows, so there is exactly one solution.
   The new categories are only for version 7 (k.v7): older puzzles and archive days stay exactly as they were. */
const EASY_FROM='2026-11-15';
const inCat=(label,c)=>{const k=CATS.find(x=>x.label===label);return !!(k&&k.set[c.i])};
const addV7=(fam,label,test,desc)=>{const k={id:CATS.length,fam,label,test,v7:1,desc,short:label};CATS.push(k);
  k.setNew=C.map(c=>!!test(c));k.setOld=k.setNew;k.set=k.setNew;k.count=k.set.filter(Boolean).length;return k};
addV7('flag7','Flag is only red and white',c=>inCat('Flag of exactly 2 colours',c)&&!inCat('No red on the flag',c)
  &&!['Flag has blue','Flag has green','Flag has yellow or gold','Flag has black','Flag has orange'].some(l=>inCat(l,c)),
  'The flag uses only red (or dark red) and white, like Japan, Poland, Canada or Switzerland.');
addV7('mon7','Monarchy in Europe',c=>c.r==='EU'&&inCat('Monarchy',c),
  'A European country whose head of state is a monarch: a king, queen, grand duke, prince or the Pope (Andorra\'s co-princes count).');
addV7('mon7','Monarchy in Asia',c=>c.r==='AS'&&inCat('Monarchy',c),
  'An Asian country whose head of state is a monarch: a king, emperor, emir or sultan.');
addV7('cw7','Commonwealth member in Africa',c=>c.r==='AF'&&inCat('Commonwealth member',c),
  'An African member of the Commonwealth of Nations, like Kenya, Nigeria or South Africa.');
addV7('name7','Name has North, South or Central',c=>/\b(North|South|East|West|Central)\b/.test(c.n),
  'The country name contains a direction word: North, South, East, West or Central.');
addV7('name7','Name contains "Guinea"',c=>/Guinea/.test(c.n),'The country name contains the word "Guinea".');
addV7('name7','Name starts with Saint or San',c=>/^(Saint|San|São) /.test(c.n),'The country name starts with Saint, San or São.');
// the categories version 7 uses: yellow (the easiest) and the rest, by label
const EASY0=new Set(['In Europe','In Africa','In Asia','In South America','In Oceania','In North or Central America',
  'Flag is only red and white','Name contains "Guinea"','Name has North, South or Central','Name ends in "-stan"',
  'Uses the euro','Island nation (no land borders)','Landlocked','Flag has the Union Jack',
  'Official language: Spanish','Official language: French','Official language: Portuguese']);
const EASY=new Set([...EASY0,
  ...CATS.filter(k=>/^Borders |^Coast on /.test(k.label)).map(k=>k.label),
  'EU member','NATO member','Arab League member','ASEAN member','Former Soviet republic','OPEC member','G20 member',
  'Has nuclear weapons','Monarchy in Europe','Monarchy in Asia','Commonwealth member in Africa',
  'Flag has a cross','Flag has a crescent moon','Flag has a sun','Flag has an animal','Flag has a coat of arms or seal',
  'Flag has orange','Flag of exactly 2 colours','Official language: Arabic','Currency called "dollar"',
  'Hosted the men\'s World Cup','Won the men\'s World Cup','Hosted the Summer Olympics','Hosted the Winter Olympics',
  'Hosts a Formula 1 race (2026)','500+ Olympic medals','Population over 100 million','Population over 50 million',
  'Population under 100,000','Area over 2 million km²','Area over 1 million km²','Area under 1,000 km²',
  'Crossed by the Equator',...CATS.filter(k=>/^Name starts with [A-Z]$/.test(k.label)).map(k=>k.label),
  'Name ends in "-ia"','Name ends in "-land"','Name starts with Saint or San','Name of 2+ words','Name contains Z',
  'Name has 5 letters or fewer','Starts and ends with the same letter','Capital starts with same letter','Capital name has 2+ words']);
// colours: yellow = EASY0; green = flags, seas, borders, languages; blue = politics, size, people, sport; purple = names, capitals
const TIER7={flagc:1,flags:1,flag7:1,sea:1,border:1,lang:1,money:1,region:1,geo:2,geo2:2,pol:2,pol2:2,mon7:2,cw7:2,people:2,sport:2,sport2:2,name:3,name7:3,cap:3};
// the categories checked for "no other four share one": everything the game knows (old GAME) plus the new ones
const CHECK7=[...GAME,...CATS.filter(k=>k.v7)],CHECK7_OF=new Map(SOV.map(i=>[i,CHECK7.filter(k=>k.set[i])]));
CATS.filter(k=>k.v7).forEach(k=>MEMBERS.set(k,SOV.filter(i=>k.set[i])));
function pools7(){const P=[{},{},{},{}];
  CATS.forEach(k=>{if(!EASY.has(k.label)||CX_AVOID&&CX_AVOID.has(k.label))return;if(SOV.filter(i=>k.set[i]).length<4)return;
    const t=EASY0.has(k.label)?0:TIER7[k.fam];if(t==null)return;(P[t][k.fam]||(P[t][k.fam]=[])).push(k)});
  return P.map(t=>Object.values(t))}
function buildPuzzle7(seed){const P=pools7();
  for(let s=0;s<200;s++){const r=rngFrom(((seed+s*104729)>>>0)^0x7ea5e),pick=t=>P[t][Math.floor(r()*P[t].length)];
    const p=buildClean((seed+s*7919)>>>0,[pick(0),pick(1),pick(2),pick(3)],CHECK7_OF,250,6);if(p)return {...p,seed}}
  return null}
// ver: 1 (dailies before 2026-10-25), 2 (the daily of 2026-10-25), 3 (dailies 2026-10-26 to NB_FROM) or 4 (everything
// since: the same puzzle maker as 3 with today's neighbour rule)
// Since VARY_FROM (version 5): the same puzzle maker as 4, but each colour first draws one family of categories
// (continents, languages, flags, seas, names…), all families equally likely, and then a category of that family.
// The purple group is no longer always about names or capitals: it shares that colour with history, politics and
// sport trivia. Before, every day had a "name/capital starts with…" group and almost every day a continent group.
const VARY_FROM='2026-11-12';
const TIER5={region:0,lang:0,money:0,pol:0,flagc:1,flags:1,sea:1,border:1,sport:1,geo2:1,geo:2,people:2,dev:2,geo3:2,misc:2,name:3,cap:3,hist:3,pol2:3,sport2:3};
let POOLS5=null;
// CX_AVOID (labels) is only used when making the fixed daily list (see daily.js): categories used too recently or too often
let CX_AVOID=null;
function pools5(){if(POOLS5&&!CX_AVOID)return POOLS5;const P=[{},{},{},{}];

// my progress, for the others' screens: groups found, mistakes, finished, and the colour rows of my guesses
function pushProgress(){if(!roomRef||!S||S.mode!=='online'||S.code!==roomCode)return;
  if(TT){const p={r:S.round,f:TT.ok[ME]||0,s:TT.sc[ME]||0,m:0,done:S.over,won:S.over,on:true},sig=roomCode+JSON.stringify(p);
    if(sig!==pushProgress.sig){pushProgress.sig=sig;roomRef.child('players/'+ME).update(p).catch(()=>{pushProgress.sig=''})}return}
  const p={r:S.round,f:S.found.length,m:S.mistakes,done:S.over,won:S.won,on:true};if(S.over)p.ms=S.ms||0;
  roomRef.child('players/'+ME).update(p).catch(()=>{})}
// the host starts the first game; after a game anyone can start the next one once everyone has finished
async function startRound(){if(!roomRef||!room)return;
  let seed;do{seed=Math.floor(Math.random()*1e9)}while(!buildPuzzle(seed,5));
  const round=(room.round||0)+1;
  try{await roomRef.transaction(x=>{if(!x)return x;if((x.round||0)>=round)return;
    x.status='play';x.round=round;x.seed=seed;x.startAt=now();
    // turns (Héctor 2026-11-21): the players here now, a random one starts, 30 s a turn
    const ord=lobbyOrder(x).filter(k=>x.players[k].on!==false);x.order=ord;x.turn=Math.floor(Math.random()*ord.length);x.mv=null;x.tEnd=x.startAt+TURN_MS+1000;
    return x},undefined,false)}  // false: not shown here before the server agrees (a progress write meanwhile would cancel the start)
  catch(e){toast('Could not start the game. Check the connection.','bad')}}
const roomPlayers=()=>lobbyOrder(room).map((pid,i)=>{const p=room.players[pid];return {pid,i,...p,cur:p.r===room.round}});
const fmtTime=ms=>{const s=Math.round((ms||0)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
// most points first (25 a group, -10 a mistake, +20 with none: the same table as every game), then the faster solve
const rankKey=p=>!p.cur?[1,0,0]:[0,-Geomingo.cxPts(p.done&&p.won?4:p.f||0,p.m||0),p.done&&p.won?p.ms||0:1e12];
function ranked(){return roomPlayers().sort((a,b)=>{const x=rankKey(a),y=rankKey(b);for(let i=0;i<3;i++)if(x[i]!==y[i])return x[i]-y[i];return 0})}
function scoresHTML(){return `<div class="scores" aria-label="Players">${roomPlayers().map(p=>`<span class="chip${p.cur&&p.done?' done':''}${p.on===false?' off':''}"><span class="pin" style="${pinStyle(p.i)}"></span>${esc(p.name)}<small>${!p.cur?'joining':p.done?(p.won?'✓ '+fmtTime(p.ms):(p.f||0)+'/4 ✗'):(p.f||0)+'/4 · '+(p.m||0)+' ✗'}</small></span>`).join('')}</div>`}
// the room's own screen (../brand/party.js) shows the players and the code: this game shows only its header there
function lobbyHTML(){return header('Connec<span>tions</span>','')}
function friendsHTML(){return header('Connec<span>tions</span>','')}

/* ---- moves ---- */
function tap(c){if(!S||S.over||turning)return;if(TT&&!myTurn())return;const i=sel.indexOf(c);
  if(i>=0)sel.splice(i,1);else if(sel.length<4)sel.push(c);render()}
// Mingo's key for the game on screen (his bubble and the summary belong to one game)
const cxKey=()=>S?S.mode+':'+(S.date||S.seed)+':'+(S.code||'')+':'+(S.round||''):'';
// with friends there are no lives: you play until the four groups are found, and only the mistakes are counted
const leftTxt=()=>{if(S.mode==='online'||S.nolives)return 'Keep going.';const l=MAX_MISTAKES-S.mistakes;return l+' li'+(l===1?'fe':'ves')+' left.'};
function submit(){if(!S||S.over||turning||sel.length!==4)return;
  const key=sel.slice().sort().join();
  if(S.guesses.some(g=>g.slice().sort().join()===key)){say(cxKey(),'think','Hold on.','You already tried these four. Swap one.');render();return}
  const gs=sel.map(c=>groupOf(S,c)),counts={};gs.forEach(g=>counts[g]=(counts[g]||0)+1);
  const best=Math.max(...Object.values(counts));
  // four that really share something, but not one of the groups: explain it and don't count a mistake
  const other=best<4&&sharedCategory(S,sel);
  if(other){say(cxKey(),'think','Not a group.',`All four fit "${other.label}", but that is not one of this puzzle's groups. No mistake counted.`);render();return}
  S.guesses.push(sel.slice());
  if(best===4){const g=gs[0],picked=sel.slice();S.found.push(g);S.left=S.left.filter(c=>!picked.includes(c));sel=[];
    if(S.found.length===4){S.over=true;S.won=true}
    const left=4-S.found.length;
    Geomingo.stamp('connections',CATS[S.groups[g].k].label);
    say(cxKey(),'happy','Stamped: '+CATS[S.groups[g].k].label+'.',left?left+' group'+(left===1?'':'s')+' to go.':'All four groups found.');
    save();turnOver(picked,gcol(S.groups[g]),()=>{popped=S.groups[g];render();popped=null});return}
  S.mistakes++;
  if(S.mode!=='online'&&!S.nolives&&S.mistakes>=MAX_MISTAKES){S.over=true;S.won=false;sel=[];save();render();return}
  if(best===3)say(cxKey(),'think','One away.','Three of these four belong together. '+leftTxt());
  else say(cxKey(),'sad','Denied entry.',"That's not a group. "+leftTxt());
  save();render(true)}

// the four tiles of a group just found turn over to show their flags in the group's colour, then the bar replaces them
let turning=false;
function turnOver(cs,t,done){const els=cs.map(c=>app.querySelector(`.cx-grid [data-c="${c}"]`)).filter(Boolean);
  if(els.length!==4||matchMedia('(prefers-reduced-motion:reduce)').matches){done();return}
  turning=true;els.forEach(e=>{e.classList.remove('on');e.classList.add('turn')});
  setTimeout(()=>{els.forEach(e=>{const c=e.dataset.c;e.innerHTML=`${flag32(c,"tfl")}<span class="tn">${esc(byCode[c].n)}</span>`;
    e.classList.remove('turn');e.classList.add('flipped','g'+t)})},230);
  setTimeout(()=>{turning=false;done()},1100)}

/* ---- share ---- */

// Mingo's verdict, for the result panel

  if(S.mode==='free'){const st=load('cx-solo',{n:0}),m=S.mistakes;
    return `${Geomingo.soloTicket({id:'connections',what:S.nolives?'Unlimited':MAX_MISTAKES+' lives',score:S.found.length+' of 4',best:'Solved '+(st.w||0)+' of '+(st.n||0),detail:m+' mistake'+(m===1?'':'s'),body})}<pre class="sharebox" id="share" hidden>${esc(shareText())}</pre>
    <div class="gm-done-btns gm-solo-btns"><button class="primary" id="again" style="flex:1">New puzzle</button>${SHARE_BTN.replace('Share result','Share')}</div>`}
  return `<section class="panel">${Geomingo.hello(v.pose,v.t,v.s,{key:'res'})}<span class="label">${S.mode==='daily'?'Connections #'+S.num:S.mode==='archive'?'Archive · Connections '+Geomingo.archNo(S.num):'Practice puzzle'}</span><p class="big">${S.found.length} of 4</p>
    <p class="hint">${S.won?(S.mistakes?`All four groups, ${S.mistakes} mistake${S.mistakes===1?'':'s'}.`:'All four groups, not a single mistake.'):`You found ${S.found.length} of 4 groups.`} ${S.mode==='daily'?`Next puzzle in ${nextIn()}.`:S.mode==='archive'?"Archive games don't count for the ranking or your streak.":''}</p>
    <pre class="sharebox" id="share">${esc(shareText())}</pre>
    ${S.mode==='daily'?`${SHARE_BTN}<div class="row-btns sharerow">${nextGameBtn('connections')}</div>
    <button class="ghost" id="playsolo">Practice</button>${allPlayedHTML('connections')}`
    :S.mode==='archive'?`${SHARE_BTN}<div class="row-btns sharerow"><button class="primary" id="archback" style="flex:1">Back to archive</button></div>`
    :`${SHARE_BTN}<div class="row-btns sharerow"><button class="ghost" id="again" style="flex:1">New puzzle</button></div>`}
    ${S.mode==='daily'?`<span class="label">Your daily puzzles</span>${statsHTML()}`:''}</section>${S.mode==='daily'?rankingHTML():''}`}
// today's ranking (signed-in players, first try of the day): groups found, then fewer mistakes, then who finished first
const rankingHTML=()=>Geomingo.account.rankingHTML('connections',{what:'puzzle',score:r=>[EU(Geomingo.rowKm('connections',r,todayKey()))+' km',r.s+'/4'+(r.s>=4&&!r.m&&!r.h?' +20':'')],how:'25 km a group, −10 km a mistake or hint'+(todayKey()>='2026-11-19'?' (each group found keeps at least 10 km)':'')+'; +20 km with no mistakes.'});
// signed in or out, today's result arrived from another device, the ranking moved: show it (not while typing)
Geomingo.account.onChange((why,typing)=>{if(why==='adopt'&&S&&S.mode==='daily'){const d=dailySaved();if(d){S=d;sel=[];liveKey=''}}
  if(!typing&&(view==='home'||view==='game'&&S&&S.over))render()});
// the room's ranking, live while the others finish; the next game starts when everyone still here is done
function roomResultHTML(){const list=ranked(),cur=list.filter(p=>p.cur),pos=cur.findIndex(p=>p.pid===ME)+1;
  const waiting=cur.some(p=>!p.done&&p.on!==false);
  if(S.over&&!waiting&&Geomingo.party)Geomingo.party.result(cur.map(p=>({n:p.name,p:Geomingo.cxPts(p.done&&p.won?4:p.f||0,p.m||0)})));
  if(S.over&&!waiting)logFriends('cx-friends',roomCode+':'+S.round+':'+(room.startAt||''),pos,S.found.length,S.won?S.ms:0);
  const head=S.won?(pos===1&&!waiting?'You win!':`Solved in ${fmtTime(S.ms)}`):'Better luck next time';
  return `<section class="panel">${Geomingo.hello(S.won?'happy':'sad',S.won?(pos===1&&!waiting?'You win. First to arrive.':'Solved. Now wait for the others.'):'So close.',waiting?'Some players are still playing.':'Everyone has finished.',{key:'res'})}<span class="label">Room ${roomCode} · game ${S.round}</span><p class="big">${head}</p>
    <div class="players">${list.map((p,k)=>`<div class="lp${p.pid===ME?' me':''}${p.on===false?' off':''}"><span class="rk">${p.cur?k+1:''}</span><span class="pin" style="${pinStyle(p.i)}"></span>${esc(p.name)}<span class="tag">${!p.cur?'joining':p.done?(p.won?`${Geomingo.cxPts(4,p.m||0)} points · ${p.m||0} mistake${p.m===1?'':'s'} · ${fmtTime(p.ms)}`:`${Geomingo.cxPts(p.f||0,p.m||0)} points · ${p.f||0} of 4 groups`):p.on===false?'left':'playing…'}</span></div>`).join('')}</div>
    <pre class="sharebox" id="share">${esc(shareText())}</pre>
    ${SHARE_BTN}<div class="row-btns sharerow"><button class="primary" id="rematch" style="flex:1" ${waiting?'disabled':''}>${waiting?'Waiting for the others…':'Play again'}</button></div>
  </section>`}
// the one room for all nine games (../brand/party.js) drives this game's room
if(Geomingo.party)Geomingo.party.game({turns:()=>movesOf(room).length,points:()=>room?roomPlayers().filter(p=>p.cur).map(p=>({n:p.name,p:Geomingo.cxPts(p.done&&p.won?4:p.f||0,p.m||0)})):[],room:()=>roomCode,host:()=>!!room&&room.host===ME,lobby:()=>!!room&&room.status==='lobby',
  count:()=>room?lobbyOrder(room).length:0,names:()=>room?lobbyOrder(room).map(k=>room.players[k].name):[],create:createRoom,join:joinRoom,start:startRound});
function rulesHTML(){return `<h3>The idea</h3><ul>
  <li>16 countries make <b>four groups of four</b>. Each group shares something, for example "Uses the euro".</li>
  <li>There is only one way to split them. Broad things (a flag colour…) are never a group, so four blue flags are a trap.</li>
  <li>Tap <span class="ib">i</span> on a found group to see what it means.</li></ul>
  <h3>How to play</h3><ul>
  <li>Tap four countries, then <b>Submit</b>.</li>
  <li>Wrong: you lose one of your <b>${MAX_MISTAKES} lives</b>. "One away" means three of the four belong together.</li>
  <li><b>Shuffle</b> moves the countries. Stuck? <b>Show a category</b> gives one group name, easiest first. Each one costs 10 km (10 points in Practice).</li>
  <li>The game ends when you find all four groups or run out of lives. <b>Give up</b> ends it early.</li></ul>
  <h3>Points</h3><ul>
  <li>25 for every group: all four, 100. Every mistake: 10 less.</li>
  <li>Every category shown: 10 less.</li>
  <li>Every group you find is always worth <b>at least 10</b>, however many mistakes or categories.</li>
  <li><b>Perfect game</b> (all four, no mistake, no category shown): +20.</li></ul>
  <h3>Modes</h3><ul>
  <li><b>Daily</b>: one puzzle, the same for everyone, new every day at midnight CET. One try. Your points are your km for the GeoPass.</li>
  <li><b>Practice</b>: a random one with the daily rules (never today's), as many as you like. 5 lives or <b>Unlimited</b>: pick it next to Practice on the home page. Points only, no km.</li>
  <li><b>With friends</b>: create a room on the home page and share its code. One room for all nine games, 2 to 6 players, each on their own phone. The host picks the game. No lives. One board for the whole room. You take turns, 30 s each, and a random player starts. Four that are a group: 25 points for you. Wrong or out of time: the next player goes, no points lost. After three full rounds with no group, one category is shown by itself. When three groups are found, the last one goes by itself. Most points win.</li>
  <li><b>Archive</b>: missed a day? <b>Menu → Archive</b>. One try each, and its km count for that day.</li></ul>`}
function bind(){
  Geomingo.where(view==='friends'||view==='room'||S&&S.mode==='online'&&view==='game'?'friends':view==='solo'||view==='game'&&S&&S.mode==='free'?'solo':''); // F5 keeps Practice / With friends
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>tap(b.dataset.c));
  app.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{openDaily();tap(b.dataset.dc)});
  if($('daily'))$('daily').onclick=openDaily;
  app.querySelectorAll('[data-go="free"]').forEach(b=>b.onclick=openSolo);
  if($('playsolo'))$('playsolo').onclick=openSolo;
  if($('soloback'))$('soloback').onclick=openSolo;
  if($('archback'))$('archback').onclick=toArchive;
  app.querySelectorAll('[data-arch]').forEach(b=>b.onclick=()=>playArchive(b.dataset.arch));
  if($('home'))$('home').onclick=toHub;
  app.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>{const k=CATS[+b.dataset.info];dialog(esc(EUT(k.label)),`<p>${esc(EUT(k.desc))}</p>`)});
  if($('rules'))$('rules').onclick=()=>dialog('How to play',rulesHTML());
  if($('shuf'))$('shuf').onclick=()=>{S.left=shuffle(S.left,Math.random);save();render()};
  if($('desel'))$('desel').onclick=()=>{sel=[];render()};
  if($('submit'))$('submit').onclick=TT&&S&&S.mode==='online'?submitTurn:submit;
  // give up: the game ends as it stands, the groups not found are shown
  bindGiveUp(()=>{if(!S||S.over||S.mode==='online')return;S.over=true;S.won=false;sel=[];
    say(cxKey(),'sad','Gave up.',`${S.found.length} of 4 groups found.`);save();render();window.scrollTo(0,0)});
  if($('hint'))$('hint').onclick=()=>{const n=hintsShown(),left=hintOrder().slice(n).filter(i=>!S.found.includes(i));if(!left.length)return;
    // skip groups already found: the next category shown is the easiest one still hidden
    S.hint=hintOrder().indexOf(left[0])+1;if(hintCosts())S.hc=(+S.hc||0)+1;save();render()};
  if($('copy'))$('copy').onclick=()=>share(shareMessage());
  if($('again'))$('again').onclick=()=>openFree(Math.floor(Math.random()*1e9));
  // With friends
  if($('rematch'))$('rematch').onclick=startRound;
  // leaving in the middle of a game asks first
  if($('leave'))$('leave').onclick=()=>{if(S&&S.mode==='online'&&!S.over&&!leaveArmed){leaveArmed=true;render();return}leaveRoom()};
}

/* ---- start: ?p=123 opens that practice puzzle; back into a room only inside the one room for all nine games (old ?room= and ?friends links go home, ../brand/party.js) ---- */
(()=>{const ak=Geomingo.askedDay(CX_FIRST);if(ak){openDay(ak);return}
  const p=TESTQ.get('p'),back=Geomingo.room.saved('cx-room'); // an old room is forgotten
  const clean=()=>{try{history.replaceState(null,'',location.pathname)}catch(e){}};
  if(p&&/^\d{1,10}$/.test(p)){openFree(+p);clean();return}
  if(back&&Geomingo.party&&Geomingo.party.on()&&initFB()){listenRoom(back,true);render();return}
  render()})();
// a new day while the page is open: show the new puzzle when you come back
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(roomCode&&room&&Geomingo.room.stale(cxDone(room))){leaveRoom(true);return}if(view==='home')render();else if(view==='game'&&mode==='daily'&&S&&S.date!==todayKey())openDaily()});
</script>
</body>
