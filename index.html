<style>
/* Home page: Sign in and Menu on top, today's games as colour tiles, Practice and With friends, then the GeoPass
   (km, level, today's stamps) and the ranking by km (today, this week, this month) */
.app{max-width:460px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
main{display:flex;flex-direction:column;gap:18px}
.gm-top .gm-logo{font-size:30px}
.gm-top .gm-acct{border-radius:22px;border-color:var(--gold);color:#F3D98B;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.gm-top .gm-acct.me{border-radius:50%;color:var(--on-coral);font-size:19px;letter-spacing:0}
.menubtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--page);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.menubtn svg{stroke:currentColor}
/* today's games: one colour per game */
.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;--ic:44px;--nm:19px}
.tiles li{display:flex;min-width:0}
.tile{flex:1;min-width:0;aspect-ratio:1;box-sizing:border-box;border-radius:16px;background:var(--c);color:#16202F;text-decoration:none;padding:12px;display:flex;flex-direction:column;gap:6px;overflow:hidden;box-shadow:0 12px 26px -14px var(--c);transition:transform .12s ease}
.tile:active{transform:scale(.98)}
.tile:focus-visible{outline:3px solid #F6F8F5;outline-offset:3px}
.tile .tt{display:flex;justify-content:space-between;gap:6px;font-family:var(--type);font-weight:700;font-size:12px;letter-spacing:.02em;white-space:nowrap}
.tile svg{display:block;flex:1 1 0;min-height:0;width:100%;height:100%;margin:2px 0}
.tile b{font-family:var(--display);font-weight:900;font-stretch:85%;font-size:var(--nm);line-height:1.05;text-transform:uppercase;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .s3{display:none;font-family:var(--type);font-weight:700;font-size:11px;white-space:nowrap}
.tile.ctr b,.tile.ctr small,.tile.ctr .s3{text-align:center}
.tile.ctr{gap:3px;padding-bottom:10px}
.tile.ctr small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(10px,3.1vw,12.5px);letter-spacing:-.01em}
.tile.ctr svg{margin:0 -4px 4px}
/* 3 per row: the same box as before, everything scaled to the box width (cqw) so it fits any phone */
.tiles.c3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.c3 li{container-type:inline-size}
.c3 .tile{padding:8cqw 7cqw;border-radius:14px;gap:2.5cqw}
.c3 .tile .tt{font-size:8.4cqw;letter-spacing:0;gap:2cqw}
.c3 .tile.ctr svg{margin:1cqw 0 1.5cqw}
.c3 .tile b{font-size:14cqw;font-stretch:72%}
.c3 .tile.ctr small{font-size:8.6cqw;letter-spacing:-.01em}
/* Practice and With friends under today's games; each opens a screen with the games (same tiles) */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button{min-height:84px;border-radius:14px;border:1.5px solid var(--gold);background:var(--cover);color:#F3D98B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:10px;cursor:pointer}
.two small{font-family:var(--body);font-weight:500;font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--muted)}
.pkhead{display:flex;flex-direction:column;gap:8px}
.pkhead .back{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--muted);font:700 16px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pkhead h2{margin:0;font-family:var(--display);font-weight:900;font-size:34px;text-transform:uppercase;line-height:1}
.pkhead p{margin:0;color:var(--muted);font-size:15px}
/* a game played today gets a passport stamp with Mingo in ink: round (Mingo with his passport) or
   rectangular (Mingo's head, VISITED and the date), tilted, picked per game and day */
.tile{position:relative}
.tile.done>svg{opacity:.45}
.stamp{position:absolute;left:50%;top:41%;transform:translate(-50%,-50%) rotate(var(--r,-12deg));display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:2.2px solid rgba(22,32,47,.85);color:rgba(22,32,47,.9);font-family:var(--type);font-weight:700;line-height:1.1;text-align:center;white-space:nowrap;pointer-events:none}
.stamp b,.c3 .tile .stamp b{font-family:var(--type);font-weight:700;font-stretch:100%;font-size:11cqw;letter-spacing:.08em;margin:0;line-height:1.1;text-transform:none}
.stamp i{font-style:normal;font-size:7cqw}
.tile .stamp .mingo{display:block;flex:none;margin:0}
.stamp .mg-body,.stamp .mg-deep,.stamp .mg-beak,.stamp .mg-tip,.stamp .mg-pass{fill:rgba(22,32,47,.88)}
.stamp .mg-neck,.stamp .mg-leg{stroke:rgba(22,32,47,.88)}
.stamp .mg-eye{fill:var(--c)}
.stamp .mg-eyel,.stamp .mg-gold{stroke:var(--c)}
.stamp.rect{flex-direction:row;gap:2cqw;padding:2cqw 3.5cqw 2cqw 2cqw;border-radius:6px;background:color-mix(in srgb,var(--c) 70%,transparent)}
.stamp.rect .mingo{width:20cqw;height:20cqw}
.stamp.rect span{display:flex;flex-direction:column;align-items:flex-start}
.stamp.round{width:52%;aspect-ratio:1;box-sizing:border-box;justify-content:flex-end;padding-bottom:3%;border-radius:50%;box-shadow:inset 0 0 0 3px var(--c),inset 0 0 0 4.2px rgba(22,32,47,.85);background:color-mix(in srgb,var(--c) 55%,transparent)}
.stamp.round .mingo{height:74%;width:auto;margin-bottom:2%}
.tile.off{filter:grayscale(1);opacity:.35;box-shadow:none}
.tile.soon{background:transparent;border:2px dashed #4A5570;color:var(--muted);box-shadow:none}
.tile.soon svg{stroke:currentColor}
/* the GeoPass card */
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hrow .gm-head{flex:1;min-width:0}
.hmingo{flex:none;display:flex;margin:-4px -4px -6px -8px}
.mypass{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 7px;border-radius:12px;border:1.5px solid var(--gold);background:linear-gradient(135deg,#2A2414,var(--page) 70%);color:#F3D98B;cursor:pointer;box-shadow:0 8px 22px -12px rgba(212,173,75,.8);text-align:left}
.mypass svg{width:22px;height:28px;flex:none}
.mypass span{display:flex;flex-direction:column;line-height:1.05}
.mypass small{font-family:var(--type);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#C9B37A}
.mypass b{font-family:var(--display);font-weight:900;font-size:17px;color:#F3D98B}
.mypass em{font-style:normal;font-family:var(--display);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#16202F;background:var(--gold);border-radius:4px;padding:1px 5px;margin-top:3px;align-self:flex-start}
.pass{border-radius:18px;background:linear-gradient(135deg,#2A2414,var(--page) 60%);border:1.5px solid var(--gold);padding:18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 16px 40px -22px rgba(212,173,75,.7)}
.pass .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pass .lab{font-family:var(--type);font-size:12px;letter-spacing:.1em;color:#F3D98B;text-transform:uppercase}
.lvl{font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.12em;color:#16202F;background:var(--gold);border-radius:6px;padding:3px 8px;text-transform:uppercase}
.pass .who{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer}
.pass .mi{display:block;font-family:var(--display);font-weight:900;font-size:40px;line-height:1;color:#F3D98B}
.pass .sub{font-size:14px;color:var(--ink)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.ladder{display:flex;justify-content:space-between;font-family:var(--type);font-size:11px;color:#C9CED6;margin-top:-4px}
.ladder b{color:#F3D98B}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px;border:2px dashed #4A5570;color:var(--muted);text-decoration:none;text-align:center;min-width:0}
.slot small{font-family:var(--type);font-weight:700;font-size:8.5px;text-transform:uppercase;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot b{font-family:var(--display);font-weight:900;font-size:17px;line-height:1}
.slot i{font-style:normal;font-size:10.5px;color:#C9CED6;line-height:1}
.slot.on{border:2.5px solid var(--c);color:var(--c);background:rgba(255,255,255,.05)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:1px solid #3A3A2A;border-radius:10px;padding:8px 6px;text-align:center;background:rgba(255,255,255,.03)}
.stat b{display:block;font-family:var(--display);font-weight:900;font-size:20px;color:#F3D98B;line-height:1}
.stat span{display:block;font-size:11.5px;color:#C9CED6;margin-top:4px;line-height:1.15}
.pass .km{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pass .km em{font-style:normal;font-size:15px;color:var(--ink)}
.pass .note{font-size:13px;color:#C9CED6;margin:0;line-height:1.35}
.pass .note b{color:#F3D98B}
.pass hr{border:0;height:1px;background:#3A3A2A;margin:0}
.pass .acct{font-size:14px;color:var(--ink);margin:0}
.gbtn{min-height:50px;border-radius:12px;border:0;background:#F6F8F5;color:#16202F;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--body);font-weight:700;font-size:16px;cursor:pointer}
.gbtn i{width:22px;height:22px;border-radius:50%;border:2px solid #2A56B8;color:#2A56B8;font-style:normal;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
/* a guest's box under Travel with friends: guest day N of 3 and the Google button */
.guest{border-radius:16px;background:var(--guil);border:1.5px solid var(--gold);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.guest[hidden]{display:none}
.guest .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.guest .lab{font-family:var(--type);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.guest .gdots{display:flex;gap:5px}.guest .gdots i{width:26px;height:7px;border-radius:4px;background:var(--line)}.guest .gdots i.on{background:var(--gold)}
.guest .acct{font-size:14px;line-height:1.45;color:var(--ink);margin:0}
/* Travel with friends, and this week's ranking */
.week{border-radius:16px;background:var(--guil);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.week h3{margin:0;font-family:var(--display);font-weight:900;font-size:18px;text-transform:uppercase}
.week ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.week li{display:flex;align-items:center;gap:12px;font-size:15px;min-height:34px}
.week .rk{width:22px;flex-shrink:0;text-align:center;font-family:var(--display);font-weight:900;color:#F3D98B}
.week .av{width:32px;height:32px;border-radius:50%;background:var(--c);color:#16202F;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.week .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week .pt{font-family:var(--type);font-weight:700}
.week li.me .nm{font-weight:700;color:#F3D98B}
.week li.gap{justify-content:center;color:var(--muted);min-height:0}
/* tap a name: the row opens with today's results, you vs them, game by game */
.week li[data-who]{cursor:pointer;border-radius:10px;padding:0 4px;margin:0 -4px;-webkit-tap-highlight-color:transparent}
.week li[data-who]:focus-visible{outline:2px solid #F3D98B}
.week li .chev{width:12px;flex-shrink:0;color:var(--muted);font-size:10px;text-align:center}
.week li.open{background:var(--page);border:1px solid #F3D98B;border-bottom:0;padding:6px 3px 2px;margin-top:-1px;border-radius:10px 10px 0 0}
.week li.open .chev{color:#F3D98B}
.week li.duel{display:block;min-height:0;margin:-8px -4px 0;padding:10px 9px 9px;background:var(--page);border:1px solid #F3D98B;border-top:0;border-radius:0 0 10px 10px;cursor:default}
.duel .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font:800 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.duel .dh b{font-family:var(--type);font-size:15px;letter-spacing:0;color:var(--ink)}
.duel .dg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.duel .dc{background:var(--guil);border-radius:10px;padding:6px 8px;border-left:3px solid var(--c);min-width:0}
.duel .dc.off{opacity:.4}
.duel .dc .t{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duel .dc .s{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 4px;margin-top:2px;font:700 13px var(--type);white-space:nowrap}
.duel .dc .s small{font:600 10px var(--body);color:var(--muted);margin-right:3px}
.duel .w{color:var(--green)}.duel .l{color:var(--red)}
.duel .lk{color:#F3D98B}
.duel .dplay{display:block;margin-top:10px;padding:11px;border-radius:12px;background:#D4AD4B;color:#16202F;text-align:center;font-weight:800;font-size:14.5px;text-decoration:none}
.duel .dn{margin-top:8px;font-size:12px;color:var(--muted)}
.duel .dr{margin:8px 0 0;text-align:center;font-weight:800;font-size:14px;color:var(--ink)}
.week p{margin:0;font-size:14px;color:var(--muted)}
.rtabs{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--page);border:1px solid var(--line)}
.rtabs button{flex:1;min-height:36px;border:0;border-radius:9px;background:none;color:var(--muted);font:800 12px var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:0 4px}
.rtabs button[aria-selected="true"]{background:var(--guil);color:#F3D98B;box-shadow:0 0 0 1.5px #F3D98B inset}
footer{display:flex;flex-direction:column;gap:4px;align-items:center;padding-top:4px}
/* the windows of this page: Menu, GeoPass */
.hw .gm-rbody{gap:10px}
.hw ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hw .it{min-height:62px;width:100%;display:flex;align-items:center;gap:14px;padding:6px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-decoration:none;font:inherit;text-align:left;cursor:pointer}
.hw .it .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.hw .it .tx{flex:1;display:flex;flex-direction:column;font-size:16px;font-weight:600;line-height:1.3}
.hw .it small{font-size:13px;font-weight:400;color:var(--muted)}
.hw .it .mt{font-family:var(--display);font-weight:800;font-size:15px;color:#F3D98B;white-space:nowrap}
.hw .it .ch{color:var(--muted);display:flex}
.hw .acctbox{border-radius:14px;background:var(--guil);padding:12px;display:flex;align-items:center;gap:12px}
.hw .acctbox .av{width:42px;height:42px;border-radius:50%;background:var(--coral,#F07884);color:#1A1020;display:flex;align-items:center;justify-content:center;font:900 20px var(--display);flex-shrink:0}
.hw .acctbox .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.hw .acctbox .nm b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hw .acctbox span{font-size:13px;color:var(--muted)}
.hw .acctbox .out{background:none;border:0;padding:6px 0;color:#F3D98B;text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.hw .acctbox.guest{flex-wrap:wrap}.hw .acctbox.guest .gbtn{width:100%}
.hw .mfoot{text-align:center;font-size:13px}
/* How the GeoPass works: its list is made for the cream passport page, so here it gets light text on the dark window */
.hw .gp-how{margin:0;color:var(--ink);font-size:15px;gap:10px}
.hw .gp-how b{color:#F3D98B}
.hw .credits{display:flex;flex-direction:column;gap:10px}
.hw .credits ul{list-style:disc;padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink)}
.hw p{margin:0;font-size:14px;color:var(--muted)}
.hw .lv{display:flex;justify-content:space-between;padding:8px 6px;border-bottom:1px solid var(--line);font-size:15px}
.hw .lv.cur{color:#F3D98B;font-weight:700}
.hw h4{margin:6px 0 0;font-family:var(--display);font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.hw .how li{font-size:14px;color:var(--ink);padding:3px 0}
.hw .log li{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.hw .log .pt{font-family:var(--type);font-weight:700;color:#F3D98B}
</style>

<body>
<div class="app">
  <header class="gm-top">
    <h1 class="gm-logo">geo<span>mingo</span></h1>
    <span class="gm-beta" title="Still in testing. Official launch coming soon.">BETA</span>
    <span class="gm-spacer"></span>
    <span class="gm-acctslot" data-gm-acctslot></span>
    <button class="menubtn" id="menu" aria-label="Menu" aria-haspopup="dialog"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <main>
    <p class="gm-betaline">Still testing. Official launch coming soon. Thanks for playing!</p>
    <div class="hrow" id="todayhead"><span class="hmingo"></span><div class="gm-head"><span class="gm-lab" id="dep">Today</span><h2>Today's itinerary</h2></div><button class="mypass" id="mypass" type="button" aria-label="Open my GeoPass"></button></div>
    <div class="pkhead" id="pkhead" hidden></div>

function doneLine(id,label){if(id==='connections'&&label==='Solved')label='4/4';
  return /\d/.test(label)&&DONE_WORD[id]?DONE_WORD[id]+' · '+esc(label):esc(label)}

function setMode(t,push){MODE=t;try{sessionStorage.setItem('gm-tab',t)}catch(e){}

  return '<li><a class="tile'+(lk.ctr?' ctr':'')+'" href="'+g.href+(pr?'?solo':'?friends')+'" style="--c:'+lk.c+'" aria-label="'+esc(g.name)+', '+(pr?'practice':'play with friends')+'">'+top+'</a></li>'}
function tile(g,P){if(MODE!=='today')return modeTile(g);const r=G.result(g.id),lk=look(g.id),mi=P.today[g.id];

  return '<li><a class="tile'+(lk.ctr?' ctr':'')+(r.done?' done':'')+'" href="'+g.href+'" style="--c:'+lk.c+'" '+lab+'><span class="tt"><span>TRIP '+g.gate+'</span><span class="s2">'+state+'</span></span>'+lk.svg+

const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function stamp(id){const k=G.dayKey();let h=0;for(const ch of id+k)h=Math.imul(h^ch.charCodeAt(0),2654435761)>>>0;h^=h>>>15;

    it('credits','#F07884','book','Credits &amp; data sources','')+'</ul>'+

    {gp:()=>G.openPass('passport'),how:openHow,credits:openCredits,rank:()=>{G.closeWindow();const w=document.getElementById('week');if(w&&!w.hidden)w.scrollIntoView({behavior:'smooth'})}})}
// the sources used by all the games (each game's Menu adds its own)
function openCredits(){win('Credits & data sources','<div class="credits"><ul>'+
  '<li>Country data (names, borders, regions, area, languages, currencies, capitals): <a href="https://github.com/mledoze/countries" target="_blank" rel="noopener">mledoze/countries</a>, under the Open Database License (ODbL) 1.0, with a few corrections by hand.</li>'+
  '<li>Population, development, economy, politics, geography and sport figures: Wikipedia lists (CC BY-SA 4.0), which cite the UN, the UNDP, the World Bank and the CIA World Factbook among others.</li>'+
  '<li>Flags: <a href="https://github.com/lipis/flag-icons" target="_blank" rel="noopener">flag-icons</a> (MIT License).</li>'+
  '<li>Fonts: Archivo, Public Sans and Courier Prime (Google Fonts, SIL Open Font License).</li>'+
  '<li>Accounts, online play and rankings: <a href="https://firebase.google.com" target="_blank" rel="noopener">Firebase</a>.</li></ul>'+
  '<p>Each game\'s Menu lists its own extra sources.</p></div>')}
function openHow(){win('How the GeoPass works',G.howHTML())}
document.getElementById('menu').onclick=openMenu;
document.querySelectorAll('#two [data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode,true));
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#openpass,#mypass'))G.openPass('passport')});
draw();
if(G.account)G.account.onChange((why,typing)=>{if(!typing)draw()});
setInterval(draw,30000);
// coming back from a game in the same tab, or a new day while the page is open
addEventListener('pageshow',draw);addEventListener('focus',draw);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw()});
</script>
</body>
</html>
