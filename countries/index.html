<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,600;62..125,800;62..125,900&family=Public+Sans:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: Geomingo (../brand/geomingo.css, loaded after this block) gives the colours, fonts and common pieces;
   this block keeps the grid's own layout */
*{box-sizing:border-box}
html,body{min-height:100%}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--sea);outline-offset:2px}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{cursor:pointer;font-family:var(--display);font-weight:900;font-size:clamp(1.5rem,7.2vw,2.1rem);white-space:nowrap;letter-spacing:.02em;line-height:1;text-transform:uppercase;margin:0}
.brand span{color:var(--sea)}
.coord{font-family:var(--mono);font-size:.72rem;color:var(--ink-2);letter-spacing:.04em}

.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.seg{display:flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;border-right:1px solid var(--rule);padding:10px 6px;font-weight:600;font-size:1rem}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.pin{width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);flex:none}
.row-btns{display:flex;gap:8px}
.sharebig{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;margin:4px 0 0}
.primary.sharebig{background:transparent;color:#F3D98B;border:1.5px solid var(--gold)}
.sharebig svg{flex:none}
.sharerow>*{flex:1}
.ghost{background:transparent;border:1px solid var(--rule);border-radius:4px;padding:8px 12px;font-weight:600}
.ghost:disabled{opacity:.4;cursor:default}
.primary{background:var(--sea);color:var(--sheet);border:0;border-radius:5px;padding:14px;font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase}
.code-in{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;width:100%}
.hint{font-size:.88rem;color:var(--ink-2);margin:0}
.rules{margin:0;padding-left:18px;font-size:.93rem;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}

/* game */
.status{display:flex;align-items:center;gap:10px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.status .who{font-weight:700;font-size:1.1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .sub{font-family:var(--mono);font-size:.75rem;color:var(--ink-2)}
.tbar{position:absolute;left:0;bottom:0;height:3px;background:var(--sea);transition:width .25s linear}
.scores{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:4px 10px 4px 8px;font-weight:600;font-size:.9rem;background:var(--sheet)}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip b{font-family:var(--mono);font-weight:500}

.board-wrap{overflow-x:auto}
.board{display:grid;gap:0;background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;box-shadow:var(--shadow)}
.hd{padding:6px 5px;font-size:.8rem;font-weight:600;line-height:1.15;display:flex;flex-direction:column;justify-content:center;gap:3px;border-color:var(--rule);border-style:dashed;border-width:0;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto}
.hd .ref{font-family:var(--mono);font-size:.62rem;color:var(--sea);font-weight:500;letter-spacing:.05em}
.hd.col{border-left-width:1px;border-bottom:1.5px solid var(--ink);text-align:center;align-items:center;justify-content:flex-end}
.hd.rowh{border-top-width:1px;border-right:1.5px solid var(--ink)}
.cbrand{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.92;letter-spacing:.02em;color:var(--ink);font-size:1.25rem;display:flex;flex-direction:column;align-items:center}
.cbrand span{color:var(--sea)}
.b4 .cbrand{font-size:1.05rem}.b5 .cbrand{font-size:.88rem}
.namecard{display:flex;flex-direction:column;gap:14px}
.roomcode{font-family:var(--mono);font-size:2.6rem;letter-spacing:.18em;margin:0;color:var(--sea);font-weight:500}
.lp{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--rule);border-radius:5px;font-weight:600}
.lp .tag{margin-left:auto;font-family:var(--mono);font-size:.72rem;color:var(--ink-2);font-weight:500}
.lp.off{opacity:.45}
.joinrow{display:flex;gap:8px}.joinrow input{flex:1;min-width:0}
.chip.off{opacity:.45}
.namecard input{border:1.5px solid var(--ink);background:var(--paper);border-radius:5px;padding:12px;font-size:1.15rem;width:100%}
.userline{display:flex;align-items:center;gap:8px;font-weight:600}
.userline .ghost{padding:4px 10px;font-size:.85rem}
.hd.col,.hd.rowh,.corner{aspect-ratio:1;min-width:0;overflow:hidden}
.hd .ht{display:block;max-width:100%;font-size:1.05rem;font-weight:700;line-height:1.08;letter-spacing:.005em}
.b4 .hd .ht{font-size:1rem}
.b5 .hd .ht{font-size:.95rem}
.hd{overflow-wrap:normal;hyphens:manual}
.board .hd,.board.b4 .hd,.board.b5 .hd{padding:2mm}
.board.b5 .hd{padding:1.2mm}
.board.b5 .hd .ref{font-size:.58rem}
.board .corner{padding:2mm}
.board .hd .ref{line-height:1}
/* row and column references (A, B, 1, 2…) in a coral box, like a stamp, sized with the grid */
.board .hd .ref{font-family:var(--display);font-weight:800;font-size:clamp(.72rem,2.6vw,.95rem);color:var(--coral);border:1.5px solid var(--coral);border-radius:5px;padding:2px 6px;letter-spacing:0;margin-bottom:3px;display:inline-block;align-self:center}
.board.b3 .hd .ref{font-size:clamp(.8rem,3vw,1.05rem)}
.board.b5 .hd .ref{font-size:clamp(.6rem,2.1vw,.8rem);padding:1px 4px;border-width:1.2px;border-radius:4px}
/* letter and title travel together (no gap); all squares of the same header line share one top offset,
   so A, B, C (and 1, 2, 3) sit at the same height. The offset is set in fitHeaders(). */
.board .hd.col,.board .hd.rowh{justify-content:flex-start;gap:1px}
.hd .ht .ib{display:inline-block;margin-left:0;margin-right:0;width:1.05em;height:1.05em;line-height:.95em;text-align:center;font-size:.8em;vertical-align:.08em;white-space:nowrap}
.board .hd .ht{hyphens:auto;-webkit-hyphens:auto}
.board .hd.col,.board .hd.rowh{align-items:center;text-align:center}
.board .hd .ht{text-align:center}
.b5 .hd{font-size:.6rem;line-height:1.1}
.corner{border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.62rem;color:var(--ink-2);padding:4px;text-align:center}
.cell{aspect-ratio:1;border:0;border-left:1px dashed var(--rule);border-top:1px dashed var(--rule);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;position:relative;min-width:0}
.cell .plus{width:40%;max-width:28px;aspect-ratio:1;position:relative;opacity:.35}
.cell .plus::before,.cell .plus::after{content:"";position:absolute;background:var(--ink);left:50%;top:50%;transform:translate(-50%,-50%)}
.cell .plus::before{width:100%;height:1.5px}.cell .plus::after{height:100%;width:1.5px}
.cell:hover .plus{opacity:.7}
.cell.sel{background:var(--sea-soft);box-shadow:inset 0 0 0 2px var(--sea)}
.cell .fl{font-size:1.6rem;line-height:1}
.cell .nm{font-size:.72rem;font-weight:600;line-height:1.05;text-align:center;overflow-wrap:anywhere}
.cell.taken{cursor:default}
.cell .cnt{position:absolute;right:4px;bottom:3px;font-family:var(--mono);font-size:.6rem;color:var(--ink-2)}
.cell.miss .nm{color:var(--ink-2);font-weight:500}
.o0{background:var(--p0-soft)}.o1{background:var(--p1-soft)}.o2{background:var(--p2-soft)}.o3{background:var(--p3-soft)}.o4{background:var(--p4-soft)}.o5{background:var(--p5-soft)}
.o0::after,.o1::after,.o2::after,.o3::after,.o4::after,.o5::after{content:"";position:absolute;left:0;top:0;width:6px;height:6px;border-radius:0 0 6px 0}
.o0::after{background:var(--p0)}.o1::after{background:var(--p1)}.o2::after{background:var(--p2)}.o3::after{background:var(--p3)}.o4::after{background:var(--p4)}.o5::after{background:var(--p5)}
.b4 .hd{font-size:.74rem}.b4 .cell .fl{font-size:1.35rem}.b4 .cell .nm{font-size:.66rem}
.b5 .hd{font-size:.66rem;padding:5px 3px}.b5 .cell .fl{font-size:1.15rem}.b5 .cell .nm{font-size:.58rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .ghost{flex:1;min-width:110px}

/* lives on the ticket: pink dots, used ones empty */
.tk-dots{display:inline-flex;gap:5px;align-items:center;height:22px}
.tk-dots i{width:12px;height:12px;border-radius:50%;background:var(--flamingo,var(--coral))}
.tk-dots i.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line,var(--rule))}
/* guess sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1.5px solid var(--ink);box-shadow:0 -12px 30px -10px rgba(0,0,0,.35);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto;border-radius:10px 10px 0 0}
.sheet .q{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-weight:600;font-size:.95rem}
.sheet .q i{font-style:normal;color:var(--ink-2);font-family:var(--mono);font-size:.75rem}
.sheet input{width:100%;border:1.5px solid var(--ink);border-radius:5px;padding:12px;font-size:1.1rem;background:var(--paper)}
.sugg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:42vh;overflow-y:auto}
.sugg button{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px 4px;display:flex;gap:10px;align-items:center;font-size:1.02rem}
.sugg button:disabled{opacity:.4;cursor:default}
.sugg .tag{margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--ink-2)}
.sheet .bar{display:flex;gap:8px}
.sheet .bar .ghost{flex:1}
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:19}

.hd[data-info]{cursor:pointer}
.hd[data-info]:hover{background:var(--sea-soft)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:1.25em;height:1.25em;margin:0 .35em;border:1px solid currentColor;border-radius:50%;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:.95em;line-height:1;vertical-align:middle;color:var(--sea)}
.qcat{background:transparent;border:0;padding:0;font-weight:600;font-size:inherit;text-align:left;display:inline-flex;align-items:center}
.infobox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;width:min(420px,calc(100% - 32px));background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.infobox h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:1.6rem;line-height:1.05;margin:0;text-wrap:balance}
.infobox p{margin:0;font-size:1rem;color:var(--ink)}
.infobox .meta{font-family:var(--mono);font-size:.75rem;color:var(--ink-2)}
.infoscrim{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:30}
/* guessed square: points in the top-right corner, name centred at the bottom */
.pts{position:absolute;top:0;right:0;border-radius:0 0 0 3px;font-family:var(--mono);font-size:.62rem;background:rgba(8,16,26,.78);color:#fff;padding:1px 4px;line-height:1.2;white-space:nowrap}
.flagbox{position:relative}
.cell .val{position:absolute;right:4px;bottom:3px;font-family:var(--mono);font-size:.66rem;color:var(--ink-2)}
.b5 .cell .val,.b5 .pts{font-size:.55rem}
.bd{margin:-6px 0 0 38px}.bdline{font-family:var(--mono);font-size:.75rem!important}
.helpbox{max-height:calc(100% - 48px);overflow-y:auto;top:24px;transform:translateX(-50%)}
.helpbox h3{font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:6px 0 0}
.helpbox ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ptable{border-collapse:collapse;font-family:var(--mono);font-size:.85rem}
.ptable td{border-top:1px solid var(--rule);padding:4px 10px 4px 0}
.helpbtn{background:transparent;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.9rem;white-space:nowrap}
.foot{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 28px;display:flex;justify-content:center}
.linkbtn{background:transparent;border:0;color:var(--ink-2);font-size:.85rem;text-decoration:underline;text-underline-offset:3px;padding:6px}
.credits dl{margin:0;display:flex;flex-direction:column;gap:10px}
.credits dt{font-weight:700}
.credits dd{margin:2px 0 0;color:var(--ink-2);font-size:.92rem}
.credits a{color:var(--sea)}
.pin.big{width:34px;height:34px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:5px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.toast.good{background:var(--good);color:#fff}

/* results */
.podium{display:flex;flex-direction:column;gap:8px}
.place{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:5px}
.place .rk{font-family:var(--display);font-weight:900;font-size:1.6rem;width:28px}
.place .nm{flex:1;font-weight:700;font-size:1.1rem}
.place .pt{font-family:var(--mono)}
.place.win{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.big{font-family:var(--display);font-weight:900;font-size:2.6rem;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.answers{display:flex;flex-direction:column;gap:6px}
.answers p{margin:0;font-size:.95rem}
.sharebtns{display:flex;flex-direction:column;gap:8px}
.sharebtns a{display:block;text-align:center;text-decoration:none}
.sep{border:0;border-top:1px solid var(--rule);margin:2px 0;width:100%}
/* home: three big cards */
.home{display:flex;flex-direction:column;gap:12px}
.hcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:16px;box-shadow:var(--shadow)}
.hcard.ac{border:2px solid var(--sea);padding:15px}
button.hcard:hover,button.hcard:active{border-color:var(--sea);background:var(--sea-soft)}
.hcard .dboard{width:100%;margin-top:8px}
.menuscrim{position:fixed;inset:0;z-index:28}
.menubox{position:fixed;z-index:29;top:calc(58px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(560px,100%);padding:0 16px;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none}
.menubox .mitem{pointer-events:auto;width:min(280px,100%);text-align:left;background:var(--sheet);border:1px solid var(--rule);border-top-width:0;padding:13px 16px;font-weight:600;font-size:1rem}
.menubox .mitem:first-child{border-top-width:1px;border-radius:8px 8px 0 0}
.menubox .mitem:last-child{border-radius:0 0 8px 8px;box-shadow:var(--shadow)}
.menubox .mitem:hover{background:var(--sea-soft)}
.menubox .mitem{display:flex;align-items:center;gap:14px}
.menubox .mitem .ico{width:20px;height:20px;color:var(--sea)}
.menubox .mitem.out{color:var(--ink-2);border-top:1px solid var(--ink-2)}
.menubox .mitem.out .ico{color:var(--ink-2)}
.ico{flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#menu{display:inline-flex;align-items:center;gap:6px}
#menu .ico{width:18px;height:18px}
/* archive of past daily grids */
.arch{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.arch button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.arch button:hover{border-color:var(--sea)}
.arch .an{font-family:var(--display);font-weight:900;font-size:1.5rem;min-width:52px;color:var(--sea)}
.arch .ad{flex:1;display:flex;flex-direction:column;gap:2px}
.arch .ad small{color:var(--ink-2);font-size:.85rem}
.arch .as{font-family:var(--mono);font-size:.78rem;color:var(--ink-2);text-align:right;flex:none;min-width:8ch}
.arch .as.done{color:var(--good)}
.arch .dsq{width:44px;gap:2px}
.corner.dnum{flex-direction:column;gap:2px;padding:4px}
.corner.dnum .dl{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.corner.dnum .dn{font-family:var(--display);font-weight:900;font-size:2rem;line-height:.9;color:var(--sea);letter-spacing:.01em}
.b5 .corner.dnum .dn,.corner.dnum .dn.long{font-size:1.45rem}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c4{--pc:var(--p4);--pc-soft:color-mix(in srgb,var(--p4) 22%,transparent)}.c5{--pc:var(--p5);--pc-soft:color-mix(in srgb,var(--p5) 22%,transparent)}
.qrules{gap:6px}.qrules .hint{font-size:1rem}
.userline{flex-wrap:wrap}
.stats .label{margin-top:4px}
.stgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st{border:1px solid var(--rule);border-radius:6px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.st b{font-family:var(--display);font-weight:900;font-size:1.6rem;line-height:1;color:var(--ink)}
.st span{font-size:.8rem;color:var(--ink-2)}
.sttab{width:100%;border-collapse:collapse;font-size:.9rem}
.sttab th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;text-align:right;padding:4px}
.sttab td{text-align:right;padding:6px 4px;border-top:1px solid var(--rule);font-family:var(--mono)}

<script>
const N = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'');
C.forEach((c,i)=>{c.i=i;c.k=N(c.n);c.ak=c.al.map(N);c.letters=c.k;});
const byCode = Object.fromEntries(C.map(c=>[c.c,c]));
const LEFT = new Set('GBR IRL MLT CYP IND PAK BGD LKA NPL BTN MDV JPN THA MYS SGP IDN BRN TLS AUS NZL PNG FJI SLB TON WSM KIR TUV NRU ZAF LSO SWZ BWA NAM ZWE ZMB MOZ MWI TZA KEN UGA MUS SYC JAM TTO BRB BHS GUY SUR ATG KNA LCA VCT GRD DMA HKG MAC BMU CYM VGB VIR AIA MSR TCA FLK SHN CCK CXR NFK COK NIU PCN IMN JEY GGY'.split(' '));
const has = (c,l)=>c.lg.includes(l);

/* ---- categories ---- */
const CATS = [];
const add=(fam,label,test)=>CATS.push({id:CATS.length,fam,label,test});
[['AF','In Africa'],['EU','In Europe'],['AS','In Asia'],['OC','In Oceania'],['NA','In North or Central America'],['SA','In South America']].forEach(([r,l])=>add('region',l,c=>c.r===r));
['CHN','RUS','IND','BRA','FRA','DEU','AUT','COD','TZA','TUR','SRB','SAU','ARG','HUN','NER','ZMB','IRN','PER'].forEach(k=>add('border','Borders '+byCode[k].n,c=>c.b.includes(k)));

// land neighbours: only countries count, not territories (China's are 14 with Hong Kong and Macau left out); daily grids
// from before ONLY_COUNTRIES_FROM still count territories (OLD_RULES), so those days stay as they were
let OLD_RULES=false;
const NB=c=>OLD_RULES?c.b.length:c.b.filter(x=>byCode[x]&&!byCode[x].t).length;
add('geo','Island nation (no land borders)',c=>NB(c)===0&&!c.ll);
add('geo','Has 5+ land neighbours',c=>NB(c)>=5);
add('geo','Exactly 1 land neighbour',c=>NB(c)===1);
add('geo','Centre south of the Equator',c=>c.lat<0);
add('geo','Centre in the tropics',c=>Math.abs(c.lat)<23.4);
add('geo','Centre north of 45°N',c=>c.lat>45);
add('geo','Area over 1 million km²',c=>c.a>1e6);
add('geo','Area under 30,000 km²',c=>c.a<3e4);
add('geo','Area over 2 million km²',c=>c.a>2e6);
add('geo','Area under 1,000 km²',c=>c.a>0&&c.a<1000);
add('geo','Exactly 2 land neighbours',c=>NB(c)===2);
add('geo','3 or 4 land neighbours',c=>NB(c)>=3&&NB(c)<=4);
// population: UN estimate for 1 July 2023; places without a UN figure never count
const POP=c=>DATA.pop[c.c];
add('people','Population over 100 million',c=>POP(c)>1e8);
add('people','Population over 50 million',c=>POP(c)>5e7);
add('people','Population under 1 million',c=>POP(c)<1e6);
add('people','Population under 100,000',c=>POP(c)<1e5);
// development and economy: a place without a figure in the source never counts
const V=(k,c)=>DATA[k][c.c],HASV=(k,c)=>DATA[k][c.c]!==undefined;
add('dev','Very high development (HDI 0.9+)',c=>V('hdi',c)>=0.9);
add('dev','HDI 0.95 or higher',c=>V('hdi',c)>=0.95);
add('dev','Low development (HDI under 0.55)',c=>HASV('hdi',c)&&V('hdi',c)<0.55);
add('dev','GDP per person over $50,000',c=>V('gdp',c)>50000);
add('dev','GDP per person under $1,000',c=>HASV('gdp',c)&&V('gdp',c)<1000);
add('dev','Life expectancy over 80',c=>V('life',c)>80);
add('dev','Life expectancy under 65',c=>HASV('life',c)&&V('life',c)<65);
add('dev','Median age over 40',c=>V('age',c)>40);
add('dev','Median age under 20',c=>HASV('age',c)&&V('age',c)<20);
add('dev','Least corrupt (CPI 70+)',c=>V('cpi',c)>=70);
add('dev','Most corrupt (CPI under 25)',c=>HASV('cpi',c)&&V('cpi',c)<25);
add('dev','CO₂ over 10 t per person',c=>V('co2',c)>10);
add('dev','Has nuclear power plants',c=>DATA.nuclear.includes(c.c));
// politics and history
const IN=k=>c=>DATA[k].includes(c.c);
add('pol2','Is a territory (not independent)',c=>c.t===1);
add('pol2','Has nuclear weapons',IN('nukes'));
add('pol2','Arab League member',IN('arab'));
add('pol2','ASEAN member',IN('asean'));
add('pol2','APEC member',IN('apec'));
add('pol2','Antarctic Treaty party',IN('antarctic'));
add('pol2','No standing army',IN('noarmy'));
add('people','Over 90% urban population',c=>V('urban',c)>=90);
add('people','Under 25% urban population',c=>HASV('urban',c)&&V('urban',c)<25);
add('hist','Independence from the UK',IN('ind_uk'));
add('hist','Independence from Spain',IN('ind_es'));
// geography and sport
add('geo3','Coastline over 10,000 km',c=>V('coast',c)>10000);
add('geo3','Coastline under 100 km',c=>V('coast',c)>0&&V('coast',c)<100);
add('geo3','Highest point under 500 m',c=>HASV('elev',c)&&V('elev',c)<500);
add('geo3','Land borders over 5,000 km',c=>V('landb',c)>5000);
add('geo3','Forest covers over 60%',c=>V('forest',c)>60);
add('geo3','Forest covers under 5%',c=>HASV('forest',c)&&V('forest',c)<5);
add('sport2','100+ Olympic medals',c=>V('olymp',c)>=100);
add('sport2','500+ Olympic medals',c=>V('olymp',c)>=500);
add('sport2','Never won an Olympic medal',c=>!c.t&&!HASV('olymp',c));
add('sport2','Played the men\'s World Cup',IN('wc'));
add('sport2','Took part in Eurovision',IN('euro'));
add('pol2','Has a metro system',IN('metro'));
add('misc','Drives on the left',c=>LEFT.has(c.c));
['A','B','C','G','M','N','S','T','L','K','P'].forEach(L=>add('name','Name starts with '+L,c=>c.k[0]===L.toLowerCase()));
add('name','Name ends in "-ia"',c=>c.k.endsWith('ia'));
add('name','Name ends in "-stan"',c=>c.k.endsWith('stan'));
add('name','Name ends in "-land"',c=>/lands?$/.test(c.k)&&!/islands?$/.test(c.k));
add('name','Name has 5 letters or fewer',c=>c.k.length<=5);
add('name','Name has 10+ letters',c=>c.k.length>=10);
add('name','Name of 2+ words',c=>/\s/.test(c.n.trim()));
add('name','Name contains Z',c=>c.k.includes('z'));
add('name','Starts and ends with the same letter',c=>c.k[0]===c.k[c.k.length-1]);
add('lang','Official language: English',c=>has(c,'English'));
add('lang','Official language: French',c=>has(c,'French'));
add('lang','Official language: Spanish',c=>has(c,'Spanish'));
add('lang','Official language: Arabic',c=>has(c,'Arabic'));
add('lang','Official language: Portuguese',c=>has(c,'Portuguese'));
add('money','Uses the euro',c=>c.cu.includes('EUR')&&c.r==='EU'); // European places only: no overseas territories
add('money','Currency called "dollar"',c=>c.d===1);
// capitals that are disputed, moving or ambiguous (DATA.cap_skip) never count in capital categories
const CAPOK=c=>!!c.cap&&!DATA.cap_skip.includes(c.c),CAPPOP=c=>DATA.cappop[c.c];
add('cap','Capital starts with same letter',c=>CAPOK(c)&&N(c.cap)[0]===c.k[0]);
add('cap','Capital name has 2+ words',c=>CAPOK(c)&&/\s/.test(c.cap.trim()));
['B','M','P','S'].forEach(L=>add('cap','Capital starts with '+L,c=>CAPOK(c)&&N(c.cap)[0]===L.toLowerCase()));
add('cap','Capital over 1 million people',c=>CAPOK(c)&&CAPPOP(c)>=1e6);
add('cap','Capital under 100,000 people',c=>CAPOK(c)&&CAPPOP(c)<1e5);
add('cap','Capital is not the largest city',c=>DATA.cap_notlargest.includes(c.c));
// ---- categories from hand-checked lists (flags measured and checked on the flags shown in the game) ----
const inList=k=>{const set=new Set(EXTRA[k]);return c=>set.has(c.c)};
[['flag_blue','Flag has blue'],['flag_green','Flag has green'],['flag_yellow','Flag has yellow or gold'],['flag_black','Flag has black'],['flag_orange','Flag has orange']].forEach(([k,l])=>add('flagc',l,inList(k)));
add('flagc','No red on the flag',c=>!EXTRA.flag_red.includes(c.c));
add('flagc','Flag of exactly 2 colours',inList('flag_two'));
add('flagc','Flag of exactly 3 colours',inList('flag_three'));
[['flag_star','Flag has a star'],['flag_moon','Flag has a crescent moon'],['flag_sun','Flag has a sun'],['flag_cross','Flag has a cross'],['flag_uj','Flag has the Union Jack'],['flag_arms','Flag has a coat of arms or seal'],['flag_animal','Flag has an animal']].forEach(([k,l])=>add('flags',l,inList(k)));
[['sea_med','Coast on the Mediterranean'],['sea_carib','Coast on the Caribbean Sea'],['sea_baltic','Coast on the Baltic Sea'],['sea_black','Coast on the Black Sea'],['sea_red','Coast on the Red Sea'],['sea_gulf','Coast on the Persian Gulf'],['sea_caspian','Coast on the Caspian Sea'],['sea_north','Coast on the North Sea']].forEach(([k,l])=>add('sea',l,inList(k)));
add('geo2','Crossed by the Equator',inList('geo_equator'));
add('geo2','Has a peak over 5,000 m',inList('geo_5000'));
[['pol_eu','EU member'],['pol_nato','NATO member'],['pol_cw','Commonwealth member'],['pol_g20','G20 member'],['pol_mon','Monarchy'],['pol_opec','OPEC member'],['pol_ussr','Former Soviet republic']].forEach(([k,l])=>add('pol',l,inList(k)));
[['sp_summer','Hosted the Summer Olympics'],['sp_winter','Hosted the Winter Olympics'],['sp_wchost','Hosted the men\'s World Cup'],['sp_wcwin','Won the men\'s World Cup'],['sp_f1','Hosts a Formula 1 race (2026)']].forEach(([k,l])=>add('sport',l,inList(k)));
// Since ONLY_COUNTRIES_FROM only the 197 countries are answers (193 UN members, Vatican City, Palestine, Kosovo, Taiwan),
// the same list as every other Geomingo game. Territories (Hong Kong, Greenland...) stay in C so old games still show,
// and daily grids before that day keep them (setAll), so those days stay exactly as they were.
const ONLY_COUNTRIES_FROM='2026-11-10';
const oldDay=key=>!!key&&key<ONLY_COUNTRIES_FROM;
CATS.forEach(k=>{OLD_RULES=true;k.setAll=C.map(c=>!!k.test(c));OLD_RULES=false;k.set=C.map(c=>!c.t&&!!k.test(c));k.count=k.set.filter(Boolean).length;});
const FLAGNOTE='Judged on the flag shown in the game.';
const NOTE=(what,page)=>'Source: '+what+', as listed in Wikipedia, "'+page+'". Places with no figure there never count.';
const POPNOTE='United Nations estimate for 1 July 2023 (Wikipedia, "List of countries by population (United Nations)"). Places with no UN figure never count.';
const CAPNOTE='Source: Wikipedia, "List of national capitals by population". Countries with a disputed or moving capital (Sri Lanka, Eswatini, Equatorial Guinea, Western Sahara, Montserrat, Tokelau) never count in capital categories.';
const NAMEWORD='Uses the English name shown in this game (for example "Ivory Coast", "Czechia", "DR Congo"). Spaces, hyphens and accents are ignored.';
function describe(k){
  const L=k.label;let m;
  if(m=/^In (.+)$/.exec(L)){const extra={'Europe':' Russia and Cyprus count as Europe here.','Asia':' Turkey, Georgia, Armenia, Azerbaijan and Kazakhstan count as Asia here.','North or Central America':' Includes the Caribbean, Central America and Mexico.','Oceania':' Australia, New Zealand and the Pacific islands.','Africa':' Egypt counts as Africa.','South America':' The 12 countries of the South American mainland.'};return 'The country belongs to '+m[1]+'.'+(extra[m[1]]||'')}
  if(m=/^Borders (.+)$/.exec(L))return 'Shares a land border with '+m[1]+'. Sea borders and bridges do not count.';
  const D={
    'Landlocked':'Has no coastline on the open sea. A coast only on the Caspian Sea does not count, so Kazakhstan and Azerbaijan are landlocked here.',
    'Island nation (no land borders)':'Has no land border with any other country. Countries sharing an island with a neighbour, like Haiti or Ireland, do not count.',
    'Has 5+ land neighbours':'Shares a land border with at least 5 different countries.',
    'Exactly 1 land neighbour':'Shares a land border with exactly one country.',
    'Centre south of the Equator':'The geographic centre of the country is south of the Equator. Countries crossing the Equator count by where their centre is.',
    'Centre in the tropics':'The geographic centre lies between the Tropic of Cancer (23.4°N) and the Tropic of Capricorn (23.4°S).',
    'Centre north of 45°N':'The geographic centre is north of latitude 45°N, roughly the line through Bordeaux, Turin and Ottawa.',
    'Area over 1 million km²':'Total area (land and inland water) above 1,000,000 km².',
    'Area under 30,000 km²':'Total area below 30,000 km², a bit smaller than Belgium.',
    'Population over 100 million':'Has more than 100 million inhabitants. '+POPNOTE,
'Population over 50 million':'Has more than 50 million inhabitants. '+POPNOTE,
'Population under 1 million':'Has fewer than 1 million inhabitants. '+POPNOTE,
'Population under 100,000':'Has fewer than 100,000 inhabitants. '+POPNOTE,
'Area over 2 million km²':'Total area (land and inland water) above 2,000,000 km².',
'Very high development (HDI 0.9+)':'Human Development Index of 0.900 or more. The HDI combines life expectancy, schooling and income. '+NOTE('UNDP figures for 2023','List of countries by Human Development Index'),
'HDI 0.95 or higher':'Human Development Index of 0.950 or more, the very top of the ranking. '+NOTE('UNDP figures for 2023','List of countries by Human Development Index'),
'Low development (HDI under 0.55)':'Human Development Index below 0.550 ("low human development"). '+NOTE('UNDP figures for 2023','List of countries by Human Development Index'),
'GDP per person over $50,000':'Nominal GDP per person above 50,000 US dollars. '+NOTE('World Bank figures, 2025 column','List of countries by GDP (nominal) per capita'),
'GDP per person under $1,000':'Nominal GDP per person below 1,000 US dollars. '+NOTE('World Bank figures, 2025 column','List of countries by GDP (nominal) per capita'),
'Life expectancy over 80':'Life expectancy at birth above 80 years. '+NOTE('UN figures for 2023','List of countries by life expectancy'),
'Life expectancy under 65':'Life expectancy at birth below 65 years. '+NOTE('UN figures for 2023','List of countries by life expectancy'),
'Median age over 40':'Half the population is older than 40. '+NOTE('CIA World Factbook, 2024 estimates','List of countries by median age'),
'Median age under 20':'Half the population is younger than 20. '+NOTE('CIA World Factbook, 2024 estimates','List of countries by median age'),
'Least corrupt (CPI 70+)':'Scores 70 or more out of 100 in the Corruption Perceptions Index (higher means cleaner). '+NOTE('Transparency International, 2025 index','Corruption Perceptions Index'),
'Most corrupt (CPI under 25)':'Scores below 25 out of 100 in the Corruption Perceptions Index (lower means more corruption perceived). '+NOTE('Transparency International, 2025 index','Corruption Perceptions Index'),
'CO₂ over 10 t per person':'Emits more than 10 tonnes of CO₂ per person a year. Only countries count, not territories. '+NOTE('figures for 2023','List of countries by carbon dioxide emissions per capita'),

/* A grid is "safe" when no sequence of correct answers can ever leave a square impossible:
   for every square, its countries can never all be taken by other squares at the same time. */
function canBlock(ans,c){const A=ans[c];const own=new Map();
  const tryC=(x,seen)=>{for(let d=0;d<ans.length;d++){if(d===c||seen.has(d)||!ans[d].includes(x))continue;seen.add(d);if(!own.has(d)||tryC(own.get(d),seen)){own.set(d,x);return true}}return false};
  for(const x of A)if(!tryC(x,new Set()))return false;return true}

  const answers=[];let bad=0,small=0;
  for(const rk of rows)for(const ck of cols){const a=inter(rk,ck);answers.push(a);
    if(a.length<2)bad+=10;if(a.length>C.length*0.5)bad+=10;

function searchGrid(n,r,restarts){

    let anchor=null;const rare=famsFor().rare;
    if(rare.length&&r()<(DIFF==='hard'?0.8:DIFF==='easy'?0.3:0.5)){anchor=rare[Math.floor(r()*rare.length)];if(!catWeight(anchor))anchor=null;else
      if(!cols.includes(anchor)&&!rows.includes(anchor))rows[0]=anchor;else anchor=null}

    for(let it=0;it<1500&&cur.score>0;it++){

      if(anchor&&axis==='r'&&i===0)continue;

      const na=arr.slice();na[i]=k;if(!famOK(na))continue;

      if(nx.score<=cur.score||r()<0.03){rows=nr;cols=nc;cur=nx}

function generate(n,seed,diff){
  DIFF=DIFFS.includes(diff)?diff:'normal';
  HARD_MAX=n===5?15:12;HARD_SMALL=n===5?6:5;GEN_N=n;
  const r=rngFrom(seed+(DIFF==='easy'?11:DIFF==='hard'?23:0)*7962624);
  return searchGrid(n,r,n===5?250:80);
}

/* Solo and daily: five lives for the whole grid; only a wrong answer or a timed-out turn costs one.
   Games saved before lives (they counted guesses) start from five minus their wrong answers. */
const LIVES=5;
const livesLeft=()=>S.lives!=null?S.lives:Math.max(0,LIVES-(S.wrong||0));
const livesWord=n=>n+' '+(n===1?'life':'lives');
function loseLife(){if(S.mode==='solo')S.lives=Math.max(0,livesLeft()-1)}
const livesDots=(left,all)=>`<span class="tk-dots" aria-label="${livesWord(left)} left">${Array.from({length:all},(_,i)=>`<i class="${i<left?'':'off'}"></i>`).join('')}</span>`;

  const full=S.cells.every(c=>c.o>=0);
  const outOfLives=S.mode==='solo'&&livesLeft()<=0;
  const allPassed=S.mode!=='solo'&&S.passes>=S.players.length;
  if(full||outOfLives||allPassed){endGame();return true}
  return false;
}
/* ---- scoring ----
   square: difficulty from 0 to 100 by ranking inside each grid: squares are sorted by how many
           countries fit them and get evenly spaced points, 100 for the fewest options, 0 for the most
   speed:  +2 for every whole second left (the turn timer, or a 30-second window when the timer is off)
   lines:  +50 for every full row or column that is all yours */
const LINE_BONUS=50,SQ_MAX=100,SPEED_PER_SEC=2,SPEED_WINDOW=30;
function cellValues(answers){
  // ranking: sort squares from fewest to most options and give them evenly spaced points,
  // 100 for the hardest down to 0 for the easiest; squares with the same count share their average place
  const ks=answers.map(a=>a.length),N=ks.length,sorted=[...ks].sort((x,y)=>x-y);
  if(N<2||sorted[0]===sorted[N-1])return ks.map(()=>SQ_MAX);
  return ks.map(k=>{const f=sorted.indexOf(k),l=sorted.lastIndexOf(k);return Math.round(SQ_MAX*(N-1-(f+l)/2)/(N-1))});
}
const valCache=new WeakMap();
function valuesFor(answers){if(!valCache.has(answers))valCache.set(answers,cellValues(answers));return valCache.get(answers)}
function speedPts(elapsedMs,timer){const win=timer||SPEED_WINDOW;return SPEED_PER_SEC*Math.max(0,Math.floor(win-elapsedMs/1000))}
function lineCounts(){
  const n=S.n,b=S.players.map(()=>0);
  for(let i=0;i<n;i++){
    const row=[...Array(n)].map((_,j)=>S.cells[i*n+j].o),col=[...Array(n)].map((_,j)=>S.cells[j*n+i].o);
    [row,col].forEach(l=>{if(l[0]>=0&&l.every(x=>x===l[0]))b[l[0]]++});
  }return b;
}
function computeScores(){
  const lc=lineCounts();
  S.players.forEach((p,i)=>{const mine=S.cells.filter(c=>c.o===i);
    p.cells=mine.length;p.base=mine.reduce((a,c)=>a+(c.p||0),0);p.speed=mine.reduce((a,c)=>a+(c.sb||0),0);
    p.lines=lc[i];p.bonus=lc[i]*LINE_BONUS;p.score=p.base+p.speed+p.bonus});
}
function liveScore(i){const lc=lineCounts();return S.cells.filter(c=>c.o===i).reduce((a,c)=>a+(c.p||0)+(c.sb||0),0)+lc[i]*LINE_BONUS}
function endGame(){
  if(S.mode==='online'){onlineAct('end');return}
  S.over=true;clearInterval(tick);ui.sel=-1;
  computeScores();
  render();
}
function guess(ci,cid){
  const c=byCode[cid];if(!c||S.over)return;
  if(S.mode==='online'){ui.sel=-1;ui.query='';drawLayer();onlineGuess(ci,cid);return}
  if(S.used.includes(cid)){say('think','Hold on.',c.n+' is already stamped on this grid. Try another country.');ui.sel=-1;ui.query='';render();return}
  const ok=S.answers[ci].includes(c.i);
  const p=S.players[S.turn];
  if(ok){
    const pts=valuesFor(S.answers)[ci],sb=speedPts(now()-(S.turnStart||now()),S.timer);
    const before=lineCounts()[S.turn];
    S.cells[ci]={o:S.turn,c:cid,p:pts,sb};S.used.push(cid);S.passes=0;ui.fresh=ci;
    const nl=lineCounts()[S.turn]-before;
    Geomingo.stamp('borderline',c.n,'',c.c);
    say('happy','Stamped: '+c.n+'.','+'+pts+' pts'+(sb?' · +'+sb+' speed':'')+(nl?' · +'+nl*LINE_BONUS+' for the line':'')+(S.mode==='solo'?'':' for '+p.name+'.'));
  }else{
    S.wrong++;loseLife();
    const left=S.mode==='solo'?livesLeft():0;
    say('sad','Denied entry.',c.n+" doesn't fit that square."+(S.mode==='solo'?(left>0?' '+livesWord(left)+' left.':''):' Turn passes.'));
  }

}

async function leaveRoom(){
  const ref=roomRef;
  if(ref&&room&&room.status==='lobby'){
    try{await ref.transaction(r=>{if(!r)return r;if(r.players)delete r.players[ME];
      const left=lobbyOrder(r);if(!left.length)return null;if(r.host===ME)r.host=left[0];return r})}catch(e){}
  }else if(ref){try{await ref.child('players/'+ME+'/on').set(false)}catch(e){}}

function syncRoom(){

  const cells=g.answers.map((_,i)=>cellMap[i]?{o:cellMap[i].o,c:cellMap[i].c,p:cellMap[i].p||0,sb:cellMap[i].sb||0}:{o:-1,c:null});
  S={mode:'online',n,seed:r.seed,diff:r.cfg.diff||'normal',code:makeCode(n,r.seed,r.cfg.diff),rows:g.rows,cols:g.cols,answers:g.answers,cells,
     used:cells.filter(c=>c.c).map(c=>c.c),
     players:order.map(pid=>({pid,uid:(r.players[pid]||{}).uid||null,name:(r.players[pid]||{}).name||'Gone',on:(r.players[pid]||{}).on!==false,score:0})),
     gid:'f-'+roomCode+'-'+(r.started||r.seed),
     turn:r.turn||0,timer:r.cfg.timer,deadline:r.deadline||0,turnStart:r.started||0,passes:r.passes||0,over:r.status==='over',wrong:r.wrong||0,
     me:order.indexOf(ME),host:r.host===ME};
  if(S.over){computeScores();clearInterval(tick)}
  if(r.ev&&r.ev.id!==seenEv){
    if(!firstSync){toast(r.ev.text,r.ev.kind);if(r.ev.ci!=null&&r.ev.kind==='good')ui.fresh=r.ev.ci;
      if(r.ev.kind==='good'||r.ev.kind==='bad')say(r.ev.kind==='good'?'happy':'sad',r.ev.kind==='good'?'Stamped.':'Denied entry.',r.ev.text)}

function ensureTick(){clearInterval(tick);if(S&&S.timer&&!S.over)tick=setInterval(onTick,250)}
function advance(r,len){
  const filled=Object.keys(r.cells||{}).length;
  if(filled>=r.cfg.n*r.cfg.n||(r.passes||0)>=len){r.status='over';r.deadline=0;return}
  r.turn=((r.turn||0)+1)%len;
  r.started=Date.now()+offset;
  r.deadline=r.cfg.timer?Date.now()+offset+r.cfg.timer*1000:0;
}
async function onlineGuess(ci,cid){
  const c=byCode[cid];let note='',fit=false;
  try{
    const res=await roomRef.transaction(r=>{
      if(!r)return r;fit=false;
      if(r.status!=='playing'){note='over';return}
      const order=r.order;if(order[r.turn||0]!==ME){note='turn';return}
      r.cells=r.cells||{};
      if(r.cells[ci]){note='taken';return}
      if(Object.values(r.cells).some(x=>x.c===cid)){note='used';return}
      const g=roomGrid(r);const ok=g.answers[ci].includes(c.i);
      const nm=(r.players[ME]||{}).name||'Someone';
      if(ok){const pts=valuesFor(g.answers)[ci],sb=speedPts(Date.now()+offset-(r.started||Date.now()+offset),r.cfg.timer);
        r.cells[ci]={o:r.turn||0,c:cid,p:pts,sb};r.passes=0;fit=true;r.ev={id:evId(),kind:'good',ci,text:nm+': '+c.n+' fits. +'+pts+(sb?' +'+sb+' speed':'')}}
      else{r.wrong=(r.wrong||0)+1;r.ev={id:evId(),kind:'bad',text:nm+': '+c.n+" doesn't fit there."}}
      advance(r,order.length);return r;
    });
    if(res.committed&&fit)Geomingo.stamp('borderline',c.n,'',c.c);
    if(!res.committed){toast(note==='turn'?'It is not your turn any more.':note==='taken'?'Someone already filled that square.':note==='used'?c.n+' is already on the board.':'The game is over.','bad')}
  }catch(e){console.error(e);toast('That move did not go through. Check the connection.','bad')}
}
async function onlineAct(kind){
  try{await roomRef.transaction(r=>{
    if(!r)return r;
    const nm=(r.players[ME]||{}).name||'Someone';
    if(kind==='pass'){if(r.status!=='playing'||r.order[r.turn||0]!==ME)return;r.passes=(r.passes||0)+1;r.ev={id:evId(),kind:'',text:nm+' passed.'};advance(r,r.order.length);return r}
    if(kind==='end'){if(r.status!=='playing')return;r.status='over';r.deadline=0;r.ev={id:evId(),kind:'',text:nm+' ended the game.'};return r}
    if(kind==='start'||kind==='rematch'){
      if(r.host!==ME)return;
      const order=kind==='start'?lobbyOrder(r):(r.order||lobbyOrder(r)).filter(pid=>r.players[pid]);
      if(order.length<2)return;
      r.order=order;r.seed=freshSeed(r.cfg.n,r.cfg.diff);{const gg=gridFor(r.cfg.n,r.seed,r.cfg.diff);r.rows=gg.rows;r.cols=gg.cols}r.v=APP_VERSION;r.cells=null;r.passes=0;r.wrong=0;r.turn=Math.floor(Math.random()*order.length);r.status='playing';
      r.started=Date.now()+offset;
      r.deadline=r.cfg.timer?Date.now()+offset+r.cfg.timer*1000:0;
      r.ev={id:evId(),kind:'',text:(kind==='start'?'Game on. ':'Rematch. New grid. ')+(r.players[order[r.turn]].name)+' starts.'};return r}
    if(kind==='lobby'){if(r.host!==ME)return;r.status='lobby';r.cells=null;r.order=null;r.seed=null;r.deadline=0;return r}
  })}catch(e){console.error(e);toast('That did not go through. Check the connection.','bad')}
}
async function tryTimeout(turn,deadline){
  if(!roomRef||tryTimeout.busy===deadline)return;tryTimeout.busy=deadline;
  try{await roomRef.transaction(r=>{
    if(!r)return r;
    if(r.status!=='playing'||(r.turn||0)!==turn||r.deadline!==deadline||Date.now()+offset<deadline)return;
    const nm=(r.players[r.order[turn]]||{}).name||'Someone';
    r.ev={id:evId(),kind:'bad',text:"Time's up for "+nm+'.'};advance(r,r.order.length);return r})}catch(e){}
}

let newVersion=false;
async function checkVersion(){
  if(location.protocol!=='https:'||!FB_OK)return;
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
    if(j.v&&j.v!==APP_VERSION&&!newVersion){
      // not in the middle of a game: load the new version straight away (once per version, so it can never loop)
      let done='';try{done=sessionStorage.getItem('bl-reloaded')||''}catch(e){}
      if((!S||S.over)&&done!==j.v){try{sessionStorage.setItem('bl-reloaded',j.v)}catch(e){}const u=new URL(location.href);u.searchParams.set('v',j.v);location.replace(u.toString());return}
      newVersion=true;render()}}catch(e){}
}

function titleWithInfo(t){
  const i=t.lastIndexOf(' '),head=i<0?'':t.slice(0,i+1),last=i<0?t:t.slice(i+1),icon='\u00A0<span class="ib">i</span>';
  // short last words are glued to the icon; long ones (which may need hyphenating) are left free
  return last.replace(/\u00AD/g,'').length<=7?esc(head)+'<span style="white-space:nowrap">'+esc(last)+icon+'</span>':esc(t)+icon}
function fitHeaders(){
  const ts=[...document.querySelectorAll('.hd .ht')];if(!ts.length)return;
  ts.forEach(t=>t.style.fontSize='');
  const fits=t=>{const box=t.parentElement,cs=getComputedStyle(box),ref=box.querySelector('.ref');
    const free=box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-(ref?ref.offsetHeight+1:0);
    return t.scrollHeight<=free+0.5&&t.scrollWidth<=t.clientWidth+0.5};
  const board=document.querySelector('.board'),floor=board&&board.classList.contains('b5')?11:board&&board.classList.contains('b4')?12:13;
  let f=parseFloat(getComputedStyle(ts[0]).fontSize),n=0;
  const setAll=v=>ts.forEach(t=>t.style.fontSize=v+'px');
  while(ts.some(t=>!fits(t))&&f>floor&&n++<40){f-=.5;setAll(f)}
  ts.forEach(t=>{let g=f,m=0;while(!fits(t)&&g>7&&m++<30){g-=.5;t.style.fontSize=g+'px'}});
  // shared top offset per header line: centre the tallest block, start every other block at the same height
  ['.hd.col','.hd.rowh'].forEach(sel=>{
    const hs=[...document.querySelectorAll(sel)];if(!hs.length)return;
    hs.forEach(h=>h.style.paddingTop='');
    const cs=getComputedStyle(hs[0]),pt=parseFloat(cs.paddingTop),pb=parseFloat(cs.paddingBottom);
    const inner=hs[0].clientHeight-pt-pb;
    const tall=Math.max(...hs.map(h=>{const r=h.querySelector('.ref'),t=h.querySelector('.ht');return (r?r.offsetHeight+1:0)+(t?t.offsetHeight:0)}));
    const off=Math.max(0,(inner-tall)/2);
    hs.forEach(h=>h.style.paddingTop=(pt+off)+'px');
  });
  const cb=document.querySelector('.cbrand');
  if(cb){cb.style.fontSize='';const box=cb.parentElement;let h=parseFloat(getComputedStyle(cb).fontSize),k=0;
    while(cb.scrollWidth>box.clientWidth-parseFloat(getComputedStyle(box).paddingLeft)*2&&h>8&&k++<40){h-=.5;cb.style.fontSize=h+'px'}}
  // country names on guessed squares: shrink a name until no word is cut and it stays below the corner badges
  // stamps on guessed squares: shrink the name (and the small line) until no word is cut and the stamp fits its square
  document.querySelectorAll('.cell.flag .gm-stamp').forEach(st=>{const nm=st.querySelector('.sn'),sm=st.querySelector('small');if(!nm)return;
    const fl=!!st.querySelector('.sf'),room=st.clientHeight*(fl?.55:1);let f=Math.min(fl?18:24,Math.round(st.clientWidth*(fl?.17:.21))),k=0;nm.style.fontSize=f+'px';
    const tall=()=>fl?nm.offsetHeight+(sm?sm.offsetHeight:0)>room:st.scrollHeight>room+0.5;
    while((nm.scrollWidth>nm.clientWidth+0.5||tall())&&f>6&&k++<60){f-=.5;nm.style.fontSize=f+'px'}
    if(sm){sm.style.fontSize='';let g=parseFloat(getComputedStyle(sm).fontSize),j=0;while(sm.scrollWidth>st.clientWidth-4&&g>6&&j++<20){g-=.5;sm.style.fontSize=g+'px'}}});
}

}

// The list shows names only, never flags, in every difficulty.
// Easy: names that start with or contain what you typed.
// Normal and Hard: only names that start with what you typed, so the list gives less away.
function matches(q){
  const k=N(q);if(!k)return[];
  const easy=S&&S.diff==='easy';
  const starts=[],inside=[];
  const terr=S&&oldDay(S.daily); // territories can only be typed in daily grids from before ONLY_COUNTRIES_FROM
  for(const c of C){if(c.t&&!terr)continue;if(c.ak.some(a=>a.startsWith(k))||c.k.startsWith(k))starts.push(c);else if(easy&&c.k.includes(k))inside.push(c)}
  return starts.concat(inside).slice(0,8);
}

  if($('playsolo'))$('playsolo').onclick=()=>{screen='solo';clearInterval(tick);S=null;setup.code='';render();window.scrollTo(0,0)};
  if($('create'))$('create').onclick=createRoom;
  if($('menu'))$('menu').onclick=()=>{ui.menu=!ui.menu;drawLayer()};
  if($('reload'))$('reload').onclick=()=>{location.replace(location.pathname+'?v='+Date.now()+(roomCode?'&room='+roomCode:''))};
  if($('jcode'))$('jcode').oninput=e=>{setup.join=e.target.value};
  if($('jcode'))$('jcode').onkeydown=e=>{if(e.key==='Enter')joinRoom($('jcode').value)};
  if($('join'))$('join').onclick=()=>joinRoom($('jcode').value);
  if($('ostart'))$('ostart').onclick=()=>{toast('Building the grid…');setTimeout(()=>onlineAct('start'),40)};
  if($('leave'))$('leave').onclick=leaveRoom;
  if($('copylink'))$('copylink').onclick=()=>{const t=document.getElementById('linkbox').textContent;try{navigator.clipboard.writeText(t).then(()=>toast('Link copied.','good'),()=>toast('Copy blocked. Select the link and copy it.'))}catch(e){}};
  if($('newg')&&S&&S.mode==='online')$('newg').onclick=leaveRoom;
  else if($('newg'))$('newg').onclick=()=>{screen=screenFor(S);clearInterval(tick);S=null;setup.code='';render()};
  if($('again'))$('again').onclick=()=>{if(S.mode==='online'){onlineAct('rematch');return}setup.code='';buildThenStart()};
  if($('copy'))$('copy').onclick=shareResult;
  if($('daily'))$('daily').onclick=()=>{const d=loadDaily();if(USER&&otherDevice(ACCT_TODAY)&&!(d&&d.S.over)){toast('Played on another device with this account. Open it there to see the full grid.');return}playDaily()};
  app.querySelectorAll('[data-info]').forEach(b=>{b.onclick=()=>{ui.info=+b.dataset.info;drawLayer()};b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.click()}}});
  app.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{
    const ci=+b.dataset.cell;
    // a filled square flips over (name, points, how many fitted); flipping again shows the flag
    if(S.cells[ci].o>=0){ui.flip=ui.flip||{};ui.flip[ci]=!ui.flip[ci];b.classList.toggle('flipped',ui.flip[ci]);ui.fresh=-1;b.classList.remove('new');if(S.over&&ui.reveal!==ci){ui.reveal=ci;render()}return}
    if(S.over){ui.reveal=ci;render();return}
    if(S.mode==='online'&&S.turn!==S.me){toast('Wait for your turn. It is '+S.players[S.turn].name+"'s go.");return}
    ui.sel=ci;ui.query='';render();
  });
}
function selectShare(){const el=document.getElementById('share');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}

/* ---- hot reload state ---- */
function start(data){
  const keepUser=setup.user;
  if(data&&data.S){S=data.S;setup={...setup,...(data.setup||{})};}
  // nobody has to pick a name to play: without one you are Guest (sign in later from the home screen or the menu)
  setup.user=setup.user||keepUser||'Guest';
  editingUser=!setup.user;
  if(editingUser||(S&&S.mode==='online'))S=null;
  if(S&&!S.over)startTurn();
  try{if(new URLSearchParams(location.search).has('friends')&&!S){screen='friends';history.replaceState(null,'',location.pathname)}}catch(e){}
  try{const q=new URLSearchParams(location.search).get('room');if(q&&/^[A-Za-z]{4}$/.test(q)){setup.mode='online';setup.join=q.toUpperCase();screen='friends'}}catch(e){}
  // a shared result link (?grid=4E-KQPMT) opens the setup screen ready to play that same grid
  try{const g=new URLSearchParams(location.search).get('grid');if(g&&parseCode(g)){setup.code=g.trim().toUpperCase();if(setup.mode==='online')setup.mode='solo';screen='solo';if(S&&S.mode!=='online')S=null}}catch(e){}
  initAuth();watchLB();
  // back in the room after a reload, unless it is an old or finished one (or an invite link to another room was opened)
  if(FB_OK&&!S){const saved=Geomingo.room.saved('bl-room');
    if(saved&&initFB())db.ref('rooms/'+saved).once('value').then(s=>{const r=s.val();
      if(r&&r.players&&r.players[ME]&&!roomCode&&!S&&Geomingo.room.resume('bl-room',r.status==='over'))listenRoom(saved);else if(!roomCode)Geomingo.room.forget('bl-room')}).catch(()=>{})}
  // back from another app after a while with a finished room still open: go to the home screen
  document.addEventListener('visibilitychange',()=>{if(document.hidden||!roomCode||!room)return;
    if(Geomingo.room.stale(room.status==='over'))leaveRoom().then(()=>{screen='home';render()})});
  render();
}
document.getElementById('creditsbtn').onclick=()=>{ui.credits=true;drawLayer()};
window.claude?.hot?.snapshot?.(()=>({S,setup}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
